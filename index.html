// ---------------------------------------------------------------- full team page
// Existing snapshot rows take precedence, so a fixture reads exactly as it does on Fixtures.
// The served played-match list fills cups and knockout history absent from older snapshots.
const teamFixtureKey = (f) => [f.competition, f.home, f.away, String(f.kickoff).slice(0, 10)].join("|");
const teamExtraKey = (team) => [RESULT.source?.date || "live", RESULT.params.season, RESULT.as_of, team].join("|");
function teamFixtures(team, extraFixtures = []) {
  const rows = new Map();
  const add = (raw, g, competition, kind, source) => {
    if (raw.home !== team && raw.away !== team) return;
    if (raw.result && String(raw.kickoff).slice(0, 10) > RESULT.as_of) return;
    if (!raw.result && !raw.ladder) return;
    const f = {...raw, competition, kind}, key = teamFixtureKey(f);
    if (!rows.has(key)) rows.set(key, {f, g: g || {teams: [f.home, f.away]},
      keys: f.stakes_of || g?.stakes_of || STAKES_OF[kind] || [], competition, kind, source});
  };
  for (const [collection, kind] of [[GW?.leagues, "league"], [GW?.phases, "uefa"]]) {
    for (const [comp, g] of Object.entries(collection || {})) {
      for (const f of g.fixtures || []) add(f, g, comp, kind, "snapshot");
    }
  }
  for (const f of MATCHES?.fixtures || []) {
    if (f.result) continue;
    const g = (f.kind === "league" ? GW?.leagues : GW?.phases)?.[f.competition];
    add(f, g, f.competition, f.kind || kindOf(f.competition), "forecast");
  }
  for (const f of extraFixtures) {
    if (f.result) add(f, null, f.competition, f.kind || kindOf(f.competition), "history");
  }
  return [...rows.values()].sort((a, b) => a.f.kickoff.localeCompare(b.f.kickoff)
    || COMP_ORDER.indexOf(a.competition) - COMP_ORDER.indexOf(b.competition)
    || a.f.home.localeCompare(b.f.home) || a.f.away.localeCompare(b.f.away));
}

function teamHistoryData(team) {
  const allDates = HISTORY?.dates || [], meta = HISTORY?.meta || {};
  const day = RESULT.source?.date || RESULT.as_of;
  const indices = allDates.map((date, i) => ({date, i})).filter(({date}) => date <= day
    && (meta[date]?.as_of || date) <= RESULT.as_of).map(({i}) => i);
  const dates = indices.map((i) => allDates[i]);
  const select = (values, scale = 1) => indices.map((i) => values?.[i] == null ? null : values[i] * scale);
  const byComp = [];
  for (const b of [...RESULT.leagues, ...RESULT.uefa, ...(RESULT.cups || [])]) {
    if (!b.teams.some((t) => t.team === team)) continue;
    const s = HISTORY?.competitions?.[b.competition]?.[team] || {};
    const kind = kindOf(b.competition), metrics = kind === "league"
      ? [["p_win", "Title"], ["p_ucl", "UCL"], ["p_releg", "REL"]]
      : kind === "uefa" ? [["p_win", "Win"], ["p_top8", "Top 8"]] : [["p_win", "Win"]];
    const chance = new Map(metrics.filter(([key]) => s[key]?.some((v) => v != null))
      .map(([key, name]) => [name, select(s[key], 100)]));
    const points = new Map(s.mean_pts?.some((v) => v != null) ? [["XPTS", select(s.mean_pts)]] : []);
    byComp.push({competition: b.competition, kind, chance, points});
  }
  const r = HISTORY?.ratings?.[team] || {};
  const ratings = new Map(["elo", "att", "def"].filter((key) => r[key]?.some((v) => v != null))
    .map((key) => [key, select(r[key])]));
  const models = [...new Set(indices.map((i) => modelName(meta[allDates[i]] || {}, allDates[i])))];
  return {dates, indices, byComp, ratings, models};
}

function teamLine(team, id, vals, dates, fmt, ylab = "", readout = dates, mark = null) {
  const available = new Map([...vals].filter(([, v]) => v.some((x) => x != null)));
  if (!available.size) return `<p class="note">This history has no values for this view.</p>`;
  const comp = `Team ${team} ${id}`;
  const block = {competition: comp, teams: [...available.keys()].map((name) => ({team: name}))};
  const every = Math.max(1, Math.ceil(dates.length / 8));
  const labels = dates.map((d, i) => i === 0 || i === dates.length - 1 || i % every === 0 ? String(d).slice(5, 10) : "");
  return `<div data-team-series="${id}" data-team-series-count="${available.size}">${lineChart({block, id,
    vals: available, labels, readout, fmt, ylab, what: id === "lcteamform" ? "a played match" : "a snapshot",
    mark, markLabel: mark == null ? "" : moveName()})}</div>`;
}

    aria-pressed="${b === chosen}">${label(b.competition)}</button>`).join("")}</div>`;

    ${chosen?.points.size ? `<button data-team-trend="points" aria-pressed="${Boolean(points)}">XPTS</button>` : ""}</div>`;
  const mark = data.indices.indexOf(snapAt(dwin()));
  const outlook = `<div class="panel" data-team-history="outlook" data-team-history-comp="${esc(chosen?.competition || "")}">
    ${panelTitle("Season outlook", "", true)}${compPicker}${metricPicker}
    <div class="legend"><span><b>${points ? "XPTS" : "Chances"}</b> in ${esc(label(chosen?.competition || "this competition"))} · one point a snapshot${points ? "" : " · percentages"}
      ${mark >= 0 ? ` · dashed line: <b>${moveName()}</b> starts` : ""}</span></div>
    ${chosen ? teamLine(team, "lcteamoutlook", points ? chosen.points : chosen.chance, dates,
      (v) => v.toFixed(1) + (points ? "" : "%"), points ? "expected final points" : "chance (%)", dates,
      mark >= 0 ? mark : null) : '<p class="note">No competition history for this side.</p>'}</div>`;
  const strength = TEAM_RATING === "strength";
  const rv = new Map([...ratings].filter(([key]) => strength ? key === "att" || key === "def" : key === "elo")
    .map(([key, values]) => [key === "elo" ? "Elo" : key.toUpperCase(), values]));
  return outlook + `<div class="panel" data-team-history="ratings"><h2>Rating and strength</h2>
    <div class="seg small opt"><button data-team-rating="elo" aria-pressed="${!strength}">Elo</button>

    <div class="legend"><span><b>${strength ? "ATT / DEF" : "Elo"}</b> at each snapshot${strength ? " · against the five leagues’ average side · DEF lower is fewer allowed" : " · the results rating"}
      · missing ratings leave gaps</span></div>
    ${teamLine(team, "lcteamratings", rv, dates, (v) => v.toFixed(strength ? 2 : 0), strength ? "npxG a match" : "Elo", dates,
      mark >= 0 ? mark : null)}</div>`;
}

function teamRunIn(team) {
  const sections = [];
  for (const [blocks, collection, kind] of [[RESULT.leagues, GW?.leagues, "league"], [RESULT.uefa, GW?.phases, "uefa"]]) {
    for (const block of blocks) {
      const row = block.teams.find((t) => t.team === team), g = collection?.[block.competition];
      if (!row || !g || !g.fixtures.some((f) => !f.result && (f.home === team || f.away === team))) continue;
      sections.push(`<div data-team-runin="${esc(block.competition)}"><h3>${label(block.competition)}</h3>${vizRI({...block, teams: [row]}, kind, g)}</div>`);
    }
  }
  return `<div class="panel"><h2>Run-in</h2>${sections.join("") || '<p class="note">No remaining league or league-phase fixtures recorded in this snapshot.</p>'}</div>`;
}

function teamFormData(team, fixtures) {
  const played=fixtures.filter(({f})=>Array.isArray(f.result)&&f.result.length===2)
    .slice().sort((a,b)=>ROUTES.fixtureInstant(a.f.kickoff,a.f.competition)-ROUTES.fixtureInstant(b.f.kickoff,b.f.competition)||teamFixtureKey(a.f).localeCompare(teamFixtureKey(b.f)));
  const history=played.map(({f})=>({...orient(f,f.home===team),key:teamFixtureKey(f),competition:f.competition}));
  return history.map((n,i)=>{
    const last=history.slice(Math.max(0,i-4),i+1),valid=x=>Array.isArray(x.xg)&&x.xg.length===2&&x.xg.every(v=>Number.isFinite(v)&&v>=0);
    const known=last.filter(valid).length,complete=known===last.length;
    return {...n,window:last.map(x=>x.key),known,for:complete?last.reduce((sum,x)=>sum+x.xg[0],0)/last.length:null,
      against:complete?last.reduce((sum,x)=>sum+x.xg[1],0)/last.length:null};
  });
}
function teamForm(team, fixtures) {
  const rows=teamFormData(team,fixtures),dates=rows.map(r=>ROUTES.clubDay(r));
  const vals=new Map([["xG for",rows.map(r=>r.for)],["xG against",rows.map(r=>r.against)]]);
  const readout=rows.map(r=>`${fixDay(r.kickoff,r.competition)} · ${r.isHome?'v':'at'} ${r.opponent}`);
  const invalid=rows.filter(r=>Array.isArray(r.xg)&&r.xg.some(v=>v!=null&&(!Number.isFinite(v)||v<0))).length;
  return `<div class="panel" data-team-form="${rows.length}"><h2>Form — all competitions</h2>
    <div class="legend"><span><b>xG for / against</b> a match · last five actual matches · shorter starts show their count · missing xG leaves a gap</span></div>
    ${invalid?`<p class="zbad" role="alert">${invalid} matches contain invalid xG; affected windows are unavailable.</p>`:''}
    ${rows.length?teamLine(team,"lcteamform",vals,dates,v=>v.toFixed(2),"xG a match, last five",readout):'<p class="note">No played matches recorded here.</p>'}</div>`;
}

async function drawHistory(comp, spec) {
  const target = $("hview") || $("cview");
  const {metric, title, invert = false, scale = 1, unit = ""} = spec;
  if (!HISTORY) {
    target.innerHTML = `<div class="panel"><p class="note">loading history …</p></div>`;
    try { HISTORY = await jget("/api/history?season=" + RESULT.params.season); }
    catch (e) { return void (target.innerHTML = `<div class="panel"><p class="note err">${e.message}</p></div>`); }
  }
  fillMovers();
  wireOverview();
  const series = (HISTORY.competitions || {})[comp] || {};
  const dates = HISTORY.dates;
  if (dates.length < 2) {
    target.innerHTML = `<div class="panel">
      <p class="note">${dates.length} snapshot${dates.length === 1 ? "" : "s"} so
      far, and a trend needs at least two. The nightly job adds one a day; to fill in the season
      already played, run
      <code>scripts/nightly.py --date D --as-of D --only project</code> for each date — the
      <code>--as-of</code> rewind makes each one a real point-in-time projection rather than a
      copy of today.</p></div>`;
    return;
  }
  const last = (v) => { for (let i = v.length - 1; i >= 0; i--) if (v[i] != null) return v[i]; return null; };
  const vals = new Map(Object.entries(series)
    .filter(([, d]) => d[metric] && d[metric].some((x) => x != null))
    .map(([team, d]) => [team, d[metric].map((x) => x == null ? null : x * scale)]));
  if (!vals.size) {
    target.innerHTML = `<div class="panel"><p class="note">No ${title.toLowerCase()} recorded for
      this competition yet.</p></div>`;
    return;
  }
  // One chart for every series on the page (`lineChart`): every side faint, up to four lit in
  // colours that stay theirs on every chart of the competition, the latest night at the right
  // edge of the panel. The sides run best now first; the top three are lit to begin with.
  const block = [...RESULT.leagues, ...RESULT.uefa, ...(RESULT.cups || [])].find((x) => x.competition === comp)
    || {competition: comp, teams: [...vals.keys()].map((team) => ({team}))};
  const order = [...vals.keys()].sort((x, y) => ((invert ? 1 : -1) * ((last(vals.get(x)) ?? 0) - (last(vals.get(y)) ?? 0)))
    || x.localeCompare(y));
  const n = dates.length, every = Math.max(1, Math.ceil(n / 9));
  const labels = dates.map((d, i) => i === n - 1 || (i % every === 0 && n - 1 - i >= every * 0.6) ? d.slice(5) : "");
  const start = snapAt(dwin()), w = dwin();
  const fmt = (v) => v.toFixed(1) + unit;
  target.innerHTML = `<div class="panel">
    <h2>${title} over time</h2>
    <div class="legend"><span>One point a night · ${Number.isFinite(RESULT.mc_se_pp)?`per-snapshot sampling SE ≤${RESULT.mc_se_pp}pp; change uncertainty not estimated`:"sampling scale unavailable"}${start >= 0 && start < n - 1
      ? ` · the dashed line: where <b>${moveName()}</b> starts` : ""}</span><span>Click a side to light it (four at most)</span></div>
    ${lineChart({block, id: "lchist", vals, labels, realUpTo: n - 1, invert, order, fmt,
      tick: (v) => (Math.abs(v - Math.round(v)) < 1e-9 ? v.toFixed(0) : v.toFixed(1)) + unit,
      rank: (t) => { const k = order.indexOf(t.team); return k < 0 ? 999 : k; },
      readout: dates, what: "a night", mark: start >= 0 && start < n - 1 ? start : null,
      markLabel: w ? moveName() : ""})}</div>`;
  if (typeof target.querySelectorAll === "function") {
    target.querySelectorAll("[data-hl]").forEach((el) => el.addEventListener("click", () => {
      toggleHl(comp, el.dataset.hl);
      drawHistory(comp, spec);
    }));
    attachTips(target);
  }
  attachLineCrosshair("lchist");
  afterRender();
}

 try{
  const payloads=await Promise.all([atlasData(team),...(other?[atlasData(other)]:[])]);
  if(!root.isConnected||RESULT!==result||ATLAS_TEAM!==team||ATLAS_COMPARE!==other||root.dataset.atlasScope!==scope||root.dataset.atlasChart!==chart)return;
  const types=[...new Set(payloads.flatMap(p=>p.matches.flatMap(m=>m.shots.map(s=>s.situation))).filter(Boolean))].sort();root.querySelector('#atlas-type-slot').innerHTML=clubSelect('atlas-type','Shot situation',[['all','Every situation'],...types.map(t=>[t,t.replace(/([a-z])([A-Z])/g,'$1 $2')])],ATLAS_TYPE);
  const opts=atlasOptions(scope),opposing={...opts,side:opts.side==='for'?'against':'for'};
  const maxXg=Math.max(0,...payloads.flatMap((p,i)=>MC.atlasSelection(p,i?opposing:opts).bins.map(b=>b.xg)));
  const output=root.querySelector('.atlas-output');output.innerHTML=`<p class="note"><b>Every attempt attacks right</b> · goals are diamonds · shot xG includes penalties · own goals and shootouts excluded · grid totals use located attempts · shared xG colour scale · select a grid cell to filter${other?' · opponent uses the opposite For/Against view':''}</p>${ATLAS_PERIOD!=='season'&&!opts.since?'<p class="note zbad" role="status">This snapshot has no retained rolling-window anchor; no windowed attempts are shown.</p>':''}${ATLAS_BIN?'<button class="ghost" id="atlas-clear-region">Clear selected region</button>':''}<div class="atlas-grid ${other?'atlas-comparison':''}">${atlasEvidenceHtml(payloads[0],opts,chart,PALETTE[0],maxXg)}${other?atlasEvidenceHtml(payloads[1],opposing,chart,PALETTE[1],maxXg):''}</div>`;
  const all=payloads.flatMap((p,i)=>MC.atlasSelection(p,i?opposing:opts).universe),byId=new Map(all.map(s=>[s.uid,s]));
  output.querySelectorAll('[data-atlas-bin]').forEach(b=>b.onclick=()=>{ATLAS_BIN=ATLAS_BIN===b.dataset.atlasBin?'':b.dataset.atlasBin;writeHash(true);hydrateAtlas(root);});
  if(root.querySelector('#atlas-clear-region'))root.querySelector('#atlas-clear-region').onclick=()=>{ATLAS_BIN='';writeHash(true);hydrateAtlas(root);};
  output.querySelectorAll('[data-atlas-shot]').forEach(b=>b.onclick=()=>{const s=byId.get(b.dataset.atlasShot);if(s){ATLAS_SHOT_TARGET={key:MC.fixtureKey(s.fixture),competition:s.fixture.competition,order:s.order};openMatchCentre(MC.fixtureKey(s.fixture),s.fixture.competition);}});
  output.querySelectorAll('g[role="button"]').forEach(b=>b.onkeydown=e=>{if(['Enter',' '].includes(e.key)){e.preventDefault();b.onclick();}});
  wire();wireAccessibility(output);if(focus==='atlas-type'&&document.activeElement===document.body)root.querySelector('#atlas-type')?.focus({preventScroll:true});
 }catch(e){if(root.isConnected&&RESULT===result)root.querySelector('.atlas-output').innerHTML=`<p class="note zbad" role="alert">Shot evidence unavailable: ${esc(e.message)}</p>`;}
}

// Static boot is owned by pwa.mjs.
</script>
<script type="module">import {start} from "/MusSim/assets/pwa.mjs"; await start(boot);</script>
