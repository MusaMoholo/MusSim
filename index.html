<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MusSim</title>
<meta name="theme-color" content="#11161d">
<meta name="apple-mobile-web-app-title" content="MusSim">
<style>
  :root {
    /* earthy: warm espresso ground, cream ink, terracotta for emphasis and probability, moss /
       mustard / brick / slate for what a place leads to */
    --bg:#11161d; --panel:#1b222c; --panel2:#293443; --line:#435166; --ink:#f0f4fa;
    --dim:#b2bfce; --accent:#e3a66c; --good:#a2ce8c; --warn:#e4c371; --bad:#f09787;
    --heat:227,166,108; color-scheme:dark; --mid:#9cc5e7;
    --surface:#222d3a; --stripe:#202a36; --home:#9ac6ed; --away:#edc18a;
    /* text on the accent and on a strong heat cell: dark here, where terracotta is the light
       thing on the page; white on the light ground, where it is the dark one */
    --on-accent:#1a140e;
    /* fixture difficulty, 1 very hard .. 5 very easy */
    --f1:#b9463a; --f2:#d98b6b; --f3:#8c8273; --f4:#a9bf86; --f5:#6f8f3f;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme=dark]) {
      --bg:#f3eee4; --panel:#fbf8f1; --panel2:#efe8db; --line:#ddd1bf; --ink:#2b241c;
      --dim:#6e6253; --accent:#a65a2e; --good:#5a7a32; --warn:#9a7414; --bad:#9e3328;
      --heat:166,90,46; color-scheme:light; --mid:#4f6f80; --on-accent:#fff;
      --surface:#fffdf8; --stripe:#f2eee6; --home:#2b618b; --away:#8a5726;
      --f1:#9e3328; --f2:#d0846a; --f3:#b5ab9a; --f4:#93ad6a; --f5:#557a2a;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  .wrap{max-width:1280px;margin:0 auto;padding:20px 16px 60px}
  .wrap:has(#view table[data-overview]){max-width:1760px}
  h1{font-size:19px;margin:0 0 2px;letter-spacing:-.01em}
  h2{font-size:14px;margin:0 0 10px}
  h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin:0 0 8px}
  .sub{color:var(--dim);font-size:12.5px;margin-bottom:16px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:14px 16px;margin-bottom:16px}
  .row{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end}
  label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--dim);margin-bottom:5px}
  select,input[type=number],input[type=date]{background:var(--panel2);color:var(--ink);border:1px solid var(--line);
    border-radius:7px;padding:7px 9px;font:inherit;font-size:13px;min-width:96px}
  button{background:var(--accent);color:var(--on-accent);border:0;border-radius:7px;padding:8px 16px;
    font:inherit;font-weight:600;cursor:pointer;font-size:13px}
  button.ghost{background:transparent;color:var(--dim);border:1px solid var(--line);font-weight:500}
  button:disabled{opacity:.45;cursor:default}
  .chk{display:inline-flex;align-items:center;gap:6px;font-size:13px}
  .chk input{accent-color:var(--accent);width:15px;height:15px}
  .bar{height:5px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:10px}
  .bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
  .status{font-size:12.5px;color:var(--dim);margin-top:8px;font-variant-numeric:tabular-nums}
  .err{color:var(--bad);white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:12px}
  .tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px;align-items:start}
  .tabs .tabgroup{min-width:0;padding:12px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
  .tabs .tabgroup>div{display:grid;grid-template-columns:1fr;gap:5px}
  .tabs button{text-align:left;min-height:36px;width:100%}
  @media(min-width:721px) and (max-width:1100px){.tabs{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .tabs.explore-tabs{grid-template-columns:1fr}
  .tabs.explore-tabs .tabgroup>div{grid-template-columns:repeat(3,minmax(0,1fr))}
  #all-analysis>.panel{padding:0;border:0;background:transparent}
  .tabgroup{display:flex;flex-direction:column;gap:5px}
  .tabgroup>span{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;
    color:var(--dim);padding-left:2px}
  .tabgroup>div{display:flex;flex-wrap:wrap;gap:6px}
  .tabs button{background:var(--panel2);color:var(--dim);border:1px solid var(--line);
    font-weight:500;padding:7px 13px}
  .tabs button[aria-selected=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
  /* Sticky table cells stay in their scroll panel, below neighbouring controls. */
  .scroll{overflow-x:auto;max-width:100%;isolation:isolate}
  .scroll:focus-visible,.scroll :is(button,a,input,select):focus-visible{outline-offset:-2px}
  .row:has(+.scroll){margin-bottom:14px}
  thead th{z-index:3}
  thead th.team{z-index:4}
  tbody th{top:auto}
  #tabs[hidden],#mobile-navigation[hidden],#workspace-notice[hidden]{display:none!important}
  .workspace-nav{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
  .workspace-nav button{background:var(--panel2);border:1px solid var(--line);color:var(--dim);padding:9px 18px}
  .workspace-nav button[aria-current=page]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
  .workspace-saved{margin:0 0 16px;color:var(--dim);font-size:12px}
  .workspace-saved summary{cursor:pointer;width:fit-content}
  .workspace-saved input,.home-intro select,#workspace-club-search,#player-search-query{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:7px 9px;font:inherit;max-width:100%}
  .workspace-saved input[type=file]{max-width:240px}
  .saved-views{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:10px}
  .saved-views li{display:flex;gap:5px}
  .home-intro{display:flex;justify-content:space-between;align-items:center;gap:22px;padding:28px 24px}
  .home-intro h2{font-size:27px;line-height:1.2;letter-spacing:-.025em;max-width:620px;margin:5px 0 13px}
  .eyebrow{color:var(--accent);font-size:10px;letter-spacing:.12em;font-weight:700}
  .home-intro .note{margin:0}
  .home-section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .home-section-head .note{margin:0}
  .following-strip{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px}
  .following-strip>div{display:flex;gap:10px;align-items:center;padding:8px 12px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
  .following-strip img,.home-agenda img{height:20px;width:20px;object-fit:contain;margin-right:6px;vertical-align:middle}
  button.text-button{border:0;background:transparent;color:var(--ink);padding:0;font-weight:500;text-align:left}
  button.text-button:hover{text-decoration:underline;text-underline-offset:3px}
  .follow-button{padding:4px 9px!important;font-size:11px!important}
  .follow-button[aria-pressed=true]{color:var(--good);border-color:var(--good)}
  .source-warning{border-color:var(--bad);color:var(--bad)}
  .source-warning p{font-size:12px}
  .wrap:has(#out.workspace-split){max-width:1760px}
  #out.workspace-split{display:grid;grid-template-columns:minmax(0,1fr) 420px;column-gap:18px;align-items:start}
  .workspace-split #workspace-navigation{grid-column:1/-1;grid-row:1}
  .workspace-split #tabs,.workspace-split #mobile-navigation{grid-column:1/-1;grid-row:2}
  .workspace-split #matchcard,.workspace-split #entitycard{grid-column:2;grid-row:4;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow-y:auto}
  .workspace-split #matchcard:empty,.workspace-split #entitycard:empty,.workspace-split #teamcard:empty{display:none}
  #entitycard .head,#matchcard .head{flex-wrap:wrap;gap:8px}
  .workspace-split #matchcard .grid2{grid-template-columns:minmax(0,1fr)!important}
  .workspace-split #matchcard .match-odds th{padding:8px 4px;white-space:normal;font-size:10px}
  .workspace-split #matchcard .match-odds td{padding:8px 4px 12px;font-size:22px}
  .workspace-split #matchcard .match-odds td.proj{font-size:19px}
  #entitycard .comp{margin-top:14px}
  .player-facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:12px 0}
  .player-facts dt{font-size:11px;color:var(--dim)}.player-facts dd{font-weight:700;margin:3px 0 0}
  #workspace-search-dialog{width:min(780px,calc(100vw - 32px));max-height:85vh;box-sizing:border-box;overflow:auto;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:20px}
  #workspace-search-dialog::backdrop{background:#0008}
  #workspace-search-dialog .head{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .entity-query{flex:1;min-width:180px}.entity-query input{box-sizing:border-box;width:100%;padding:9px;font:inherit;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:7px}
  #workspace-search-results{list-style:none;padding:0;margin:14px 0 0}
  #workspace-search-results li{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding:6px 0}
  .entity-result{flex:1;display:flex;align-items:center;gap:12px;text-align:left;background:transparent;color:var(--ink);padding:9px;min-width:0}
  .entity-result span:last-child{min-width:0}.entity-result small{display:block;color:var(--dim);margin-top:4px;overflow-wrap:anywhere}
  .entity-kind{font-size:10px;text-transform:uppercase;color:var(--dim);width:45px;flex-shrink:0}
  .following-missing{display:flex;gap:8px;align-items:center;overflow-wrap:anywhere;font-size:12px;padding:6px 0}
  @media(max-width:720px){#workspace-search-launch,#workspace-search-open{width:100%}.entity-result{gap:6px;padding:6px}.entity-kind{width:40px}}
  .workspace-split #teamcard{grid-column:2;grid-row:4;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow-y:auto}
  .workspace-split #view{grid-column:1;grid-row:4}
  .workspace-split #teamcard .head{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .workspace-split #teamcard .head .note{flex-basis:100%;order:2}
  .workspace-split #teamcard .head .x{white-space:nowrap}
  .workspace-split #teamcard .comps{display:block}
  .workspace-split #teamcard .comp{margin-bottom:12px}
  #teamcard details{margin-top:12px;color:var(--dim);font-size:12px}
  #teamcard summary{cursor:pointer;margin-bottom:8px}
  @media(max-width:720px){.home-intro{display:block;padding:20px 16px}.home-intro h2{font-size:24px}.home-intro>div+div{margin-top:16px}.home-intro select{width:100%}.workspace-nav button{padding:8px 12px}.workspace-saved .row>div{width:100%}.workspace-saved input{width:100%}}
  table[data-overview] [hidden]{display:none!important}
  table[data-overview] .rankcol{position:sticky;left:0;width:46px;min-width:46px;max-width:46px;
    text-align:center;background:var(--surface);color:var(--dim);border-right:1px solid var(--line);z-index:2}
  table[data-overview] th.rankcol{z-index:4}
  table[data-overview] .rankcol+.team{left:46px}
  .metric-help{display:inline-flex;justify-content:center;align-items:center;width:18px;height:18px;
    min-width:18px;padding:0;margin-left:4px;border:1px solid var(--line);border-radius:50%;
    background:var(--panel2);color:var(--dim);vertical-align:middle;font-size:10px}
  .metric-help::after{content:"?"}
  .column-note{font-size:11px;margin-bottom:8px;overflow-wrap:anywhere}
  #metric-help-dialog{max-width:520px;width:calc(100% - 32px);padding:22px;border:1px solid var(--line);
    border-radius:10px;background:var(--panel);color:var(--ink);font:inherit}
  #metric-help-dialog::backdrop{background:rgb(0 0 0 / .55)}
  .metric-evidence{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px;font-size:12px}
  .metric-evidence dt{color:var(--dim)}
  .metric-evidence dd{margin:0;overflow-wrap:anywhere}
  .mobile-only{display:none}
  .grid2>*,.row>*,#view,#teamcard,#matchcard,#cview,#hview{min-width:0}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  [data-keyboard-action]:focus-visible,th[data-sort]:focus-visible{outline-offset:-3px}
  .health-details summary{cursor:pointer;color:var(--dim);font-size:12px}
  .health-details[open] summary{margin-bottom:8px}
  table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
  /* A cup ladder is six columns wide. At width:100% the team column absorbs all the slack and
     the numbers end up pinned to the far right, a screen away from the name they belong to. */
  table.narrow{width:auto;min-width:min(100%,460px)}
  table.narrow td.team,table.narrow th.team{padding-right:28px}
  th,td{padding:5px 8px;text-align:right;white-space:nowrap;font-size:12.5px;
    border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:600;font-size:10.5px;text-transform:uppercase;
    letter-spacing:.05em;position:sticky;top:0;background:var(--panel)}
  td.team,th.team{text-align:left;font-size:13px;position:sticky;left:0;background:var(--panel);
    max-width:200px;overflow:hidden;text-overflow:ellipsis}
  /* A tie sheet has three text columns and no single row label, so none of them stick. */
  td.tie,th.tie{text-align:left;font-size:13px;max-width:200px;overflow:hidden;text-overflow:ellipsis}
  tbody tr:hover td,tbody tr:hover td.team{background:var(--panel2)}
  .heat{width:40px;min-width:36px;padding:5px 0;text-align:center;font-size:10.5px;
    color:var(--heat-dark-ink,var(--on-accent));border-radius:3px}
  /* a distribution too wide for the page scrolls at its natural width rather than squeezing
     36 places until their numbers run together; the team column stays pinned */
  table.wide{width:auto}
  .heat.z{color:var(--dim)}
  .pill{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;
    background:var(--panel2);color:var(--dim);border:1px solid var(--line)}
  .pill.on{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent)}
  .pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
  .pill.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
  .note{color:var(--dim);font-size:12px;margin:0 0 12px}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
  .player-badges{display:inline-flex;gap:3px;vertical-align:middle;margin-right:7px}
  .player-badges img{width:20px;height:20px;object-fit:contain}
  .player-club{cursor:pointer;white-space:nowrap}
  .player-club:hover{text-decoration:underline;text-underline-offset:3px}
  .player-rank{display:inline-block;min-width:24px;color:var(--dim);font-size:11px}
  .sample-grid{grid-template-columns:minmax(0,2.6fr) minmax(230px,1fr);align-items:start}
  @media(max-width:850px){.sample-grid{grid-template-columns:minmax(0,1fr)}}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:3px 0;
    border-bottom:1px solid var(--line);font-size:12.5px}
  .kv span:last-child{font-variant-numeric:tabular-nums}
  .legend{display:flex;gap:10px;align-items:center;color:var(--dim);font-size:11.5px;
    margin-bottom:10px;flex-wrap:wrap}
  .swatch{display:inline-block;width:46px;height:9px;border-radius:2px;
    background:linear-gradient(90deg,rgba(var(--heat),.07),rgba(var(--heat),1))}
  .keys{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:10px}
  .keys label{display:inline-flex;align-items:center;gap:5px;text-transform:none;letter-spacing:0;
    font-size:12px;color:var(--ink);margin:0;cursor:pointer}
  .keys i{width:11px;height:11px;border-radius:3px;display:inline-block}
  svg text{font:11px ui-sans-serif,system-ui,sans-serif;fill:var(--dim)}
  /* a team name is a link to its card; its rows are highlighted on every table while it is open */
  td.team[data-team]{cursor:pointer}
  td.team[data-team]:hover{text-decoration:underline;text-decoration-color:var(--dim);
    text-underline-offset:3px}
  tr.focus td,tr.focus td.team{background:color-mix(in srgb,var(--accent) 16%,var(--panel))}
  /* the line under the last place of a zone: 8th and 24th in a league phase, the last European
     place and the first relegation place in a league. Marked on the team cell, not the row, so
     every <tr> stays a bare "<tr>" -- render_check splits tables on exactly that */
  tr:has(td.zend) td{border-bottom:2px solid color-mix(in srgb,var(--dim) 55%,transparent)}
  table.sortable th[data-sort]{cursor:pointer;user-select:none}
  table.sortable th[data-sort]:hover{color:var(--ink)}
  th .arrow{font-size:9px;margin-left:2px;color:var(--accent)}
  /* table zones: places that qualify, that go to a play-off, that go out or down */
  .zgood{color:var(--good)!important;font-weight:600}
  .zwarn{color:var(--warn)!important;font-weight:600}
  .zbad{color:var(--bad)!important;font-weight:600}
  .zmid{color:var(--mid)!important;font-weight:600}
  th.zh.mid{border-bottom-color:var(--mid);color:var(--mid)}
  th.nc{text-transform:none;letter-spacing:.02em;font-size:11.5px}
  /* the next five fixtures, one block each, coloured by difficulty */
  td.fdr{white-space:nowrap}
  .card td.fdr{border-bottom:0;padding:0}
  .fdr i{display:inline-block;width:13px;height:13px;border-radius:3px;margin-left:2px;
    vertical-align:middle}
  .fdrk{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:middle}
  i.b1{background:var(--f1)} i.b2{background:var(--f2)} i.b3{background:var(--f3)}
  i.b4{background:var(--f4)} i.b5{background:var(--f5)} .fdr i.b0{background:var(--panel2)}
  td.mv{font-size:11.5px;color:var(--dim)}
  td.mv.up{color:var(--good)} td.mv.down{color:var(--bad)}
  th.zh{text-align:center;font-size:10px;border-bottom:2px solid var(--line);position:static}
  th.zh.good{border-bottom-color:var(--good);color:var(--good)}
  th.zh.warn{border-bottom-color:var(--warn);color:var(--warn)}
  th.zh.bad{border-bottom-color:var(--bad);color:var(--bad)}
  .card{background:var(--panel);border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));
    border-radius:10px;padding:14px 16px;margin-bottom:16px}
  .card .head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
    margin-bottom:10px}
  .card .head h2{margin:0;font-size:16px}
  .card .comps{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
  .card .comp{background:var(--panel2);border:1px solid var(--line);border-radius:8px;
    padding:10px 12px;cursor:pointer}
  .card .comp:hover{border-color:var(--accent)}
  [data-match]{cursor:pointer}
  .whatif{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
  .whatif>summary{cursor:pointer;color:var(--accent);font-size:12px;font-weight:600;width:fit-content}
  .whatif[open]>summary{margin-bottom:12px}
  td.haul{text-align:left;font-size:12.5px;white-space:normal;min-width:180px}
  .card .comp h3{margin:0 0 6px;color:var(--ink);font-size:11.5px}
  .stat{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;font-variant-numeric:tabular-nums}
  .stat b{font-weight:600}
  .stat span{color:var(--dim)}
  .stat .kv2{white-space:nowrap;color:var(--ink)}
  .stat .kv2 span{margin-right:5px}
  .spark{display:flex;align-items:flex-end;gap:1px;height:22px;margin-top:8px}
  .spark i{flex:1;background:var(--accent);border-radius:1px 1px 0 0;min-height:1px}
  .fbar{display:grid;grid-template-columns:110px 1fr 56px;align-items:center;gap:10px;
    font-size:12.5px;margin:4px 0;font-variant-numeric:tabular-nums}
  .fbar .track{height:10px;background:var(--panel2);border-radius:5px;overflow:hidden}
  .fbar .track i{display:block;height:100%;background:var(--accent)}
  .fbar span:last-child{text-align:right}
  button.x{background:transparent;color:var(--dim);border:1px solid var(--line);padding:3px 10px;
    font-weight:500}
  /* a projected rating in a Gameweek table: the worlds' average, not a fact */
  td.proj,.proj{color:var(--dim);font-style:italic}
  /* a played match's xG beside its score */
  .xgs{color:var(--dim);font-size:11.5px;margin-left:3px}
  /* the Visualisations view: one chart at a time, picked from a segmented row */
  .seg{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 12px;padding:4px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);width:fit-content;max-width:100%}
  .seg button{background:var(--panel2);color:var(--dim);border:1px solid var(--line);font-weight:500;
    padding:6px 12px}
  .seg button[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
  .seg.small button{padding:4px 10px;font-size:12px}
  /* a chart's own settings: pills, so they never read as more charts to pick */
  .seg.opt button{border-radius:6px;padding:5px 11px;font-size:11.5px;min-height:32px}

<body>
<div class="wrap">
  <h1>MusSim</h1>
  <div class="sub">Match previews, club performance and season forecasts.</div>

  <div class="panel snapshot-toolbar">
    <div class="row" style="justify-content:space-between">
      <div class="row">
        <div><label for="snap">Snapshot</label><select id="snap"></select></div>
        <div id="legacy-team-find"><label for="find">Find a team</label><input id="find" list="teamlist"
          placeholder="any competition…" autocomplete="off" style="background:var(--panel2);
          color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:7px 9px;
          font:inherit;font-size:13px;width:210px"><datalist id="teamlist"></datalist></div>
        <div id="workspace-search-launch" hidden><label for="workspace-search-open">Search football</label><button class="ghost" id="workspace-search-open">Search football…</button></div>
        <div id="snapinfo" class="status" style="margin:0 0 6px"></div>
      </div>

    </div>
    <div id="health" style="margin-top:10px"><span class="note" role="status">Loading dashboard…</span></div>
    <details id="run-data" class="health-details"><summary>Run &amp; data</summary>
      <p id="generation-info" class="note"></p><div id="pipeline-info"></div>
      <button id="livetoggle" class="ghost">Run one live…</button>
    </details>
  </div>

  <div class="panel" id="livepanel" hidden>
    <h3>Live run — moves a knob and re-simulates now, at the cost of the wait</h3>
    <div class="row">
      <div><label for="season">Season</label><select id="season"></select></div>
      <div><label for="worlds">Worlds</label><input id="worlds" type="number" min="1" max="5000" step="100"></div>
      <div><label for="gain">npxG gain</label><input id="gain" type="number" min="0" max="0.5" step="0.01"></div>
      <div><label for="drift">Drift / day</label><input id="drift" type="number" min="0" max="0.05" step="0.001"></div>
      <div><label for="seed">Seed</label><input id="seed" type="number" min="0" step="1"></div>
      <div><label for="asof">As of</label><input id="asof" type="date" style="background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:7px 9px;font:inherit;font-size:13px"></div>
      <div><label>Feedback</label><div style="display:flex;gap:12px">
        <span class="chk"><input type="checkbox" id="elofb"><span>Elo</span></span>
        <span class="chk"><input type="checkbox" id="npxgfb"><span>npxG</span></span></div></div>
      <div><label>Played</label><span class="chk"><input type="checkbox" id="replay"><span>keep real</span></span></div>
      <div style="display:flex;gap:8px"><button id="run">Run</button><button id="stop" class="ghost" hidden>Stop</button></div>
    </div>
    <div class="bar" id="barwrap" hidden><i id="bar"></i></div>
    <div class="status" id="status"></div>
    <div class="status err" id="error" hidden></div>
  </div>

  <div id="snapshot-recovery" class="panel source-warning" hidden></div>
  <div id="out" hidden>
    <div id="workspace-navigation"></div>
    <div class="tabs" id="tabs"></div>
    <div class="mobile-only" id="mobile-navigation"></div>
    <div id="teamcard"></div>
    <div id="matchcard"></div>
    <div id="entitycard"></div>
    <div id="view"></div>
  </div>
</div>

<dialog id="workspace-search-dialog" aria-labelledby="workspace-search-title"><div class="head"><h2 id="workspace-search-title">Search football</h2><button class="x" id="workspace-search-close">Close</button></div>
  <div class="row"><div class="entity-query"><label for="workspace-search-input">Name, pairing or race</label><input type="search" id="workspace-search-input" autocomplete="off" placeholder="e.g. Saka, Arsenal Everton, relegation" aria-describedby="workspace-search-status"></div>
  <div><label for="workspace-search-type">Show</label><select id="workspace-search-type"><option value="all">Everything</option><option value="club">Clubs</option><option value="player">Players</option><option value="match">Matches</option><option value="race">Races</option></select></div></div>
  <p class="note" id="workspace-search-status" role="status" aria-live="polite"></p><ul id="workspace-search-results"></ul></dialog>
<dialog id="metric-help-dialog" aria-labelledby="metric-help-title"></dialog>

<script>
const $ = (id) => document.getElementById(id);
let pct,esc,fx1,signedFx,span,niceTicks,CHARTS,ROUTES;
function setWorkspaceServices(services){
  ({pct,esc,fx1,signedFx,span,niceTicks,PLAYER_METRICS}=services);PLAYER_SELECTORS=services;ROUTES=services;
  CHARTS=services.createChartPrimitives({getFocus:()=>FOCUS,useBadges,badgeOf,toneFill,shortName:team=>services.teamCode(team),hlOf,HLCOL,PALETTE,LC,chartHighlightsHtml});
}

// Match Centre: cache-only evidence tied to a published snapshot.
let MC=null,MATCH_PAGE=false,MATCH_TAB='preview',MATCH_REPLAY=-1,MATCH_CENTRE_CACHE=new Map();
let HOME_MATCH='',HOME_LIMIT=5,HOME_LOADS=new Map();
let ATLAS_TEAM='Arsenal',ATLAS_COMP='all',ATLAS_SIDE='for',ATLAS_TYPE='all',ATLAS_VENUE='all',ATLAS_PERIOD='season',ATLAS_CHART='atlas',ATLAS_COMPARE='',ATLAS_BIN='',ATLAS_CACHE=new Map(),ATLAS_LOADS=new Map(),ATLAS_SHOT_TARGET=null;
let MATCHES_VIEW='agenda',AGENDA_PERIOD='week',AGENDA_COMP='all',AGENDA_SCOPE='all',AGENDA_DATE='',AGENDA_CACHE=new Map(),WATCH_PLAN=new Set();
function workspaceMatchesPickerHtml(){return `<div class="panel"><label for="workspace-matches-view">Matches</label><select id="workspace-matches-view"><option value="agenda"${MATCHES_VIEW==='agenda'?' selected':''}>Daily matches</option><option value="stakes"${MATCHES_VIEW==='stakes'?' selected':''}>Big matches</option></select></div>`;}
function wireWorkspaceMatchesPicker(){const el=$('workspace-matches-view');if(el)el.onchange=()=>{MATCHES_VIEW=el.value;if(MATCHES_VIEW==='stakes')TAB=BIG;render(true);$('workspace-matches-view')?.focus({preventScroll:true});};}
function centreQuery(){const [home,away,day]=(MATCH_FOCUS||'').split('|');return new URLSearchParams({date:RESULT.source?.date||'',pr:RESULT.source?.projection_sha256||'',competition:MATCH_COMP||'',home,away,day});}
function centreCacheKey(){return RESULT.source?.projection_sha256+'|'+centreQuery().toString();}
function centreBadge(team){return badgeOf(team)?`<img class="centre-badge" src="${badgeOf(team)}" alt="">`:'';}
function openMatchCentre(key,competition){
 captureWorkspaceScroll();MATCH_FOCUS=key;MATCH_COMP=competition;MATCH_PAGE=true;MATCH_TAB='preview';MATCH_REPLAY=-1;
 WORKSPACE_SECTION='home';TAB=BIG;TEAM_PAGE=false;FOCUS=null;PLAYER_FOCUS=null;
 if(KEYBOARD_MODE)REQUESTED_FOCUS='id:centre-section';render(true);
}
function leaveMatchCentre(){MATCH_PAGE=false;MATCH_FOCUS=null;MATCH_COMP=null;PLAYER_FOCUS=null;FOCUS=null;MATCHES_VIEW='agenda';if(KEYBOARD_MODE)REQUESTED_FOCUS='id:home-date';render(true);}
function workspaceAgendaHtml(data){
 const rows=MC.agendaRows(RESULT,data,playersPayload(),BADGES,workspacePreferences().following,{period:AGENDA_PERIOD,competition:AGENDA_COMP,scope:AGENDA_SCOPE,date:AGENDA_DATE});
 const competitions=[...new Set(data.fixtures.map(f=>f.competition))].sort((a,b)=>COMP_ORDER.indexOf(a)-COMP_ORDER.indexOf(b)||a.localeCompare(b));
 const plan=MC.viewingPlan(data.fixtures,WATCH_PLAN);
 const body=rows.map(f=>{
  const impact=!f.result&&f.stakes?matchSwing(f,f.stakes_of||[]):null,valid=impact&&impact.wdl.every(p=>Number.isFinite(p)&&p>=0&&p<=1);
  const why=valid?`${esc(impact.team)} · <b>${esc(stakeName(impact.key))}</b><br>${pct(Math.min(...impact.wdl))}–${pct(Math.max(...impact.wdl))} across win / draw / loss`:f.result?'Recorded result':'Conditional stakes unavailable';
  return `<li class="agenda-item" data-agenda-fixture="${esc(f.id)}" data-agenda-kickoff="${esc(f.kickoff)}"${valid?` data-agenda-range="${Math.min(...impact.wdl)}|${Math.max(...impact.wdl)}"`:''}><input type="checkbox" data-watch="${esc(f.id)}" aria-label="Add ${esc(f.home+' v '+f.away)} to viewing plan"${WATCH_PLAN.has(f.id)?' checked':''}>${fixtureLinkHtml(f)}<div class="agenda-why">${why}</div></li>`;
 }).join('');
 return `${workspaceMatchesPickerHtml()}<div class="panel"><div class="home-section-head"><h2>Match agenda</h2><span class="note">${rows.length} confirmed fixtures · chronological order</span></div>
 <div class="row agenda-controls"><div><label for="agenda-period">When</label><select id="agenda-period">${[['week','Next 7 days'],['month','Next 30 days'],['season','Rest of season'],['recent','Played: last 7 days'],['day','On a date']].map(([id,name])=>`<option value="${id}"${AGENDA_PERIOD===id?' selected':''}>${name}</option>`).join('')}</select></div>
 ${AGENDA_PERIOD==='day'?`<div><label for="agenda-date">Date</label><input type="date" id="agenda-date" value="${esc(AGENDA_DATE)}"></div>`:''}
 <div><label for="agenda-comp">Competition</label><select id="agenda-comp"><option value="all">Every competition</option>${competitions.map(c=>`<option value="${esc(c)}"${AGENDA_COMP===c?' selected':''}>${esc(label(c))}</option>`).join('')}</select></div>
 <div><label for="agenda-scope">Following</label><select id="agenda-scope"><option value="all"${AGENDA_SCOPE==='all'?' selected':''}>Every fixture</option><option value="following"${AGENDA_SCOPE==='following'?' selected':''}>Followed clubs, players & races</option></select></div></div>
 <p class="note">Snapshot ${esc(data.snapshot)} · data through ${esc(data.as_of)} · confirmed pairings only</p>
 <p class="note"><b>Why watch</b> · widest stored fate range for either side across win / draw / loss · each fate belongs to its own competition</p>
 ${body?`<ul class="fixture-list agenda-list" aria-label="Match agenda">${body}</ul>`:`<p class="note">${AGENDA_SCOPE==='following'&&!workspacePreferences().following.length?'Follow a club, player or race using Search football to build your agenda.':'No eligible fixture is stored for this selection.'}</p>`}</div>
 <details class="panel" id="viewing-plan"${WATCH_PLAN.size?' open':''}><summary>Viewing plan · ${plan.length}/12 matches</summary><p class="note">Planned two-hour windows · overlaps flagged · kickoff times can change · saved with this view</p>${plan.length?`<ul class="fixture-list viewing-plan">${plan.map(f=>`<li data-plan-fixture="${esc(f.id)}">${fixtureLinkHtml(f)}${f.clash?' · <b class="zbad">Overlapping window</b>':''}<button class="ghost" data-remove-watch="${esc(f.id)}" aria-label="Remove ${esc(f.home+' v '+f.away)}">Remove</button></li>`).join('')}</ul><button class="ghost" id="clear-watch">Clear plan</button>`:'<p class="note">Tick Plan beside a match to build your viewing list.</p>'}</details>`;
}
function wireMatchCentreLinks(root){root.querySelectorAll('[data-centre]').forEach(b=>b.onclick=()=>openMatchCentre(b.dataset.centre,b.dataset.centreComp));}
async function drawWorkspaceAgenda(){
 const result=RESULT,date=result.source?.date,cacheKey=result.source?.projection_sha256;
 if(!date){$('view').innerHTML=workspaceMatchesPickerHtml()+'<div class="panel">Match Centre uses published snapshots. Choose a stored snapshot above.</div>';wireWorkspaceMatchesPicker();return;}
 if(!AGENDA_CACHE.has(cacheKey)){
  $('view').innerHTML='<div class="panel"><p class="note">Loading match agenda…</p></div>';
  try{const data=await jget('/api/agenda?'+new URLSearchParams({date,pr:result.source.projection_sha256}));if(RESULT!==result)return;AGENDA_CACHE.set(cacheKey,data);}catch(e){if(RESULT===result)$('view').innerHTML=workspaceMatchesPickerHtml()+`<div class="panel" role="alert">Agenda unavailable: ${esc(e.message)}. Choose Big matches to use the stored forecast view.</div>`;wireWorkspaceMatchesPicker();return;}
 }
 if(RESULT!==result||WORKSPACE_SECTION!=='matches'||MATCH_PAGE||MATCHES_VIEW!=='agenda')return;
 $('view').innerHTML=workspaceAgendaHtml(AGENDA_CACHE.get(cacheKey));wireWorkspaceMatchesPicker();wireMatchCentreLinks($('view'));
 for(const [id,set] of [['agenda-period',v=>{AGENDA_PERIOD=v;if(v==='day'&&!AGENDA_DATE)AGENDA_DATE=RESULT.as_of;}],['agenda-comp',v=>AGENDA_COMP=v],['agenda-scope',v=>AGENDA_SCOPE=v],['agenda-date',v=>AGENDA_DATE=v]]){
  const el=$(id);if(el)el.onchange=()=>{const focused=el.id;set(el.value);writeHash(true);drawWorkspaceAgenda();$(focused)?.focus({preventScroll:true});};
 }
 const change=()=>{writeHash(false);drawWorkspaceAgenda();};
 $('view').querySelectorAll('[data-watch]').forEach(el=>el.onchange=()=>{if(el.checked&&WATCH_PLAN.size>=12){el.checked=false;WORKSPACE_NOTICE='Your viewing plan has 12 matches. Remove one before adding another.';const n=$('workspace-notice');n.hidden=false;n.textContent=WORKSPACE_NOTICE;return;}el.checked?WATCH_PLAN.add(el.dataset.watch):WATCH_PLAN.delete(el.dataset.watch);change();});
 $('view').querySelectorAll('[data-remove-watch]').forEach(b=>b.onclick=()=>{WATCH_PLAN.delete(b.dataset.removeWatch);change();});if($('clear-watch'))$('clear-watch').onclick=()=>{WATCH_PLAN.clear();change();};
 afterRender();
 if(AGENDA_SCOPE==='following'&&workspacePreferences().following.some(id=>id.startsWith('player:'))&&!playersSettled())ensurePlayers().then(()=>{if(RESULT===result&&!MATCH_PAGE&&WORKSPACE_SECTION==='matches')drawWorkspaceAgenda();});
}
function centrePreviewHtml(data){
 const pre=data.pre_match,f=pre?.fixture,realised=MC.realisedForecast(data),entry=f?{f,keys:pre.keys,competition:data.fixture.competition,kind:kindOf(data.fixture.competition),realisedOutcome:realised?.index}:null;
 if(!f)return '<div class="panel"><h2>Preview</h2><p class="note">No eligible pre-match forecast is retained for this pairing. Later forecasts are not used as its preview.</p></div>';
 const odds=f.ladder?[f.ladder.h1,f.ladder.d,f.ladder.a1]:null;
 return `<div class="panel"><h2>Pre-match forecast</h2><p class="note"><b>Stored before kickoff</b> · snapshot ${esc(pre.snapshot)} · data through ${esc(pre.as_of)} · 90-minute win / draw / loss</p>${odds?`<div class="centre-odds">${[f.home,'Draw',f.away].map((t,i)=>`<div><span>${esc(t)}</span><strong data-centre-odds="${odds[i]}">${pct(odds[i])}</strong></div>`).join('')}</div>`:'<p class="note">Match odds unavailable.</p>'}
 ${data.fixture.result?MC.realisedHtml(data):''}${f.top?.length?`<details class="centre-original-scores"${data.fixture.result?'':' open'}><summary>Original likeliest scores</summary><p class="note">${f.top.slice(0,5).map(([score,p])=>esc(score)+' '+pct(p)).join(' · ')}</p></details>`:''}
 <p class="note">Conditional fate chances · win / draw / loss from each side’s perspective · SWING in percentage points${realised?.score?' · outlined column is the actual 90-minute result':''}</p><div class="grid2">${matchStakesHtml(entry,true)}${matchStakesHtml(entry,false)}</div>${centreContextHtml(data)}</div>`;
}

// The workspace shell calls existing competition/entity views while their data selectors migrate.
let WORKSPACE = null, WORKSPACE_SECTION = 'races', WORKSPACE_PREFS = null, WORKSPACE_NOTICE = '';
let WORKSPACE_CLUB_QUERY = '', WORKSPACE_SOURCE_KEY = null, WORKSPACE_SAVED_OPEN = false;
function workspaceStorage(){try{return globalThis.localStorage;}catch{return null;}}
const WORKSPACE_SCROLL = new Map();
let WORKSPACE_ENTITIES_CACHE=null,WORKSPACE_MIGRATED=null;
function workspacePreferences() {
  if(!WORKSPACE_PREFS)WORKSPACE_PREFS=WORKSPACE.loadPreferences(workspaceStorage());
  if(RESULT&&(!WORKSPACE_MIGRATED||WORKSPACE_MIGRATED.result!==RESULT||WORKSPACE_MIGRATED.badges!==BADGES||WORKSPACE_MIGRATED.prefs!==WORKSPACE_PREFS)) {
    const resolved=WORKSPACE.resolveFollowing(WORKSPACE_PREFS.following,workspaceEntities());
    if(JSON.stringify(resolved)!==JSON.stringify(WORKSPACE_PREFS.following)){
      const labels=WORKSPACE_PREFS.followLabels||{};WORKSPACE_PREFS.followLabels=Object.fromEntries(WORKSPACE_PREFS.following.map(id=>[WORKSPACE.resolveFollowing([id],workspaceEntities())[0],labels[id]]).filter(([,name])=>name));
      WORKSPACE_PREFS.following=resolved;WORKSPACE.persistPreferences(workspaceStorage(),WORKSPACE_PREFS);
    }
    WORKSPACE_MIGRATED={result:RESULT,badges:BADGES,prefs:WORKSPACE_PREFS};
  }
  return WORKSPACE_PREFS;
}
function workspaceEntities() {
  if(!WORKSPACE_ENTITIES_CACHE||WORKSPACE_ENTITIES_CACHE.result!==RESULT||WORKSPACE_ENTITIES_CACHE.badges!==BADGES)
    WORKSPACE_ENTITIES_CACHE={result:RESULT,badges:BADGES,entities:WORKSPACE.clubEntities(RESULT,BADGES)};
  return WORKSPACE_ENTITIES_CACHE.entities;
}
function saveWorkspacePreferences() {
  const ok=WORKSPACE.persistPreferences(workspaceStorage(),workspacePreferences());
  WORKSPACE_NOTICE=ok?'':'Browser storage is unavailable. Changes last for this visit; export them to keep a copy.';
  const notice=$('workspace-notice');if(notice){notice.textContent=WORKSPACE_NOTICE;notice.hidden=!WORKSPACE_NOTICE;}
  return ok;
}
function followWorkspaceClub(name) {
  const id=WORKSPACE.clubId(name,BADGES),prefs=workspacePreferences();
  if(!prefs.following.includes(id)&&prefs.following.length>=1000){WORKSPACE_NOTICE='You follow 1,000 items. Unfollow one before adding another.';const notice=$('workspace-notice');notice.textContent=WORKSPACE_NOTICE;notice.hidden=false;return false;}
  prefs.following=prefs.following.includes(id)?prefs.following.filter(x=>x!==id):[...prefs.following,id];
  prefs.followLabels||={};if(prefs.following.includes(id))prefs.followLabels[id]=name;else delete prefs.followLabels[id];
  saveWorkspacePreferences();render();
}

// One entity search and one inspector, backed by the selected snapshot's stored evidence.
let WORKSPACE_INDEX_CACHE=null,PLAYER_FOCUS=null,PLAYER_OPENER=null,MATCH_COMP=null;
function workspaceIndex() {
  const players=playersPayload(),key=[RESULT,MATCHES,players,BADGES,GW];
  if(!WORKSPACE_INDEX_CACHE||key.some((v,i)=>v!==WORKSPACE_INDEX_CACHE.key[i]))
    WORKSPACE_INDEX_CACHE={key,entities:WORKSPACE.entityIndex(RESULT,MATCHES,players,BADGES,GW)};
  return WORKSPACE_INDEX_CACHE.entities;
}
function workspaceEntityFollowButton(entity){return WORKSPACE.entityFollowButtonHtml(entity,workspacePreferences().following);}
function followWorkspaceEntity(id) {
  const prefs=workspacePreferences();
  if(!prefs.following.includes(id)&&!workspaceIndex().some(e=>e.id===id))return false;
  if(!prefs.following.includes(id)&&prefs.following.length>=1000){WORKSPACE_NOTICE='You follow 1,000 items. Unfollow one before adding another.';const notice=$('workspace-notice');notice.textContent=WORKSPACE_NOTICE;notice.hidden=false;return false;}
  prefs.following=prefs.following.includes(id)?prefs.following.filter(x=>x!==id):[...prefs.following,id];
  prefs.followLabels||={};if(prefs.following.includes(id)){const entity=workspaceIndex().find(e=>e.id===id);prefs.followLabels[id]=entity.type==='race'?label(entity.competition)+' · '+entity.fate+' · '+entity.season:entity.name;}else delete prefs.followLabels[id];
  saveWorkspacePreferences();
  if(WORKSPACE_SECTION==='home'&&!TEAM_PAGE)drawHome();
  renderPlayerCard();renderTeamCard();
  // Keep the source table and native dialog input intact while synchronizing follow controls.
  document.querySelectorAll('[data-follow-entity]').forEach(b=>{if(b.dataset.followEntity===id){const on=prefs.following.includes(id);b.textContent=on?'Following':'Follow';b.setAttribute('aria-pressed',String(on));}});
  if($('workspace-search-dialog')?.open)drawWorkspaceSearch();
  afterRender();return true;
}
function workspaceFollowingHtml() {

function openWorkspaceEntity(id) {

function searchEntitySubtitle(e) {

  if(e.type==='match')return label(e.competition)+' · '+WORKSPACE.kickoffLabel(e.kickoff,e.competition)+'';

function presentComps() {

// Grouped by country in GROUPS order, league first then that country's cups, UEFA last.

// renamed competition would disappear from the page without a single error.

  const groups = GROUPS.map(([country, comps]) => [country, comps.filter((c) => present.has(c))])

// Click a heading to sort by it, again to reverse; the first click puts the biggest first. Cells
// are read as numbers where they are numbers ("·" counts as zero, "—" sorts last) and as text
// otherwise, so the team column sorts by name.
function sortTable(th) {
  const table = th.closest("table"), body = table.tBodies[0];
  if (!body) return;
  const idx = [...th.parentElement.cells].indexOf(th);
  const first = th.dataset.first || "desc";
  const dir = th.dataset.dir ? (th.dataset.dir === "desc" ? "asc" : "desc") : first;
  table.querySelectorAll("th[data-sort]").forEach((h) => {
    delete h.dataset.dir;
    h.setAttribute("aria-sort", "none");
    h.querySelectorAll(".arrow").forEach((a) => a.remove());
  });
  th.dataset.dir = dir;
  th.setAttribute("aria-sort", dir === "desc" ? "descending" : "ascending");
  th.insertAdjacentHTML("beforeend", `<span class="arrow">${dir === "desc" ? "▼" : "▲"}</span>`);
  const val = (tr) => {
    const td = tr.cells[idx];
    const raw = (td ? (td.dataset.v ?? td.textContent) : "").trim();
    if (raw === "·") return 0;
    const n = parseFloat(raw.replace("−", "-").replace(/^\+/, ""));
    return Number.isNaN(n) ? (raw === "—" || raw === "" ? null : raw.toLowerCase()) : n;
  };
  const rows = [...body.rows];
  rows.sort((a, b) => {
    const x = val(a), y = val(b);
    if (x === null || y === null) return x === y ? 0 : x === null ? 1 : -1;
    if (typeof x === "string" || typeof y === "string") {
      return dir === "asc" ? String(x).localeCompare(String(y)) : String(y).localeCompare(String(x));
    }
    return dir === "desc" ? y - x : x - y;
  });
  rows.forEach((r) => body.appendChild(r));
  if (table.dataset?.overview && th.dataset.column) {
    OVERVIEW_SORT[table.dataset.overview] = {key: th.dataset.column, dir};
    const note = $("overview-sort-note");
    if (note) note.textContent = `Sorted by ${th.textContent.replace(/[▼▲]/g, "").trim()} ${dir === "asc" ? "ascending" : "descending"}${th.hidden ? " (hidden)" : ""}.`;
  }
}
