// Hover any mark carrying `data-tip` for its numbers. One floating box for the page.
function attachTips(root) {
  if (typeof document.createElement !== "function") return;
  let tip = $("vtip");
  if (!tip) {
    tip = document.createElement("div");
    tip.id = "vtip";
    tip.className = "vtip";
    tip.hidden = true;
    document.body.appendChild(tip);
  }
  root.onmousemove = (ev) => {
    const el = ev.target.closest ? ev.target.closest("[data-tip]") : null;
    if (!el) { tip.hidden = true; return; }
    tip.innerHTML = el.getAttribute("data-tip") + ((root.__tipTouchReading||root.__blockTouchClick)&&el.closest?.("svg")&&el.closest?.("[data-team],[data-hl],[data-match]")?'<br><small>Tap this mark again to open or select it.</small>':'');
    tip.hidden = false;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let x = ev.clientX + 14, y = ev.clientY + 14;
    if (x + w > window.innerWidth - 8) x = ev.clientX - w - 14;
    if (y + h > window.innerHeight - 8) y = ev.clientY - h - 14;
    tip.style.left = Math.max(4, x) + "px";
    tip.style.top = Math.max(4, y) + "px";
  };
  root.onmouseleave = () => { tip.hidden = true; };
  if(root.__tipPointer)root.removeEventListener('pointerup',root.__tipPointer);
  root.__tipPointer=ev=>{
    if(ev.pointerType!=='touch')return;
    const el=ev.target.closest?.('[data-tip]');
    root.__blockTouchClick=Boolean(el?.closest?.('svg')&&el.closest?.('[data-team],[data-hl],[data-match]')&&(root.__touchTip!==el||tip.hidden));
    root.__touchTip=el;root.__tipTouchReading=true;root.onmousemove(ev);root.__tipTouchReading=false;
  };
  root.addEventListener('pointerup',root.__tipPointer);
  if(root.__tipClick)root.removeEventListener('click',root.__tipClick,true);
  root.__tipClick=ev=>{if(root.__blockTouchClick){root.__blockTouchClick=false;ev.preventDefault();ev.stopPropagation();}};
  root.addEventListener('click',root.__tipClick,true);
  if(!tip.__dismiss&&typeof document.addEventListener==='function'){tip.__dismiss=true;document.addEventListener('pointerdown',ev=>{if(!ev.target.closest?.('[data-tip]'))tip.hidden=true;});document.addEventListener('scroll',()=>{tip.hidden=true;},true);}
  if (root.__tipFocusIn) root.removeEventListener("focusin", root.__tipFocusIn);
  if (root.__tipFocusOut) root.removeEventListener("focusout", root.__tipFocusOut);
  root.__tipFocusIn = (ev) => {
    const el = ev.target.closest?.("[data-tip]");
    if (!el) return;
    const box = el.getBoundingClientRect();
    root.onmousemove({target: el, clientX: box.left + box.width / 2, clientY: box.top + box.height / 2});
  };
  root.__tipFocusOut = () => { tip.hidden = true; };
  root.addEventListener("focusin", root.__tipFocusIn);
  root.addEventListener("focusout", root.__tipFocusOut);
}

// One scatter for every chart that plots sides against two numbers. Each point is
// {team, x, y, tone, tip, from}: its badge marks it where there is one, else a dot in its zone's
// colour with a short name beside it where the name fits. `from` draws a tail from an earlier
// position. A transparent disc bigger than the mark takes the hover and the click.
function scatter(pts,o){return CHARTS.scatter(pts,o);}

// Attack against defence: where each side's strength sits, today or on this season's raw npxG.
function vizAD(block) {
  const R = ratingIdx(), model = VIZOPT.src !== "real";
  const w = dwin();
  const pts = block.teams.map((t) => {
    const tone = toneOf(block, t);
    if (model) {
      const r = onScale(R[t.team], block.competition);
      if (!r) return null;
      const p = w ? pastOf(r, w.key) : null;
      return {team: t.team, x: r.att, y: r.def, tone,
              from: VIZOPT.move && p ? [p[1], p[2]] : null,
              tip: `<b>${esc(t.team)}</b><br>ATT ${r.att.toFixed(2)} · DEF ${r.def.toFixed(2)} · NET
                ${signedFx(netOf(r), 2)}<br>Elo ${Math.round(r.elo)} · XPOS ${fx1(t.mean_pos ?? t.mean_seed)}${
                p ? `<br>over ${w.label} (since ${w.date}): ATT ${signedFx(r.att - p[1], 2)}, DEF
                  ${signedFx(r.def - p[2], 2)}, Elo ${signedFx(r.elo - p[0], 0)}` : ""}`};
    }
    const x = t.real;
    if (!x || !x.n_xg) return null;
    // `xg` / `xga` are season totals over `n_xg` matches
    const xf = x.xg / x.n_xg, xa = x.xga / x.n_xg;
    return {team: t.team, x: xf, y: xa, tone,
            tip: `<b>${esc(t.team)}</b><br>xG ${xf.toFixed(2)} for, ${xa.toFixed(2)} against a
              match<br>over ${x.n_xg} ${label(block.competition)} matches${Number.isFinite(x.pts)?' · PTS '+x.pts:''}`};
  }).filter(Boolean);
  const controls = `${chartSettingsHtml(`
      ${chartOpt("src", [["model", "Strength: today's fit"], ["real", "This season's xG"]])}
      ${model && w ? chartWindowHtml() : ""}
      ${chartMarks()}`)}`;
  if (!pts.length) return controls + `<p class="note">Nothing to plot in this snapshot.</p>`;
  const nets = [-1.5, -1, -0.5, 0, 0.5, 1, 1.5];
  return controls + `<div class="legend"><span>${model
      ? `npxG fit to ${RESULT.ratings.as_of}: <b>ATT</b> made, <b>DEF</b> conceded a match, against ${hasOwnScale(block.competition)
           ? `an average ${label(block.competition)} side` : "an average side of the five leagues"}${VIZOPT.move && w ? ` · tails from ${w.date}` : ""}`
      : `This season's xG for and against a match, as played`}</span>
      <span><b>Solid diagonals</b> · equal ${model?'NET':'xG difference'} · <b>Dashed rising lines</b> · balanced profile and outer ±1σ thresholds; above-left defence-led, below-right attack-led</span>
      <span><b>Cross</b> · unweighted mean of plotted clubs · profile compares attack and defence improvements from that mean · σ: profile spread across these clubs</span>${zoneKey(block)}
      <span>Tap or hover for numbers · select for the card</span></div>
    ${scatter(pts, {title: "Attack against defence", invertY: true, balance: true,
        xlab: model ? "ATT — npxG made a match →" : "xG for a match →",
        ylab: model ? "DEF — npxG conceded a match (fewer is higher)" : "xG against a match (fewer is higher)",
        quad: {x: meanOf(pts.map((p) => p.x)), y: meanOf(pts.map((p) => p.y))},
        diag: nets.map((k) => [-k, `${model?"NET":"xGD"} ${signedFx(k, 1)}`]),
        corners: {tr: "stronger on both", tl: "stronger defence · weaker attack", br: "stronger attack · weaker defence", bl: "weaker on both"}})}`;
}

// Points so far against the points the matches' xG would have earned: finishing and luck.
function vizXP(block) { return competitionEvidenceRootHtml(block.competition,'points'); }

// Goals against the chances behind them, this season in this competition: for or against, on
// xG -- FotMob's, penalties included, like for like with goals -- or on xG on target, which
// splits the gap into where the shots were placed (xGOT - xG) and what is left (goals - xGOT):
// the keeper and the bounce. Against, xGOT faced minus goals is what the keeper prevented.
// Every match is counted for both sides, so over a competition goals for = against and xG = xGA.
const gapTd = (d, dp, goodUp) => {
  const zero = Math.abs(d) < 0.5 * Math.pow(10, -dp), good = goodUp ? d > 0 : d < 0;
  return `<td class="mv${zero ? "" : good ? " up" : " down"}" data-v="${d.toFixed(3)}">${signedFx(d, dp)}</td>`;
};
function vizGX(block) { return competitionEvidenceRootHtml(block.competition,'goals'); }

// Where each side finishes on points over the worlds: its 80% range, its XPTS, and the points
// to beat for what the table decides.
// Run-in: every side's fixtures still to play here, a row a side in XPOS order and a column a
// round, each cell its opponent -- capitals at home, lower case away -- shaded by the side's OWN
// chance of winning it, or by the points it expects from it (3W + D, out of 3). Hover for the odds,
// the projected xG and what rides on it. A fixture fills two cells, the home side's W the away
// side's L (render_check).
const riCode = team=>ROUTES.teamCode(team);
function runInCell(n, keys, byPts = VIZOPT.rim === "pts") {
    const v = byPts ? (3 * n.w + n.d) / 3 : n.w;
    const a = 0.07 + 0.93 * Math.pow(Math.max(v, 0), 0.55);
    const code = riCode(n.opponent);

function rivalData(block) {

  const n=r.teams?.length,w=r.worlds,integer=v=>Number.isSafeInteger(v)&&v>=0;
  const invalid=()=>({error:'Rival evidence is invalid or incomplete for this snapshot.'});
  if(r.schema!==1||!Array.isArray(r.teams)||!Number.isSafeInteger(w)||w<1||!Number.isInteger(n)||n<2||r.gap_offset!==1-n||
     new Set(r.teams).size!==n||block.teams.length!==n||

     !Array.isArray(r.gap_counts)||r.gap_counts.length!==n||

       !Array.isArray(r.gap_counts[i])||r.gap_counts[i].length!==n)return invalid();
    expected[i]=pos.reduce((s,v,k)=>s+v*(k+1),0)/w;

         bins.reduce((a,b)=>a+b,0)!==w||bins[n-1]!== (i===j?w:0))return invalid();
      above[i][j]=bins.slice(n).reduce((a,b)=>a+b,0);

function entryRouteData(block) {

function timingData(block,g) {

  const perClub=new Map(g.teams.map(t=>[t,Array(g.rounds+1).fill(0)])),byRound=Array(g.rounds+1).fill(0),seen=new Set();

  return {byRound,settled:cumulative(byRound),perClub:new Map([...perClub].map(([t,v])=>[t,cumulative(v)])),tolerance};
}

        fill="var(--accent)" fill-opacity="${r.t.team === FOCUS ? 0.7 : 0.42}"/>
      ${r.now != null ? `<line x1="${X(r.now)}" x2="${X(r.now)}" y1="${y - 6}" y2="${y + 6}" stroke="var(--ink)"
        stroke-width="1.5" stroke-opacity=".7"/>` : ""}
      ${Number.isFinite(median)?`<line data-points-median="${esc(r.t.team)}" data-value="${median}" x1="${X(median)}" x2="${X(median)}" y1="${y-5}" y2="${y+5}" stroke="var(--mid)" stroke-width="2"/>`:''}
      <text data-points-target="${esc(r.t.team)}" data-target="${target}" data-probability="${probability??''}" class="vlab" x="${W-8}" y="${y+4}" text-anchor="end">${probability===null?'—':pct(probability)}</text>
      <circle cx="${X(r.mean)}" cy="${y}" r="4.5" fill="var(--accent)" stroke="var(--panel)" stroke-width="2"/>
      <rect class="hit" x="0" y="${y - rh / 2}" width="${W}" height="${rh}" fill="transparent"
        style="cursor:pointer" data-team="${esc(r.t.team)}" data-tip="${esc(`<b>${esc(r.t.team)}</b><br>XPTS ${r.mean.toFixed(1)}; ${r.p10}–${r.p90} in 80% of worlds${r.now != null ? `<br>${r.now} so far` : ""}${Number.isFinite(median)?`<br>Median ${median}`:""}<br>At least ${target} points: ${probability===null?"unavailable (missing/invalid distribution)":pct(probability)}`)}"/>`;
  }).join("");
  return controls+`<div class="legend"><span>Final ${isU ? "league-phase " : ""}points: bar the 80% range · dot
      <b>XPTS</b> · blue tick: median · dark tick: points so far · grey lines: forecast point thresholds</span><span><b>Dashed target</b> · simulated chance of at least ${target} points at right · — missing/invalid distribution · a points target is distinct from qualification</span><span>Hover a row · click for the card</span></div>
    <div class="scroll" tabindex="0" role="region" aria-label="Final points chart; scroll horizontally for target chances"><svg class="vchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Final points" style="max-width:${W}px">
      ${grid}${refs}<line data-points-target-line="${target}" x1="${X(target)}" x2="${X(target)}" y1="${m.t-4}" y2="${H-m.b}" stroke="var(--accent)" stroke-dasharray="5 4"/><text x="${W-8}" y="15" class="vlab" text-anchor="end">≥${target} pts</text>${body}
      <text x="${m.l + iw / 2}" y="${H - 6}" text-anchor="middle" class="vlab">final points →</text></svg></div>
    <details data-points-values${POINTS_VALUES_OPEN?' open':''}><summary>Aligned point ranges &amp; target chances</summary><div class="scroll" tabindex="0" role="region" aria-label="Point targets and retained ranges"><table><thead><tr><th class="team">Club</th><th>≥${target} pts</th><th>Median</th><th>XPTS</th><th>80% range</th></tr></thead><tbody>${rows.map(r=>`<tr>${teamTd(r.t.team)}<td>${ROUTES.pointsTarget(r.t.pts,target)===null?'—':pct(ROUTES.pointsTarget(r.t.pts,target))}</td><td>${r.t.pts?.p50??'—'}</td><td>${r.mean.toFixed(1)}</td><td>${r.p10}–${r.p90}</td></tr>`).join('')}</tbody></table></div></details>`;

// ---- one line chart for any per-side series over rounds
// Every side faint, up to four lit in colours that stay theirs (`hlOf`), solid where the values
// are real and dashed where they are projected, a crosshair that reads every lit side at a round.
// New round-by-round charts should come through here rather than drawing their own.
const LC = {};             // what each line chart's crosshair reads, by svg id
function lineChart(o){return CHARTS.lineChart(o);}
function attachLineCrosshair(id) {
  const svg = $(id), c = LC[id];
  if (!svg || !c || typeof svg.getBoundingClientRect !== "function") return;
  const line = $(id + "x"), dots = $(id + "d"), out = $(id + "o");
  const show = (k) => {
    line.setAttribute("x1", c.X(k)); line.setAttribute("x2", c.X(k)); line.setAttribute("stroke-opacity", ".4");
    const rows = c.lit.map((t) => [t, c.vals.get(t)[k]]).filter(([, v]) => v != null);
    dots.innerHTML = rows.map(([t, v]) => `<circle cx="${c.X(k)}" cy="${c.Y(v).toFixed(1)}" r="4"
      fill="${PALETTE[c.col[t] ?? 0]}" stroke="var(--panel)" stroke-width="2"/>`).join("");
    out.innerHTML = `<b style="margin-right:6px">${c.labels[k] || ""}</b>` + rows.map(([t, v]) =>
      `<span><i style="background:${PALETTE[c.col[t] ?? 0]}"></i>${esc(t)} <b>${c.fmt(v)}</b>${Number.isFinite(c.references?.get(t))?` · vs reference ${signedFx(v-c.references.get(t),2)}`:""}</span>`).join("");
  };
  const clear = () => { line.setAttribute("stroke-opacity", "0"); dots.innerHTML = "";
    out.innerHTML = `<span style="color:var(--dim)">Tap or hover the chart to read ${c.what}</span>`; };
  svg.onmousemove = (ev) => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) / r.width * c.W;
    let best = 0;
    for (let k = 1; k < c.n; k++) if (Math.abs(c.X(k) - px) < Math.abs(c.X(best) - px)) best = k;
    show(best);
  };
  svg.onmouseleave = clear;
  svg.onpointerup=ev=>{if(ev.pointerType==='touch')svg.onmousemove(ev);};
  clear();
}

// The last round every one of whose fixtures has been played, from a `gw.json` block.
function lastFullRound(g) {
  let full = 0;
  for (let r = 1; r <= g.rounds; r++) {
    const fx = g.fixtures.filter((f) => f.round === r);
    if (fx.length && fx.every((f) => f.result)) full = r; else break;
  }
  return full;
}

// Points race: each side's points after every round, real to the last round played in full and
// the worlds' mean after it, or its gap to whoever is top at that round.
function vizPR(block, kind, g) {
  if (!g) return `<p class="note">No round-by-round detail in this snapshot.</p>`;
  const gap = VIZOPT.prgap === true;
  const tag = kind === "league" ? "GW" : "MD";
  const pts = new Map(g.teams.map((t, i) => [t, g.w[i].map((w, at) => 3 * w + g.d[i][at])]));
  const top = Array.from({length: g.rounds + 1}, (_, at) => Math.max(...g.teams.map((t) => pts.get(t)[at])));
  const vals = new Map([...pts].map(([t, v]) => [t, gap ? v.map((x, at) => x - top[at]) : v]));
  const labels = Array.from({length: g.rounds + 1}, (_, at) => at === 0 ? "Start" : at === g.rounds ? "End"
    : (g.rounds <= 12 || at % 5 === 0) ? `${tag}${at}` : "");
  const order = block.teams.slice().sort((a, b) => (a.mean_pos ?? 99) - (b.mean_pos ?? 99)).map((t) => t.team);
  return `${chartSettingsHtml(`${chartOpt("prgap", [["false", "Points"], ["true", "Gap to the top"]])}`)}
    <div class="legend"><span>${gap ? "Points behind whoever is top" : "Points"} after each round · solid: real
      to ${tag} ${lastFullRound(g)} · dashed: the worlds' mean after it</span>
      <span>Click a side to light it (four at most)</span></div>
    ${lineChart({block, id: "lcpr", vals, labels, realUpTo: lastFullRound(g), order,
      readout: labels.map((l, at) => at === 0 ? "Before the season" : `After ${tag} ${at}`),
      fmt: (v) => gap ? signedFx(v, 1) : v.toFixed(1), ylab: gap ? "points behind the top" : "points"})}`;
}

// Form: each side's rolling average over its last five played matches here -- xG difference,
// xG for, xG against, or points -- after every round played so far.
const FM_METRICS = [["nd", "xG difference"], ["nf", "xG for"], ["na", "xG against"], ["pp", "Points"]];
function vizFM(block) { return competitionEvidenceRootHtml(block.competition,'form'); }

// Shot quality: how many shots a side takes (or allows) a match, against how good they are --
// xG a shot.
function vizSQ(block) { return competitionEvidenceRootHtml(block.competition,'quality'); }

// ---------------------------------------------------------------- stats
// Each side's numbers a match in this competition this season, FotMob's: possession, shots, on
// target, big chances, xG, xG on target, goals, corners -- for, against, or the difference.
const STAT_COLS = [["poss", "POSS", "Possession %"], ["sh", "SH", "Shots"], ["sot", "SOT", "Shots on target"],
                   ["bc", "BC", "Big chances"], ["xg", "xG", "xG, penalties included"],
                   ["xgot", "xGOT", "xG on target"], ["g", "G", "Goals"], ["crn", "CRN", "Corners"]];
let STATSIDE = "for";
function statRow(r, side) {
  const per = (f, a, n) => side === "for" ? f / n : side === "against" ? a / n : (f - a) / n;
  const n = Math.max(r.n_stats, 1), nx = Math.max(r.n_xg || r.pl, 1), ng = Math.max(r.n_xgot || r.pl, 1);
  return {poss: side === "for" ? r.poss : side === "against" ? 100 - r.poss : 2 * r.poss - 100,
          sh: per(r.shots, r.shots_a, n), sot: per(r.sot, r.sot_a, n), bc: per(r.bigch, r.bigch_a, n),
          xg: per(r.xg, r.xga, nx),
          xgot: per(r.xgot, r.xgota, ng), g: per(r.gf, r.ga, Math.max(r.pl, 1)), crn: per(r.corners, r.corners_a, n)};
}
// ---- knockouts: a UEFA competition's after its league phase, and every domestic cup
// Built from what the payload already holds: each side's chance of reaching each round, the next
// drawn ties with their 90-minute odds (`matches.json`), and the knockout paths -- who meets whom
// in each round and who goes through (`paths.json`).
function vizGroups(kind) {
  const g = kind === "cup" ? VIZ_KO : kind === "uefa" ? VIZ_SEASON.concat(VIZ_KO) : VIZ_SEASON;
  return g.map(([lab, ks]) => [lab, ks.filter(k=>kind!=="uefa"||!["rivals","timing","entryroutes","trajectory","expectation","quality","tmbridge","tmfates","tmstrength"].includes(k)).map((k) => [k, VIZ_NAMES[k]])]).filter(([,rows])=>rows.length);
}

// The stages a side passes through, each with its chance of being there. A UEFA side starts in
// the league phase (36), then the knockouts (the top 24), the round of 16, and on; a cup side at
// the first round still in the balance (`trimCup`). Before a side ENTERS -- a top club exempt from
// the early rounds -- its value is null, not 0: it has not gone out of a round it never played.
function koStages(block) {
  if (RESULT.uefa.includes(block)) {
    return {teams: block.teams, uefa: true,
            evidence:t=>[1,Number.isFinite(t.p_out)?1-t.p_out:undefined,t.p_r16,t.p_qf,t.p_sf,t.p_f,t.p_win],
            stages: [["League phase", () => 1], ["Top 24", (t) => 1 - (t.p_out ?? 0)],
                     ["R16", (t) => t.p_r16], ["QF", (t) => t.p_qf], ["SF", (t) => t.p_sf],
                     ["Final", (t) => t.p_f], ["Win", (t) => t.p_win]]};
  }
  const {rounds, teams} = trimCup(block);
  return {teams, uefa: false,
          evidence:t=>rounds.map(r=>t['p_'+r.toLowerCase()]).concat([t.p_win]),
          stages: rounds.map((r) => [roundName(r), (t) => t["p_" + r.toLowerCase()] ?? 0])
            .concat([["Win", (t) => t.p_win]])};
}
function koValues(stages, t) {
  const v = stages.map(([, f]) => f(t) ?? 0);
  const first = v.findIndex((x) => x > 0);
  return v.map((x, k) => first < 0 || k < first ? null : x);
}
// The tie in front of a side: the last stage it is sure to be in, and its chance of the next.
function koThrough(block, team) {
  const {stages} = koStages(block);
  const t = block.teams.find((x) => x.team === team);
  if (!t) return null;
  const v = stages.map(([, f]) => f(t) ?? 0);
  let cur = -1;
  for (let k = 0; k < v.length - 1; k++) if (v[k] >= 0.9999) cur = k;
  return cur < 0 ? null : {p: v[cur + 1], stage: stages[cur][0], next: stages[cur + 1][0]};
}
// Who counts as an outsider: for a cup, a side not in its country's top flight; for a UEFA
// competition, a side from outside the five leagues.
function outsidersOf(block) {
  if (RESULT.uefa.includes(block)) {
    const five = new Set(RESULT.leagues.flatMap((L) => L.teams.map((t) => t.team)));
    return {is: (team) => !five.has(team), who: "sides from outside the five leagues"};
  }
  const grp = GROUPS.find(([, cs]) => cs.includes(block.competition));
  const L = grp && RESULT.leagues.find((l) => l.competition === grp[1][0]);
  const top = new Set(L ? L.teams.map((t) => t.team) : []);
  return {is: (team) => !top.has(team), who: `sides from outside the ${L ? label(L.competition) : "top flight"}`};
}

// Road to the final: each side's chance of still being in at every stage. Every side is drawn;
// the favourites, or the sides picked, are lit. A stage's values sum to the sides in it.
function vizKO(block) {
  const {teams, stages, uefa,evidence} = koStages(block);
  if (!teams.length) return `<p class="note">No side has a round left to play.</p>`;
  const comp = block.competition, n = stages.length;
  const lit = hlOf(block, (t) => -(t.p_win || 0)), col = HLCOL[comp];
  const W = 1100, H = 420, m = {l: 58, r: 120, t: 18, b: 40};
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const X = (k) => m.l + k * iw / Math.max(n - 1, 1), Y = (v) => m.t + ih - v * ih;
  const grid = [0, 0.25, 0.5, 0.75, 1].map((v) => `<line x1="${m.l}" x2="${m.l + iw}" y1="${Y(v)}" y2="${Y(v)}"
      stroke="var(--line)"/><text x="${m.l - 8}" y="${Y(v) + 4}" text-anchor="end">${v * 100}%</text>`).join("")
    + stages.map(([name], k) => `<text x="${X(k)}" y="${H - m.b + 16}" text-anchor="middle">${name}</text>`).join("");
  const path = (v) => {
    let d = "", open = false;
    v.forEach((x, k) => {
      if (x == null) { open = false; return; }
      d += (open ? "L" : "M") + X(k).toFixed(1) + "," + Y(x).toFixed(1) + " ";
      open = true;
    });
    return d;
  };
  const vals = new Map(teams.map((t) => [t.team, koValues(stages, t)]));
  const stepData=new Map(teams.map(t=>{const raw=evidence(t),first=raw.findIndex(v=>Number.isFinite(v)&&v>0);return [t.team,ROUTES.knockoutSteps(raw.map((v,k)=>k<first&&v===0?null:v))];}));
  const invalid=teams.filter(t=>stepData.get(t.team).invalid);
  const rest = teams.filter((t) => !lit.includes(t.team));
  const faint = rest.map((t) => `<path d="${path(vals.get(t.team))}" fill="none" stroke="var(--dim)"
      stroke-opacity=".22" stroke-width="1.25"/>`).join("");
  const faintHit = rest.map((t) => `<path d="${path(vals.get(t.team))}" fill="none" stroke="transparent"
      stroke-width="8" style="cursor:pointer" data-hl="${esc(t.team)}" data-tip="${esc(`<b>${esc(t.team)}</b>
      — win ${pct(t.p_win)}; click to light it`)}"/>`).join("");
  const litT = lit.map((team) => teams.find((t) => t.team === team)).filter(Boolean);
  const bright = litT.map((t) => {
    const c = PALETTE[col[t.team] ?? 0], v = vals.get(t.team),steps=stepData.get(t.team),largest=steps.largest;
    const emphasis=largest&&largest.loss>0?`<line data-ko-loss="${esc(t.team)}" data-stage="${largest.index}" data-loss="${largest.loss}" x1="${X(largest.index-1)}" y1="${Y(v[largest.index-1])}" x2="${X(largest.index)}" y2="${Y(v[largest.index])}" stroke="${c}" stroke-width="6" stroke-opacity=".3"/>`:'';
    return `${emphasis}<path d="${path(v)}" fill="none" stroke="${c}" stroke-width="2.25" stroke-linejoin="round"/>`
      + v.map((x, k) => x == null ? "" : `<circle cx="${X(k)}" cy="${Y(x).toFixed(1)}" r="4" fill="${c}"
          stroke="var(--panel)" stroke-width="2"/><circle cx="${X(k)}" cy="${Y(x).toFixed(1)}" r="11"
          fill="transparent" data-team="${esc(t.team)}" data-tip="${esc(`<b>${esc(t.team)}</b> — ${stages[k][0]}: ${pct(x)}${steps.invalid?"<br>Derived progression unavailable: invalid/incomplete reach ladder":steps.steps.find(s=>s.index===k)?`<br>Reach ${esc(stages[k][0])} given ${esc(stages[k-1][0])}: ${pct(steps.steps.find(s=>s.index===k).through)}<br>Probability lost here: ${(steps.steps.find(s=>s.index===k).loss*100).toFixed(1)}pp`:""}`)}"/>`).join("");
  }).join("");
  const ends = litT.map((t) => ({team: t.team, y: Y(t.p_win || 0), y0: Y(t.p_win || 0)})).sort((a, b) => a.y - b.y);
  for (let k = 1; k < ends.length; k++) ends[k].y = Math.max(ends[k].y, ends[k - 1].y + 13);
  const labels = ends.map((e) => `<text class="vlab" x="${X(n - 1) + 10}" y="${e.y + 4}">${esc(shortName(e.team))}</text>`).join("");
  const chips = teams.slice().sort((a, b) => (b.p_win || 0) - (a.p_win || 0)).slice(0, 40)
    .map((t) => `<button data-hl="${esc(t.team)}" aria-pressed="${lit.includes(t.team)}">${lit.includes(t.team)
      ? `<i style="background:${PALETTE[col[t.team] ?? 0]}"></i>` : ""}${esc(t.team)}</button>`).join("");
  return `<div class="legend"><span>Chance of still being in at each stage${uefa ? " (the top 24 reach the knockouts)" : ""}
      · a line starts where a side enters · undrawn rounds drawn afresh in every world</span>
      <span><b>Thick segment</b> · largest absolute probability drop for each highlighted club · conditional progression in tooltips</span>
      <span>Favourites lit · click a side to light it (four at most)</span></div>
    ${invalid.length?`<p class="zbad" role="alert">${invalid.length} invalid/incomplete reach ladders · derived progression withheld: ${invalid.map(t=>esc(t.team)).join(', ')}. Raw probabilities remain in the chart.</p>`:''}
    <div class="scroll"><svg class="vchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Road to the final"
      style="max-width:${W}px;min-width:620px">${grid}${faint}${bright}${labels}${faintHit}</svg></div>
    <div class="scroll"><table data-ko-breakdown><thead><tr><th class="team">Highlighted club</th><th class="tie">Largest drop</th><th>Lost</th><th>Reach next given previous</th></tr></thead><tbody>${litT.map(t=>{const s=stepData.get(t.team).largest;return `<tr data-ko-team="${esc(t.team)}"><td class="team">${esc(t.team)}</td><td class="tie">${s?esc(stages[s.index-1][0]+' → '+stages[s.index][0]):'Unavailable'}</td><td>${s?(100*s.loss).toFixed(1)+'pp':'—'}</td><td>${s?pct(s.through):'—'}</td></tr>`;}).join('')}</tbody></table></div>
    ${chartHighlightsHtml(chips, lit.length)}`;
}

// Next ties: every drawn tie still to play, as the chance each side goes through it, beside the
// 90-minute odds of the match itself. Two sides of one tie sum to 100%.
function vizNT(block, kind) {
  const comp = block.competition;
  const ties = ((MATCHES || {}).fixtures || []).filter((f) => f.competition === comp && f.ladder
      && (kind !== "uefa" || f.round == null))
    .map((f) => ({f, h: koThrough(block, f.home), a: koThrough(block, f.away)}))
    .filter((x) => x.h && x.a && x.h.next === x.a.next)
    .sort((x, y) => x.f.kickoff.localeCompare(y.f.kickoff) || Math.abs(y.h.p - 0.5) - Math.abs(x.h.p - 0.5));
  if (!ties.length) {
    const h = (RESULT.handover || []).find((x) => x.competition === comp);
    const nxt = h && (h.playing || []).find((s) => !s.drawn);
    return `<p class="note">No tie is drawn and still to play${nxt ? ` — the ${roundName(nxt.label)} draw comes
      first, first legs from ${nxt.leg1}` : ""}. The paths and the road to the final already average over
      every draw it could make.</p>`;
  }
  const badge = (team) => useBadges() && badgeOf(team)
    ? `<img src="${badgeOf(team)}" alt="" style="width:18px;height:18px;vertical-align:middle;margin:0 6px">` : "";
  const body = ties.map(({f, h, a}) => {
    const ph = 100 * h.p / Math.max(h.p + a.p, 1e-9), pa = 100 - ph;
    return `<tr>${teamTd(f.home, `${esc(f.home)}${badge(f.home)}`).replace('class="team"', 'class="team" style="text-align:right"')}
      <td><b>${pct(h.p)}</b></td>
      <td style="width:38%;min-width:160px;padding:5px 10px"><div style="display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px">
        <i style="width:${ph.toFixed(1)}%;background:var(--accent)"></i><i style="width:${pa.toFixed(1)}%;background:var(--mid)"></i></div></td>
      <td><b>${pct(a.p)}</b></td>${teamTd(f.away, `${badge(f.away)}${esc(f.away)}`)}
      <td style="color:var(--dim)">${pct(f.ladder.h1)}</td><td style="color:var(--dim)">${pct(f.ladder.d)}</td>
      <td style="color:var(--dim)">${pct(f.ladder.a1)}</td><td style="color:var(--dim)">${f.kickoff.slice(0, 10)}</td></tr>`;
  }).join("");
  return `<div class="legend"><span>${ties.length} drawn ${ties.length === 1 ? "tie" : "ties"}: the chance each
      side goes through (extra time, penalties, second legs in) · then 90 minutes, 1 / X / 2 · a tie sums
      to 100%</span></div>
    <div class="scroll"><table class="ties"><thead><tr><th class="team" style="text-align:right">Home</th>
      <th title="Chance the home side goes through">Through</th><th></th><th title="Chance the away side goes through">Through</th>
      <th class="team">Away</th><th title="Home win in 90 minutes">1</th><th title="Draw in 90 minutes">X</th>
      <th title="Away win in 90 minutes">2</th><th>Date</th></tr></thead><tbody>${body}</tbody></table></div>`;
}

// Likeliest finals: the pairings the worlds' brackets produce most often, and who wins each.
// From the knockout paths: a side's final opponents carry P(this final) and P(it wins it).
function vizKF(block, kind, P) {
  if (!P) return `<p class="note">This snapshot has no knockout paths to read the finals from.</p>`;
  const pairs = new Map();
  for (const [team, path] of Object.entries(P.teams || {})) {
    const f = path.F;
    if (!f) continue;
    for (const [o, meet, thr] of f.top) {
      const opp = oppName(P, o), [a, b] = [team, opp].sort();
      const e = pairs.get(a + "|" + b) || {a, b, p: 0, win: {}};
      e.p = Math.max(e.p, meet);
      e.win[team] = thr;
      pairs.set(a + "|" + b, e);
    }
  }
  const list = [...pairs.values()].sort((x, y) => y.p - x.p).slice(0, 15);
  if (!list.length) return `<p class="note">No final is likely enough to list (each side's final is kept
      when it plays one in at least ${pct(P.min_reach ?? 0.01)} of worlds).</p>`;
  const top = list[0].p, covered = list.reduce((s, e) => s + e.p, 0);
  const badge = (team) => useBadges() && badgeOf(team)
    ? `<img src="${badgeOf(team)}" alt="" style="width:18px;height:18px;vertical-align:middle;margin-right:6px">` : "";
  const body = list.map((e, k) => {
    const wa = e.win[e.a] ?? (e.win[e.b] != null ? 1 - e.win[e.b] : null);
    const wb = e.win[e.b] ?? (wa != null ? 1 - wa : null);
    return `<tr><td style="color:var(--dim)">${k + 1}</td>${teamTd(e.a, badge(e.a) + esc(e.a))}
      <td style="color:var(--dim)">v</td>${teamTd(e.b, badge(e.b) + esc(e.b))}
      <td style="min-width:140px;padding:5px 10px"><div style="height:10px;border-radius:5px;background:var(--accent);
        width:${(100 * e.p / top).toFixed(1)}%"></div></td><td><b>${pct(e.p)}</b></td>
      <td title="${esc(e.a)} wins this final">${wa == null ? "—" : pct(wa)}</td>
      <td title="${esc(e.b)} wins this final">${wb == null ? "—" : pct(wb)}</td></tr>`;
  }).join("");
  return `<div class="legend"><span>The ${list.length} likeliest finals, ${pct(covered)} of all · the chance of
      each, then who wins it</span></div>
    <div class="scroll"><table class="narrow"><thead><tr><th></th><th class="team">Final</th><th></th>
      <th class="team"></th><th></th><th title="The chance of this final">Chance</th>
      <th title="The first side wins it">1st wins</th><th title="The second side wins it">2nd wins</th></tr></thead>
      <tbody>${body}</tbody></table></div>`;
}

// Outsiders: how many sides from outside the top flight (a cup) or the five leagues (UEFA) are
// still in at each stage, on average, and the ones likeliest to go furthest. Expected counts are
// sums of each side's own chance, so they add up exactly: outsiders + the rest = the stage's size.
function vizOS(block, kind) {
  const {teams, stages} = koStages(block);
  const {is, who} = outsidersOf(block);
  const out = teams.filter((t) => is(t.team));
  if (!teams.length) return `<p class="note">No side has a round left to play.</p>`;
  const sum = (ts, k) => ts.reduce((a, t) => a + (koValues(stages, t)[k] ?? 0), 0);
  const rows = stages.map(([name], k) => ({name, all: sum(teams, k), out: sum(out, k)}));
  const maxAll = Math.max(...rows.map((r) => r.all), 1);
  const bars = rows.map((r) => `<div class="fbar" style="grid-template-columns:110px 1fr 130px">
      <span>${r.name}</span><div class="track" style="display:flex;gap:2px;background:transparent">
        <i style="width:${(100 * r.out / maxAll).toFixed(2)}%;background:var(--warn)"></i>
        <i style="width:${(100 * (r.all - r.out) / maxAll).toFixed(2)}%;background:var(--panel2)"></i></div>
      <span data-os="${r.out.toFixed(3)}|${r.all.toFixed(3)}"><b>${r.out.toFixed(r.out < 10 ? 2 : 1)}</b> of ${r.all.toFixed(r.all < 10 ? 1 : 0)}</span></div>`).join("");
  const pWin = out.reduce((a, t) => a + (t.p_win || 0), 0);
  // how far, on average: the number of stages it reaches, a round it is exempt from counting as
  // reached -- West Ham, in at the R64, are further on than a side still playing the preliminaries
  const far = out.map((t) => ({t, v: koValues(stages, t)}))
    .map((x) => ({...x, score: x.v.reduce((a, y) => a + (y ?? 1), 0)}))
    .sort((a, b) => b.score - a.score).slice(0, 10);
  const head = `<tr><th class="team" title="The ten likeliest to go furthest: the most stages reached, on average">Furthest</th>${stages.map(([name]) => `<th>${name}</th>`).join("")}</tr>`;
  const body = far.map(({t, v}) => `<tr>${teamTd(t.team)}${v.map((x) => x == null
    ? `<td class="heat z"></td>` : heat(x)).join("")}</tr>`).join("");
  return `<div class="legend"><span>${who[0].toUpperCase() + who.slice(1)}: how many are still in at each
      stage, on average (amber, of all sides in it) · the ten likeliest to go furthest (blank: exempt) ·
      one lifts it in <b>${pct(pWin)}</b> of worlds</span></div>
    <div class="grid2" style="grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);align-items:start">
      <div>${bars}</div>
      <details><summary>Clubs most likely to go furthest</summary><div class="scroll">${far.length ? `<table class="narrow"><thead>${head}</thead><tbody>${body}</tbody></table>`
        : `<p class="note">No ${who} left in it.</p>`}</div></details></div>`;
}

// Strength against trophy chance: how much of a side's chance its strength explains, and who a
// draw or a format favours. NET on the competition's own scale for UEFA; on the five leagues' for
// a cup, whose sides from the lower divisions have no rating and are left out.
function vizSW(block, kind) {
  const R = ratingIdx(), comp = block.competition;
  const {teams} = koStages(block);
  const rated = teams.filter((t) => R[t.team]);
  if (!rated.length) return `<p class="note">No rated side in this competition.</p>`;
  const unr = teams.filter((t) => !R[t.team]);
  const own = kind === "uefa" && hasOwnScale(comp);
  const pts = rated.map((t) => {
    const r = own ? onScale(R[t.team], comp) : R[t.team];
    return {team: t.team, x: netOf(r), y: 100 * (t.p_win || 0), tone: kind === "uefa" ? toneOf(block, t) : null,
            tip: `<b>${esc(t.team)}</b><br>NET ${signedFx(netOf(r), 2)} · Elo ${Math.round(r.elo)}<br>win
              ${pct(t.p_win)} · final ${pct(t.p_f)} · SF ${pct(t.p_sf)}`};
  });
  return `${chartSettingsHtml(`${chartMarks()}`)}
    <div class="legend"><span><b>NET</b> (against ${own ? `an average ${label(comp)} side` : "an average side of the five leagues"})
      · simulated trophy chance · strength and competition format${unr.length ? ` · ${unr.length} unrated lower-division sides left out
        (${pct(unr.reduce((a, t) => a + (t.p_win || 0), 0))} between them)` : ""}</span>${kind === "uefa" ? zoneKey(block) : ""}</div>
    <p class="note"><b>Cross</b> · plotted clubs’ mean strength and trophy chance · descriptive comparison within this competition</p>
    ${scatter(pts, {title: "Strength against trophy chance", xlab: "NET →", ylab: "chance of winning it (%) →",
      quad:{x:meanOf(pts.map(p=>p.x)),y:meanOf(pts.map(p=>p.y))},
      corners:{tl:"lower strength · higher chance",tr:"higher strength · higher chance",bl:"lower strength · lower chance",br:"higher strength · lower chance"}})}`;
}

// ---- ratings through the season
// Real to the last round started, then the worlds' own: each side's state going into each round,
// averaged over every world that plays it, dashed, with its 80% range across them for the sides
// lit. Every side is drawn; up to four are lit, in colours that stay theirs while they are.
const RT_METRICS = [["elo", "Elo"], ["att", "Attack"], ["def", "Defence"], ["net", "NET"]];
let RTC = null;            // what the ratings chart's crosshair reads
function hlOf(block, rank = (t) => t.mean_pos ?? 99) {
  const comp = block.competition;
  if (!HL[comp]) {
    const byPos = block.teams.slice().sort((a, b) => rank(a) - rank(b)).map((t) => t.team);
    HL[comp] = [];
    for (const t of [FOCUS, ...byPos]) {
      if (t && byPos.includes(t) && !HL[comp].includes(t) && HL[comp].length < 3) HL[comp].push(t);
    }
  }
  const col = HLCOL[comp] ||= {};
  for (const t of Object.keys(col)) if (!HL[comp].includes(t)) delete col[t];
  for (const t of HL[comp]) {
    if (col[t] == null) {
      const used = new Set(Object.values(col));
      col[t] = [0, 1, 2, 3].find((k) => !used.has(k));
    }
  }
  return HL[comp];
}
function toggleHl(comp, team) {
  const lit = HL[comp] || (HL[comp] = []);
  const i = lit.indexOf(team);
  if (i >= 0) lit.splice(i, 1);
  else { if (lit.length >= HL_MAX) lit.shift(); lit.push(team); }
}

function vizRT(block, kind, g) {
  if (!g || !Array.isArray(g.elo)) {
    return `<p class="note">This snapshot has no ratings by round — they arrive with snapshot version 5.</p>`;
  }
  const comp = block.competition, metric = VIZOPT.metric;
  const tag = kind === "league" ? "GW" : "MD";
  const n = g.rounds + 1;
  const val = (i, at) => metric === "net"
    ? (g.att[i][at] == null || g.def[i][at] == null ? null : g.att[i][at] - g.def[i][at])
    : g[metric][i][at];
  const band = (i, at) => {
    if (metric === "net") return null;
    const v = val(i, at), sd = (g[metric === "elo" ? "elo_sd" : metric + "_lsd"][i] || [])[at];
    if (v == null || sd == null) return null;
    return metric === "elo" ? [v - Z80 * sd, v + Z80 * sd] : [v * Math.exp(-Z80 * sd), v * Math.exp(Z80 * sd)];
  };
  const real = g.rating_real || Array(n).fill(true);
  const lastReal = real.lastIndexOf(true);
  const referenceReal=Array.isArray(g.rating_real)&&g.rating_real.length===n&&g.rating_real.every(v=>typeof v==='boolean')?g.rating_real:null;
  const references=new Map(g.teams.map((team,i)=>{const known=referenceReal?Array.from({length:n},(_,at)=>referenceReal[at]?val(i,at):null).filter(Number.isFinite):[];return [team,known.length?meanOf(known):null];}));
  const lit = hlOf(block), col = HLCOL[comp];
  const W = 1100, H = 460, m = {l: 58, r: 120, t: 18, b: 40};
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const all = [];
  g.teams.forEach((_, i) => { for (let at = 0; at < n; at++) { const v = val(i, at); if (v != null) all.push(v); } });
  lit.forEach((t) => { const i = g.teams.indexOf(t); if (i < 0) return;
    for (let at = 0; at < n; at++) { const b = band(i, at); if (b) all.push(...b); } });
  if (!all.length) return `<p class="note">No ratings to draw.</p>`;
  const [y0, y1] = span(all, 0.04);
  const inv = metric === "def";          // fewer conceded is better, and better is up
  const X = (at) => m.l + (n === 1 ? iw / 2 : at * iw / (n - 1));
  const Y = (v) => inv ? m.t + (v - y0) / (y1 - y0) * ih : m.t + ih - (v - y0) / (y1 - y0) * ih;
  const ticks = niceTicks(y0, y1, 6, metric === "elo").ticks.filter((t) => t >= y0 && t <= y1);
  const dp = metric === "elo" ? 0 : 2;
  const grid = ticks.map((t) => `<line x1="${m.l}" x2="${m.l + iw}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/>
      <text x="${m.l - 8}" y="${Y(t) + 4}" text-anchor="end">${metric === "net" ? signedFx(t, 1) : t.toFixed(dp)}</text>`).join("");
  // every round on a short league phase; the first and every fifth on a long season
  const xl = Array.from({length: n}, (_, at) => at === n - 1 ? "Final"
      : (n <= 12 || at === 0 || (at + 1) % 5 === 0) ? `${tag}${at + 1}` : "")
    .map((t, at) => t ? `<text x="${X(at)}" y="${H - m.b + 16}" text-anchor="middle">${t}</text>` : "").join("");
  const path = (i, a, b) => {
    let d = "", open = false;
    for (let at = a; at <= b; at++) {
      const v = val(i, at);
      if (v == null) { open = false; continue; }
      d += (open ? "L" : "M") + X(at).toFixed(1) + "," + Y(v).toFixed(1) + " ";
      open = true;
    }
    return d;
  };
  const today = lastReal >= 0 && lastReal < n - 1
    ? `<line x1="${(X(lastReal) + X(lastReal + 1)) / 2}" x2="${(X(lastReal) + X(lastReal + 1)) / 2}" y1="${m.t}"
        y2="${m.t + ih}" stroke="var(--ink)" stroke-opacity=".35"/><text x="${(X(lastReal) + X(lastReal + 1)) / 2 + 4}"
        y="${m.t + 10}" style="font-size:10px">today →  projected</text>` : "";
  // every side, faint; a wide transparent stroke over each takes the hover and the click
  const rest = g.teams.map((team, i) => lit.includes(team) ? "" : `<path d="${path(i, 0, n - 1)}" fill="none"
      stroke="var(--dim)" stroke-opacity=".3" stroke-width="1.25"/>`).join("");
  const restHit = g.teams.map((team, i) => lit.includes(team) ? "" : `<path d="${path(i, 0, n - 1)}" fill="none"
      stroke="transparent" stroke-width="9" style="cursor:pointer" data-hl="${esc(team)}"
      data-tip="${esc(`<b>${esc(team)}</b> — click to light it`)}"/>`).join("");
  const litMarks = lit.map((team) => {
    const i = g.teams.indexOf(team);
    if (i < 0) return "";
    const c = PALETTE[col[team] ?? 0];
    const firstProj = lastReal + 1;
    let area = "";
    const bs = [];
    for (let at = Math.max(firstProj, 0); at < n; at++) { const b = band(i, at); if (b) bs.push([at, b]); }
    if (bs.length && lastReal >= 0 && val(i, lastReal) != null) bs.unshift([lastReal, [val(i, lastReal), val(i, lastReal)]]);
    if (bs.length > 1) {
      area = `<path d="M${bs.map(([at, b]) => `${X(at).toFixed(1)},${Y(b[1]).toFixed(1)}`).join(" L")} L${bs.slice().reverse()
        .map(([at, b]) => `${X(at).toFixed(1)},${Y(b[0]).toFixed(1)}`).join(" L")} Z" fill="${c}" fill-opacity=".12" stroke="none"/>`;
    }
    const solid = path(i, 0, Math.max(lastReal, 0));
    const dashed = lastReal < n - 1 ? path(i, Math.max(lastReal, 0), n - 1) : "";
    return `${area}<path d="${solid}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round"/>${dashed
      ? `<path d="${dashed}" fill="none" stroke="${c}" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"/>` : ""}`;
  }).join("");
  // end labels for the lit sides, nudged apart where they would collide, with a leader line
  const ends = lit.map((team) => { const i = g.teams.indexOf(team); const v = i < 0 ? null : val(i, n - 1);
    return v == null ? null : {team, y: Y(v), y0: Y(v)}; }).filter(Boolean).sort((a, b) => a.y - b.y);
  for (let k = 1; k < ends.length; k++) ends[k].y = Math.max(ends[k].y, ends[k - 1].y + 13);
  const endLabels = ends.map((e) => `${Math.abs(e.y - e.y0) > 2 ? `<line x1="${X(n - 1) + 2}" y1="${e.y0}"
      x2="${X(n - 1) + 8}" y2="${e.y}" stroke="var(--dim)"/>` : ""}<text class="vlab" x="${X(n - 1) + 10}"
      y="${e.y + 4}">${esc(shortName(e.team))}</text>`).join("");
  const baseline=VIZOPT.ratingReference==='on'?lit.filter(t=>Number.isFinite(references.get(t))).map(t=>`<line data-rating-reference="${esc(t)}" data-value="${references.get(t)}" x1="${m.l}" x2="${m.l+iw}" y1="${Y(references.get(t))}" y2="${Y(references.get(t))}" stroke="${PALETTE[col[t]??0]}" stroke-opacity=".55" stroke-dasharray="3 5"/>`).join(''):'';
  const readout=VIZOPT.ratingReference==='on'?`<p class="note"><b>Real-rating average</b> · equally weighted retained real observations; projected values excluded${referenceReal?'':' · unavailable without retained real/projected flags'} · ${lit.map(t=>{const i=g.teams.indexOf(t),value=lastReal>=0&&i>=0?val(i,lastReal):null,ref=references.get(t);return esc(shortName(t))+': '+(Number.isFinite(value)&&Number.isFinite(ref)?signedFx(value-ref,metric==='elo'?1:2)+' latest − average':'unavailable');}).join(' · ')}</p>`:'';
  RTC = {n, X, Y, W, g, val, band, lit, col, tag, dp, metric, real,references:VIZOPT.ratingReference==='on'?references:new Map()};
  const chips = g.teams.map((team, i) => ({team, t: block.teams.find((x) => x.team === team)}))
    .sort((a, b) => ((a.t || {}).mean_pos ?? 99) - ((b.t || {}).mean_pos ?? 99))
    .map(({team}) => `<button data-hl="${esc(team)}" aria-pressed="${lit.includes(team)}">${lit.includes(team)
      ? `<i style="background:${PALETTE[col[team] ?? 0]}"></i>` : ""}${esc(team)}</button>`).join("");
  const what = {elo: "<b>Elo</b>, the results rating", att: `<b>ATT</b>, npxG made a match against an average side of ${refOf(g)}`,
                def: `<b>DEF</b>, npxG conceded a match to an average side of ${refOf(g)} — fewer is higher`,
                net: `<b>NET</b>, ATT − DEF against an average side of ${refOf(g)}`}[metric];
  return `${chartSettingsHtml(`${chartOpt("metric", RT_METRICS)}${chartOpt("ratingReference",[["off","No reference"],["on","Real-rating average"]])}`)}
    <div class="legend"><span>${what}, going into each ${tag === "GW" ? "gameweek" : "matchday"} · solid real ·
      dashed the worlds' mean${metric === "net" ? "" : ", band 80% across worlds"}</span>
      <span>${metric === "elo" ? "Elo drifts: the worlds' results are less decisive than it expects"
        : "strength moves average zero: the mean stays flat, the band widens"} · click a side to light it (four at most)</span></div>
    <div class="scroll"><svg id="rtsvg" class="vchart" viewBox="0 0 ${W} ${H}" role="img"
      aria-label="Ratings through the season" style="max-width:${W}px;min-width:620px;cursor:crosshair">
      ${grid}${xl}${baseline}${today}${rest}${litMarks}${endLabels}
      <line id="rtx" x1="0" x2="0" y1="${m.t}" y2="${m.t + ih}" stroke="var(--ink)" stroke-opacity="0"/>
      <g id="rtdots"></g>${restHit}</svg></div>
    <div id="rtout" class="keys" style="min-height:24px;margin-top:6px"></div>
    ${readout}${chartHighlightsHtml(chips, lit.length)}`;
}

function attachRtCrosshair() {
  const svg = $("rtsvg");
  if (!svg || !RTC || typeof svg.getBoundingClientRect !== "function") return;
  const {n, X, Y, W, g, val, band, lit, col, tag, dp, metric, real,references} = RTC;
  const line = $("rtx"), dots = $("rtdots"), out = $("rtout");
  const fmt = (v) => metric === "net" ? signedFx(v, 2) : v.toFixed(dp);
  const show = (at) => {
    line.setAttribute("x1", X(at)); line.setAttribute("x2", X(at)); line.setAttribute("stroke-opacity", ".4");
    const rows = lit.map((team) => [team, g.teams.indexOf(team)]).filter(([, i]) => i >= 0 && val(i, at) != null);
    dots.innerHTML = rows.map(([team, i]) => `<circle cx="${X(at)}" cy="${Y(val(i, at)).toFixed(1)}" r="4"
      fill="${PALETTE[col[team] ?? 0]}" stroke="var(--panel)" stroke-width="2"/>`).join("");
    out.innerHTML = `<b style="margin-right:6px">${at === n - 1 ? "after the last round" : `into ${tag} ${at + 1}`}
        · ${(g.rating_days || [])[at] || ""} · ${real[at] ? "real" : "projected"}</b>` + rows.map(([team, i]) => {
      const b = real[at] ? null : band(i, at);
      return `<span><i style="background:${PALETTE[col[team] ?? 0]}"></i>${esc(team)} <b>${fmt(val(i, at))}</b>${Number.isFinite(references?.get(team))?` · vs real average ${signedFx(val(i,at)-references.get(team),dp)}`:""}${b
        ? ` <span style="color:var(--dim)">(${fmt(b[0])}–${fmt(b[1])})</span>` : ""}</span>`;
    }).join("");
  };
  const clear = () => {
    line.setAttribute("stroke-opacity", "0");
    dots.innerHTML = "";
    out.innerHTML = `<span style="color:var(--dim)">Tap or hover the chart to read a round.</span>`;
  };
  svg.onmousemove = (ev) => {
    const r = svg.getBoundingClientRect();
    const px = (ev.clientX - r.left) / r.width * W;
    let best = 0;
    for (let at = 1; at < n; at++) if (Math.abs(X(at) - px) < Math.abs(X(best) - px)) best = at;
    show(best);
  };
  svg.onmouseleave = clear;
  svg.onpointerup=ev=>{if(ev.pointerType==='touch')svg.onmousemove(ev);};
  clear();
}

// ---------------------------------------------------------------- player stats
// This file is independent of the forecast. Never attach the latest saved totals to a live or
// historical forecast with a different cutoff, even when both use the same payload version.
function playersPayload() {
  return PLAYERS_FOR === RESULT && PLAYERS?.season === RESULT?.params?.season
    && PLAYERS?.as_of === RESULT?.as_of ? PLAYERS : null;
}
function playersSettled() {
  return PLAYERS_FOR === RESULT && !["unrequested", "loading"].includes(PLAYERS_STATUS);
}
function ensurePlayers() {
  if (PLAYERS_FOR !== RESULT) {
    PLAYERS = null; PLAYERS_FOR = RESULT; PLAYERS_STATUS = "unrequested"; PLAYERS_PROMISE = null;
  }
  if (playersSettled()) return Promise.resolve(playersPayload());
  if (PLAYERS_PROMISE) return PLAYERS_PROMISE;
  const result = RESULT, q = result?.source?.date ? "?date=" + encodeURIComponent(result.source.date) : "";
  PLAYERS_STATUS = "loading";
  PLAYERS_PROMISE = jget("/api/players" + q).then((p) => {
    if (RESULT !== result || PLAYERS_FOR !== result) return null;
    const valid = p?.season === result.params.season && p?.as_of === result.as_of
      && p.competitions && typeof p.competitions === "object";
    PLAYERS = valid ? p : null; PLAYERS_STATUS = valid ? "ready" : "mismatch";
    return playersPayload();
  }).catch(() => {
    if (RESULT === result && PLAYERS_FOR === result) { PLAYERS = null; PLAYERS_STATUS = "missing"; }
    return null;
  });
  return PLAYERS_PROMISE;
}
function playerCompetition(comp) { return playersPayload()?.competitions?.[comp] || null; }
function hasPlayerData(comp) {
  const p = playerCompetition(comp);
  return Boolean(p?.coverage?.covered > 0 && Array.isArray(p.players) && p.players.length);
}
let PLAYER_METRICS;
let PLAYER_SELECTORS=null;
function playerRows(comp,team="all") {return PLAYER_SELECTORS.playerRows(playersPayload(),comp,team);}
function playerMetric(row,metric) {return PLAYER_SELECTORS.playerMetric(row,metric);}
function playerLeadersData(comp,metric=PLAYER_METRIC,team=PLAYER_TEAM,floor=PLAYER_MINUTES) {return PLAYER_SELECTORS.playerLeadersData(playersPayload(),comp,metric,team,floor);}
function playerBadges(teams) {
  return `<span class="player-badges">${teams.map((team) => {
    const badge = badgeOf(team);
    return badge ? `<img src="${badge}" alt="" data-team="${esc(team)}" title="${esc(team)}"/>` : "";
  }).join("")}</span>`;
}
function playerValue(value, metric) {
  if (value == null) return "—";
  return metric === "finishing" ? signedFx(value, 2) : ["xg", "xg90"].includes(metric) ? value.toFixed(2) : String(value);
}
function playerLeadersHtml(block, metric = PLAYER_METRIC, team = PLAYER_TEAM, floor = PLAYER_MINUTES, scoringOnly=false) {
  const comp = block.competition, p = playerCompetition(comp);
  if (!hasPlayerData(comp)) return '<p class="note" data-player-unavailable="1">Player stats unavailable in this snapshot.</p>';
  const data = playerLeadersData(comp, metric, team, floor), title = PLAYER_METRICS.find(([k]) => k === metric)?.[1] || "Goals";
  const clubs = [...new Set(p.players.flatMap((r) => Object.keys(r.by_team || {})))].sort((a, b) => a.localeCompare(b));
  const controls = `<div class="row" style="margin-bottom:10px"><div><label for="playermetric">Leaders in</label>
      <select id="playermetric" data-player-metric="1">${PLAYER_METRICS.filter(([k])=>!scoringOnly||['finishing','xg90','shots'].includes(k)).map(([k, t]) => `<option value="${k}"${k === metric ? " selected" : ""}>${t}</option>`).join("")}</select></div>
    <div><label for="playerteam">Club</label><select id="playerteam" data-player-team="1"><option value="all">Every club</option>
      ${clubs.map((club) => `<option value="${esc(club)}"${club === team ? " selected" : ""}>${esc(club)}</option>`).join("")}</select></div>
    ${metric === "xg90" ? `<div><label for="playerminutes">Minimum minutes</label><select id="playerminutes" data-player-floor="1">${[90, 180, 270, 450, 900].map((v) => `<option value="${v}"${v === floor ? " selected" : ""}>${v}</option>`).join("")}</select></div>` : ""}</div>`;
  const body = data.rows.map((r, i) => {
    const value = playerMetric(r, metric);
    return `<tr data-player-row="${esc(r.id)}" data-player-value="${value}" data-player-minutes="${r.minutes ?? ""}" data-player-team="${esc(team)}">
      <td class="team"><span class="player-rank">${i + 1}</span>${playerBadges(r.teams)}${WORKSPACE?`<button class="text-button" data-player="${esc(r.id)}">${esc(r.name)}</button>`:esc(r.name)}</td>
      <td class="tie">${r.teams.map((club) => `<span class="player-club" data-team="${esc(club)}">${esc(club)}</span>`).join(" / ")}</td>
      <td data-player-stat="minutes">${r.minutes == null ? "—" : r.minutes}</td><td data-player-stat="value"><b>${playerValue(value, metric)}</b></td></tr>`;
  }).join("");
  return `<div data-player-leaders="${esc(comp)}" data-player-selected-metric="${metric}" data-player-selected-team="${esc(team)}" data-player-selected-floor="${floor}">${controls}
    <div class="legend"><span><b>${data.rows.length} of ${data.eligible} leaders</b> · ${p.coverage.covered}/${p.coverage.played} matches covered${p.coverage.missing ? ` · ${p.coverage.missing} missing` : ""}
      · FotMob player xG includes penalties${["xg", "finishing", "xg90"].includes(metric) && p.coverage.xg_accounting?.outside_rounding > 0 ? " · Player totals may differ from team xG" : ""}${metric === "finishing" ? " · goals minus xG" : ""}${metric === "xg90" ? ` · at least ${floor} minutes` : ""}
      ${data.unknown ? ` · ${data.unknown} players without complete ${title} left out` : ""}${data.belowFloor ? ` · ${data.belowFloor} below the minutes floor` : ""}${data.omitted ? ` · ${data.omitted} beyond the first 50` : ""}</span>
      <span>${team === "all" ? "All club contributions combined for a transferred player" : "This club’s contribution only"} · click a club for its card</span></div>
    ${data.rows.length ? `<div class="scroll"><table><thead><tr><th class="team">Player</th><th class="tie">Club</th><th>MIN</th><th>${title}</th></tr></thead><tbody>${body}</tbody></table></div>`
      : '<p class="note" data-player-empty="1">No players with complete values meet this selection.</p>'}</div>`;
}
function teamScorerRows(team) {
  const pooled = new Map(), competitions = [];
  let covered = 0, played = 0;
  for (const [comp, p] of Object.entries(playersPayload()?.competitions || {})) {
    const c = p.teams?.[team];
    if (c) { covered += c.covered || 0; played += c.played || 0; if (c.covered) competitions.push(comp); }
    for (const player of p.players || []) {
      const part = player.by_team?.[team];
      if (!part) continue;
      const key = String(player.id), row = pooled.get(key) || {id: player.id, name: player.name, goals: 0, unknown: false};
      if (Number.isFinite(part.goals)) row.goals += part.goals; else row.unknown = true;
      pooled.set(key, row);
    }
  }
  const all = [...pooled.values()], rows = all.filter((r) => !r.unknown && r.goals > 0)
    .sort((a, b) => b.goals - a.goals || a.name.localeCompare(b.name) || String(a.id).localeCompare(String(b.id)));
  return {rows: rows.slice(0, 3), covered, played, unknown: all.filter((r) => r.unknown).length, competitions};
}
function teamScorersHtml(team) {
  const data = teamScorerRows(team), ready = playersPayload();
  const message = !ready ? (!playersSettled() ? "Loading player stats …" : "Player stats unavailable in this snapshot.")
    : !data.covered ? "No covered player stats for this side." : data.unknown ? "No scorers with complete goal totals." : "No player goals in covered matches.";
  return `<div class="comp" data-team-scorers="${esc(team)}"><h3>Top scorers — all competitions</h3>${data.rows.length
    ? data.rows.map((r) => `<div class="kv" data-scorer-row="${esc(r.id)}" data-scorer-goals="${r.goals}"><span>${playerBadges([team])}${esc(r.name)}</span><b>${r.goals}</b></div>`).join("")
    : `<p class="note" style="margin:0">${message}</p>`}${ready && data.played ? `<div class="note" style="margin:6px 0 0">${data.covered}/${data.played} matches covered${data.unknown ? ` · ${data.unknown} incomplete player totals left out` : ""}</div>` : ""}</div>`;
}

// ---------------------------------------------------------------- stats hub
// One competition's team statistics, or one selected player leaderboard.
const HUB_SUBS = [["team", "Team stats"], ["leaders", "Leaders"], ["venue", "Home & away"]];
let HUBSEL = "team";
function drawStatsHub(block) {
  const result = RESULT;
  if (!playersSettled()) ensurePlayers().then(() => {
    if (RESULT === result && !TEAM_PAGE && TAB === block.competition && viewOf(TAB) === "stats") drawStatsHub(block);
  });
  const rows = block.teams.filter((t) => t.real && t.real.n_stats);
  const modes = [...(rows.length ? HUB_SUBS : []), ...(hasPlayerData(block.competition) ? [["players", "Players"]] : [])];
  const sub = modes.some(([k]) => k === HUBSEL) ? HUBSEL : modes[0]?.[0];
  const clubs = new Set((playerCompetition(block.competition)?.players || []).flatMap((p) => Object.keys(p.by_team || {})));
  if (PLAYER_TEAM !== "all" && playersSettled() && !clubs.has(PLAYER_TEAM)) PLAYER_TEAM = "all";
  const body = sub === "players" ? playerLeadersHtml(block) : sub === "leaders" ? hubLeaders(block, rows)
    : sub === "venue" ? hubVenue(block, rows) : sub === "team" ? hubTeam(block, rows)
    : '<p class="note">No match stats available in this snapshot.</p>';
  const availability = !hasPlayerData(block.competition) ? `<p class="note" data-player-unavailable="1">${!playersSettled()
    ? "Loading player stats …" : "Player stats unavailable for this competition in this snapshot."}</p>` : "";
  $("cview").innerHTML = `<div class="panel">
      <div class="row" style="justify-content:space-between;margin-bottom:10px">
        <h2 style="margin:0">${label(block.competition)} — stats hub, this season</h2>
        <div class="seg" style="margin:0">${modes.map(([k, t]) =>
          `<button data-hub="${k}" aria-pressed="${k === sub}">${t}</button>`).join("")}</div>
      </div>${availability}${body}</div>`;
  if (typeof $("cview").querySelectorAll === "function") {
    $("cview").querySelectorAll("[data-hub]").forEach((b) => b.onclick = () => { HUBSEL = b.dataset.hub; drawStatsHub(block); writeHash(true); });
    $("cview").querySelectorAll("[data-ss]").forEach((b) => b.onclick = () => { STATSIDE = b.dataset.ss; drawStatsHub(block); });
    $("cview").querySelectorAll("select[data-player-metric]").forEach((b) => b.onchange = () => { PLAYER_METRIC = b.value; drawStatsHub(block); writeHash(true); });
    $("cview").querySelectorAll("select[data-player-team]").forEach((b) => b.onchange = () => { PLAYER_TEAM = b.value; drawStatsHub(block); writeHash(true); });
    $("cview").querySelectorAll("select[data-player-floor]").forEach((b) => b.onchange = () => { PLAYER_MINUTES = Number(b.value); drawStatsHub(block); writeHash(true); });
  }
  afterRender();
}
function hubTeam(block, rows) {
  const side = STATSIDE, diff = side === "diff";
  const fmt = (k, v) => k === "poss" ? (diff ? signedFx(v, 1) : v.toFixed(1)) : diff ? signedFx(v, 2)
    : v.toFixed(k === "sh" || k === "crn" ? 1 : 2);
  const data = rows.map((t) => ({t, s: statRow(t.real, side)}))
    .sort((a, b) => side === "against" ? a.s.xg - b.s.xg : b.s.xg - a.s.xg);
  const head = `<tr><th class="team">Team</th><th title="Matches played">PL</th>${STAT_COLS.map(([k, t, tip]) =>
    `<th title="${tip}${diff ? ", for − against" : ""} a match"${side === "against" && k !== "poss" ? ' data-sort="1" data-first="asc"' : ""}>${t}</th>`).join("")}</tr>`;
  const body = data.map(({t, s}) => `<tr>${teamTd(t.team)}<td style="color:var(--dim)">${t.real.pl}</td>${STAT_COLS.map(([k]) =>
    `<td${k === "xg" ? ' style="font-weight:600"' : ""} data-v="${s[k].toFixed(4)}">${fmt(k, s[k])}</td>`).join("")}</tr>`).join("");
  return `<div class="row" style="justify-content:space-between;margin-bottom:6px">
      <div class="legend" style="margin:0"><span>${side === "for" ? "What each side makes" : side === "against"
        ? "What each side allows" : "Made minus allowed"}, a match · FotMob's numbers · xG includes penalties</span><span>Sort by heading · click a team for its card</span></div>
      <div class="seg small" style="margin:0">${[["for", "For"], ["against", "Against"], ["diff", "Difference"]].map(([k, t]) =>
        `<button data-ss="${k}" aria-pressed="${k === side}">${t}</button>`).join("")}</div></div>
    <div class="scroll"><table class="sortable"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}
// The leaders: the top five sides in each stat, best first. A stat a match unless it says total.
const LEADERS = [
  ["Most xG a match", (r) => r.xg / Math.max(r.n_xg, 1), 2, false],
  ["Fewest xG allowed a match", (r) => r.xga / Math.max(r.n_xg, 1), 2, true],
  ["Best xG difference a match", (r) => (r.xg - r.xga) / Math.max(r.n_xg, 1), 2, false],
  ["Most goals a match", (r) => r.gf / Math.max(r.pl, 1), 2, false],
  ["Fewest goals conceded a match", (r) => r.ga / Math.max(r.pl, 1), 2, true],
  ["Most shots a match", (r) => r.shots / Math.max(r.n_stats, 1), 1, false],
  ["Most shots on target a match", (r) => r.sot / Math.max(r.n_stats, 1), 1, false],
  ["Most big chances a match", (r) => r.bigch / Math.max(r.n_stats, 1), 1, false],
  ["Most possession", (r) => r.poss, 1, false],
  ["Best finishing, GF − xG (total)", (r) => r.gf - r.xg, 1, false],
  ["Best goalkeeping, xGOT faced − GA (total)", (r) => r.xgota - r.ga, 1, false],
  ["Most points over xG PTS (total)", (r) => r.pts - r.xpts, 1, false],
  ["Most penalties won", (r) => r.pens, 0, false],

function hubLeaders(block, rows) {
  const badge = (team) => badgeOf(team) ? `<img src="${badgeOf(team)}" alt="" style="width:16px;height:16px;vertical-align:middle;margin-right:6px">` : "";
  const cards = LEADERS.map(([title, f, dp, asc]) => {
    const top = rows.map((t) => ({t, v: f(t.real)})).filter((x) => Number.isFinite(x.v))
      .sort((a, b) => asc ? a.v - b.v : b.v - a.v).slice(0, 5);
    return `<div class="comp" style="cursor:default"><h3>${title}</h3>${top.map(({t, v}, k) =>
      `<div class="kv"><span>${k + 1}. <span data-team="${esc(t.team)}" style="cursor:pointer">${badge(t.team)}${esc(t.team)}</span></span>
        <span><b>${dp === 1 && title.includes("total") ? signedFx(v, dp) : v.toFixed(dp)}</b></span></div>`).join("")}</div>`;
  }).join("");
  return `<div class="legend"><span>The top five in each · a match unless it says total · click a team for its card</span></div>
    <div class="card" style="border:0;padding:0;margin:0"><div class="comps">${cards}</div></div>`;
}
function hubVenue(block, rows) {
  const v = (r, side) => r[side] || {pl: 0, pts: 0, gf: 0, ga: 0, xg: 0, xga: 0, n_xg: 0};
  const ppm = (x) => x.pl ? x.pts / x.pl : 0;
  const data = rows.map((t) => ({t, h: v(t.real, "home"), a: v(t.real, "away")}))
    .sort((x, y) => (ppm(y.h) - ppm(y.a)) - (ppm(x.h) - ppm(x.a)));
  const cells = (x) => `<td style="color:var(--dim)">${x.pl}</td><td><b>${x.pts}</b></td><td>${x.gf}–${x.ga}</td>
    <td>${x.xg.toFixed(1)}–${x.xga.toFixed(1)}</td><td data-v="${ppm(x).toFixed(3)}">${ppm(x).toFixed(2)}</td>`;
  const sub = ["PL", "PTS", "+/−", "x+/x−", "PTS/M"].map((t) => `<th>${t}</th>`).join("");
  return `<div class="legend"><span>Each side at home and away · <b>PTS/M</b> points a match · <b>GAP</b> home
      minus away points a match · sorted on it</span><span>Sort by heading · click a team for its card</span></div>
    <div class="scroll"><table class="sortable"><thead>
      <tr><th style="position:static"></th><th class="zh" colspan="5" style="position:static">Home</th>
        <th class="zh" colspan="5" style="position:static">Away</th><th style="position:static"></th></tr>
      <tr><th class="team">Team</th>${sub}${sub}<th class="nc" title="Home minus away points a match">GAP</th></tr></thead>
      <tbody>${data.map(({t, h, a}) => `<tr>${teamTd(t.team)}${cells(h)}${cells(a)}${moveTd(ppm(h) - ppm(a), 2)}</tr>`).join("")}</tbody>
    </table></div>`;
}

// League strength: each league's sides along one NET axis, one row a league, the league's mean
// marked. How strong a league is at the top, and how deep.
function allLeagueStrength() {
  const R = (RESULT.ratings || {}).teams || [];
  const comps = LEAGUE_ORDER();
  if (!R.length) return `<p class="note">This snapshot has no ratings.</p>`;
  // NET (the npxG fit, chances) or Elo (results): the same sides on either, one toggle
  const elo = VIZOPT.lsm === "elo";
  const val = elo ? (r) => r.elo : netOf;
  const fmt = elo ? (v, dp = 0) => Math.round(v).toString() : (v, dp = 1) => signedFx(v, dp);
  const all = R.filter((r) => r.league).map(val);
  const W = 1100, rh = 64, m = {l: 150, r: 250, t: 16, b: 40}, H = m.t + comps.length * rh + m.b;
  const [x0, x1] = span(all, 0.04), X = (v) => m.l + (v - x0) / (x1 - x0) * (W - m.l - m.r);
  // three markers a league: its mean, and the mean of its best ten and best five -- how strong it
  // is at the top as well as how deep. The numbers sit in a column on the right, not on the plot.
  const MARKS = [["mean", "var(--ink)", ".6"], ["top 10", "var(--mid)", "1"], ["top 5", "var(--accent)", "1"]];
  const ticks = niceTicks(x0, x1, 8, elo).ticks.filter((t) => t >= x0 && t <= x1);
  const grid = ticks.map((t) => `<line x1="${X(t)}" x2="${X(t)}" y1="${m.t}" y2="${H - m.b}" stroke="var(--line)"/>
      <text x="${X(t)}" y="${H - m.b + 16}" text-anchor="middle">${fmt(t)}</text>`).join("");
  const rows = comps.map((c, k) => {
    const y = m.t + k * rh + rh / 2, side = R.filter((r) => r.league === c).sort((a, b) => val(a) - val(b));
    const best = side.map(val).sort((a, b) => b - a);

    const spread=best.length?`<g data-league-spread="${esc(c)}" data-q1="${q1}" data-median="${median}" data-q3="${q3}" tabindex="0" role="img" aria-label="${esc(label(c))} middle half of clubs" data-tip="${esc(`<b>${esc(label(c))}</b><br>Middle 50% ${fmt(q1,2)} to ${fmt(q3,2)}<br>Median ${fmt(median,2)} · ${best.length} clubs`)}"><rect x="${X(q1)}" y="${y-22}" width="${Math.max(1,X(q3)-X(q1))}" height="44" fill="var(--mid)" fill-opacity=".12"/><line x1="${X(median)}" x2="${X(median)}" y1="${y-24}" y2="${y+24}" stroke="var(--mid)" stroke-dasharray="3 4"/></g>`:'';
    const marks = [meanOf(best), meanOf(best.slice(0, 10)), meanOf(best.slice(0, 5))];
    const dots = side.map((r, j) => {
      const cy = y + ((j % 3) - 1) * 9, url = useBadges() ? badgeOf(r.team) : null, x = X(val(r));
      const mark = url ? `<image href="${url}" x="${x - 9}" y="${cy - 9}" width="18" height="18"/>`
        : `<circle cx="${x}" cy="${cy}" r="5" fill="${leagueColour(c)}" stroke="var(--panel)" stroke-width="2"/>`;
      return mark + `<circle class="hit" cx="${x}" cy="${cy}" r="11" fill="transparent" style="cursor:pointer"

    }).join("");

        stroke="${MARKS[j][1]}" stroke-width="2" stroke-opacity="${MARKS[j][2]}"/>`).join("");
    const nums = marks.map((v, j) => `<line x1="${W - m.r + 24 + j * 76}" x2="${W - m.r + 36 + j * 76}" y1="${y}" y2="${y}"
        stroke="${MARKS[j][1]}" stroke-width="2" stroke-opacity="${MARKS[j][2]}"/><text class="vlab" x="${W - m.r + 40 + j * 76}"
        y="${y + 4}" data-ls="${c}|${MARKS[j][0]}|${v.toFixed(4)}">${fmt(v, 2)}</text>`).join("");
    return `<text class="vlab" x="${m.l - 12}" y="${y + 4}" text-anchor="end">${label(c)}</text>${spread}${lines}${dots}${nums}`;
  }).join("");
  return `${chartSettingsHtml(chartOpt("lsm", [["net", "NET"], ["elo", "Elo"]])+chartMarks())}
    <div class="legend"><span>Each league's sides by ${elo ? "<b>Elo</b>, the results rating" : `<b>NET</b> — npxG margin a
      match over an average side of the five leagues`}</span><span>Lines: ${MARKS.map(([l, c, o]) =>
        `<i class="fdrk" style="background:${c};opacity:${o}"></i> ${l}`).join(" · ")} — the average of all its sides,
      its best ten, its best five · <b>Shaded band</b>: middle 50% of clubs · dashed tick: median</span><span>Hover a side · click for its card</span></div>
    <div class="scroll"><svg class="vchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="League strength" style="max-width:${W}px">
      ${grid}${rows}<text x="${m.l + (W - m.l - m.r) / 2}" y="${H - 6}" text-anchor="middle" class="vlab">${elo ? "Elo" : "NET"} →</text>
      ${MARKS.map(([l], j) => `<text x="${W - m.r + 24 + j * 76}" y="${m.t + 4}" style="font-size:10px">${l}</text>`).join("")}</svg></div>`;
}
// Title races: each league's title chances, the top four as segments, and how open it is -- the
// effective number of contenders, 1 / Σp², which is 1 when one side is certain.
function allTitleRaces() {
  const races = RESULT.leagues.map((L) => {
    const ps = L.teams.map((t) => ({t, p: t.p_win || 0})).sort((a, b) => b.p - a.p);
    return {L, ps, eff: 1 / Math.max(ps.reduce((a, x) => a + x.p * x.p, 0), 1e-9)};
  }).sort((a, b) => b.eff - a.eff);
  const rows = races.map(({L, ps, eff}) => {
    const top = ps.slice(0, 4), rest = Math.max(0, 1 - top.reduce((a, x) => a + x.p, 0));
    const seg = top.map((x, k) => `<i title="${esc(x.t.team)} ${pct(x.p)}" style="width:${(100 * x.p).toFixed(2)}%;
        background:${PALETTE[k]};display:block"></i>`).join("") + `<i title="the rest ${pct(rest)}"
        style="width:${(100 * rest).toFixed(2)}%;background:var(--panel2);display:block"></i>`;
    return `<tr><td class="team">${label(L.competition)}</td><td><b>${eff.toFixed(2)}</b></td>
      <td style="min-width:300px;width:55%;padding:5px 10px"><div style="display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px">${seg}</div></td>
      <td class="haul">${top.map((x, k) => `<span style="white-space:nowrap;margin-right:10px"><i class="fdrk" style="background:${PALETTE[k]}"></i>
        <span data-team="${esc(x.t.team)}" style="cursor:pointer">${esc(shortName(x.t.team))}</span> ${pct(x.p)}</span>`).join("")}</td></tr>`;
  }).join("");
  return `<div class="legend"><span>Each league's title chances, the four likeliest as segments · <b>OPEN</b> the
      effective number of contenders (1 / Σp²: 1 is a certainty) · most open first</span></div>
    <div class="scroll"><table><thead><tr><th class="team">League</th><th title="Effective number of contenders">OPEN</th>
      <th></th><th class="tie">The four likeliest</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function nextLine(comp, team, empty) {
  const n = (NEXT[comp] || {})[team];
  if (!n) return `<div class="note" style="margin:6px 0 0">${empty}</div>`;
  const who = `${n.isHome ? "v" : "at"} ${n.opponent}`;
  if (n.result) return `<div class="note" style="margin:6px 0 0">Last: ${who} ${n.result[0]}–${n.result[1]}</div>`;
  // what rides on it for this side (version 10): the fate its result moves most
  const keys = n.keys || STAKES_OF[n.kind] || [];
  const top = stakesOf(n.stakes, keys).sort((a, b) => b.swing - a.swing)[0];
  const stake = top && top.swing >= 0.005 ? `<div class="stat" style="margin-top:2px" title="${esc(stakesText(n.stakes, keys, team))}">
      <span class="kv2"><span>At stake</span><b>${stakeName(top.key)}</b></span>${["win", "draw", "loss"].map((r, k) =>

}

// ---------------------------------------------------------------- match card
// The short match route is independent of competition/team view state underneath the card.
function matchKey(f) { return [f.home, f.away, String(f.kickoff).slice(0, 10)].join("|"); }
function whatifKey(entry) { return [entry.competition, matchKey(entry.f)].join("|"); }
function whatifSource(f, competition = f.competition) {
  if (WHATIF_INDEX_FOR !== MATCHES) {
    WHATIF_INDEX = new Map((MATCHES?.fixtures || []).map((m) => [[m.competition, matchKey(m)].join("|"), m]));
    WHATIF_INDEX_FOR = MATCHES;
  }
  const value = f.whatif ?? WHATIF_INDEX.get([competition, matchKey(f)].join("|"))?.whatif;
  return value && typeof value === "object" && !Array.isArray(value) ? value : null;
}
function whatifAvailable(entry) {
  return !entry.f.result && (entry.kind === "league" || entry.kind === "uefa")
    && Object.keys(whatifSource(entry.f, entry.competition) || {}).length > 0;
}
function whatifNow(competition, kind, team, fate) {
  const blocks = kind === "league" ? RESULT.leagues : RESULT.uefa;
  const block = blocks.find((b) => b.competition === competition);
  const t = block?.teams.find((r) => r.team === team);
  if (!t) return null;
  let value;
  if (kind === "league") {
    const world = perWorldQualification(block), ucl = world ? t.p_ucl : t.p_ucl ?? t.p_top4;
    const europe = world ? ([ucl, t.p_uel, t.p_uecl].every(Number.isFinite) ? ucl + t.p_uel + t.p_uecl : null)
      : ucl == null ? null : ucl + (t.p_uel || 0) + (t.p_uecl || 0);
    value = {title: t.p_win, ucl, euro: europe, down: t.p_releg}[fate];
  } else value = {top8: t.p_top8, top24: t.p_out == null ? null : 1 - t.p_out, r16: t.p_r16, win: t.p_win}[fate];
  return value != null && Number.isFinite(value) ? value : null;
}
function whatifRows(entry, result = 0) {
  const selected = [0, 1, 2].includes(result) ? result : 0;
  const source = whatifSource(entry.f, entry.competition) || {}, keys = entry.keys || STAKES_OF[entry.kind] || [];
  const rows = []; let omitted = 0, missing = 0, candidates = 0;
  for (const [team, fates] of Object.entries(source)) {
    for (let k = 0; k < keys.length; k++) {
      candidates++;
      const key = keys[k], now = whatifNow(entry.competition, entry.kind, team, key), conditional = fates[k]?.[selected];
      if (now == null || conditional == null || !Number.isFinite(conditional)) { missing++; continue; }
      const delta = conditional - now;
      if (Math.abs(delta) + 1e-12 < 0.005) { omitted++; continue; }
      rows.push({team, key, now, conditional, delta});
    }
  }
  rows.sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta) || a.team.localeCompare(b.team) || keys.indexOf(a.key) - keys.indexOf(b.key));
  return {rows, omitted, missing, candidates};
}
function whatifPanelHtml(entry, result = 0) {
  const selected = [0, 1, 2].includes(result) ? result : 0;
  const data = whatifRows(entry, selected), labels = [entry.f.home + " win", "a draw", entry.f.away + " win"];
  const pills = optRow("whatif", [["0", "Home win"], ["1", "Draw"], ["2", "Away win"]], selected)
    .replace(/data-val="([012])"/g, 'data-val="$1" data-whatif-result="$1"');
  return `<div data-whatif-result-table="${selected}" data-whatif-shown="${data.rows.length}" data-whatif-omitted="${data.omitted}" data-whatif-missing="${data.missing}" data-whatif-candidates="${data.candidates}">${pills}
    <div class="legend"><span><b>Conditional on ${esc(labels[selected])}</b> at 90 minutes · <b>Now</b> current chance · <b>Δ</b> with result minus now, in percentage points</span>
      <span><b>${data.rows.length} fates shown</b> · ${data.omitted} below 0.5pp · ${data.missing} unavailable</span></div>
    ${data.rows.length ? `<div class="scroll"><table><thead><tr><th class="team">Team</th><th class="tie">Fate</th><th>Now</th><th>With result</th><th>Δ</th></tr></thead>
      <tbody>${data.rows.map((r) => {
        let delta = moveTd(100 * r.delta, 1);
        if (r.key === "down") delta = delta.replace(r.delta > 0 ? " up" : " down", r.delta > 0 ? " down" : " up");
        return `<tr data-whatif-row="${esc(r.team + "|" + r.key)}" data-whatif-now="${r.now}" data-whatif-conditional="${r.conditional}" data-whatif-delta="${r.delta}">
          ${teamTd(r.team)}<td class="tie">${stakeName(r.key)}</td><td>${pct(r.now)}</td><td>${pct(r.conditional)}</td>${delta}</tr>`;
      }).join("")}</tbody></table></div>` : '<p class="note">No fate has an available move of at least 0.5pp for this result.</p>'}</div>`;
}
function whatifCardHtml(entry) {
