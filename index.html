function qualificationNote(block) {
  if (!perWorldQualification(block)) return "";
  return `<b>Europe ${entrySeason(block)}</b> competition entry, including qualifying · league, cup and UEFA-winner routes${block.qualification.eps_policy === "previous_allocation" ? " · EPS allocation held from last season" : ""}`;
}
function europeTeam(team) {
  return (Array.isArray(RESULT.europe?.teams) ? RESULT.europe.teams : []).find((r) => r.team === team) || null;
}
function teamEuropeHtml(team) {
  if (RESULT.leagues.some((b) => b.teams.some((t) => t.team === team))) return "";
  const row = europeTeam(team), keys = [["ucl", "UCL"], ["uel", "UEL"], ["uecl", "UECL"]];
  if (!row || !keys.some(([key]) => Number.isFinite(row["p_" + key]) && row["p_" + key] > 0)) return "";
  const foreign = row.association == null;
  return `<div class="comp" data-team-europe="${esc(team)}" data-team-europe-scope="${foreign ? "title_route" : "competition_entry"}"><h3>Europe — ${entrySeason()}</h3>
    <div class="stat">${keys.map(([key, name]) => `<span class="kv2" data-europe-fate="${key}" data-europe-p="${row["p_" + key] ?? ""}"><span>${name}</span><b>${row["p_" + key] == null ? "—" : pct(row["p_" + key])}</b></span>`).join("")}</div>
    <div class="note" style="margin:6px 0 0">${foreign ? "UEFA-winner route only · domestic qualification not modeled" : "Competition entry, including qualifying"}</div></div>`;
}
function league(l) {
  const now = l.teams.some((t) => t.now), world = perWorldQualification(l);
  const u = l.ucl_spots ?? 4, e = l.uel_spots ?? 0, c = l.uecl_spots ?? 0;
  const eu = l.teams.some((t) => t.p_uel != null) && (e || c);
  const range = (a, b) => a === b ? ordinal(a) : `${ordinal(a)}–${ordinal(b)}`;
  const next5 = l.teams.some((t) => t.next5);
  const places = now ? placesNow(l) : null;
  const columns = overviewColumns(l, "league");
  const head = overviewHead(columns);
  const body = overviewRows(l, "league").map(t => overviewRow(l, t, columns)).join("");
  return `<div class="panel" data-qualification-mode="${world ? "per_world" : "position"}">
    ${panelTitle(`${label(l.competition)} — ${RESULT.worlds.toLocaleString()} simulated seasons`, overviewControls())}
    <div class="legend"><span><b>PTS</b> banked · <b>XPTS</b> expected final points · <b>Δ</b> ${moveName()} · select a team for detail</span></div>
    ${overviewNote(l, columns)}
    <div class="scroll"><table class="sortable" data-overview="${esc(l.competition)}"><thead>${head}</thead><tbody>${body}</tbody>
      </table></div>
    <details class="overview-definitions"><summary>Forecast definitions & points thresholds</summary>
    <div class="legend">
      <span>${COLUMN_PROFILE === "next" ? "<b>PL/PTS</b> real table" : `${now ? `<b>PTS</b> points so far${places ? " · <b>POS</b> place now" : ""} · ` : ""}<b>XPTS</b> expected final points${["forecast", "all"].includes(COLUMN_PROFILE) ? " · <b>XPOS</b> expected place" : ""} · <b>TITLE</b> (${moveKey(", in points")})`}</span>
      ${["forecast", "all"].includes(COLUMN_PROFILE) ? `<span>${world ? qualificationNote(l) : `<b>UCL</b> ${range(1, u)}${eu ? ` · <b>UEL</b> ${range(u + 1, u + e)} · <b>UECL</b> ${range(u + e + 1, u + e + c)}` : ""}`}
        · <b>REL</b> bottom ${l.relegated}${!world && l.places_from ? " (places as last season's table sent them)" : ""}</span>` : ""}
      ${next5 && ["next", "all"].includes(COLUMN_PROFILE) ? `<span><b>Next 5</b> <i class="fdrk b1"></i> hard → <i class="fdrk b5"></i> easy, for an
        average side · hover a block</span>` : ""}
      ${["next", "all"].includes(COLUMN_PROFILE) ? `<span>Next fixture: ${NEXT_KEY}</span>` : ""}
      <span>Sort by heading · click a team for its card</span></div>
    ${linesStrip(l)}
    </details></div>`;
}

// The league phase decides three things at once, so its finish is shown as the three zones it
// splits into -- they partition the outcome and sum to 100% -- before the knockout ladder: the top
// eight go straight to the round of 16, ninth to 24th into a two-legged play-off for the other
// eight places, and the rest are out. P and PTS are the real league phase so far.
const UEFA_ZONES = [[1, 8, "good", "Top 8"], [9, 24, "warn", "Play-off"], [25, 36, "bad", "Out"]];
function uefa(u) {
  const now = u.teams.some(t => t.now), xpts = u.teams.some(t => t.mean_pts != null);
  const next5 = u.teams.some(t => t.next5), places = now ? placesNow(u) : null;
  const columns = overviewColumns(u, "uefa"), head = overviewHead(columns);
  const rows = overviewRows(u, "uefa");
  const body = rows.map(t => overviewRow(u, t, columns)).join("");
  return `<div class="panel">${panelTitle(`${label(u.competition)} — ${u.worlds.toLocaleString()} simulated seasons`, overviewControls())}
    <div class="legend"><span><b>PTS</b> banked · <b>XPTS</b> expected phase points · <b>Δ</b> ${moveName()} · select a team for detail</span></div>
    ${overviewNote(u, columns)}
    <div class="scroll"><table class="sortable" data-overview="${esc(u.competition)}"><thead>${head}</thead><tbody>${body}</tbody>
      </table></div>
    <details class="overview-definitions"><summary>Forecast definitions & points thresholds</summary>
    <div class="legend"><span>${COLUMN_PROFILE === "next" ? "<b>PL/PTS</b> league phase so far" : `${now ? `<b>PTS</b> phase points${places ? " · <b>POS</b> place now" : ""} · ` : ""}${xpts ? "<b>XPTS</b> expected phase points · " : ""}${["forecast", "all"].includes(COLUMN_PROFILE) ? "<b>XPOS</b> expected phase place · " : ""}<b>Top 8</b> direct to R16 · <b>Win</b> trophy chance (${moveKey(", in points")})`}</span>
      ${["forecast", "all"].includes(COLUMN_PROFILE) ? `<span><b>Top 8</b> to the R16 · <b>9–24</b> to the play-off · <b>Out</b> (the three sum to 100%) · then the chance of reaching each round</span>` : ""}
      ${next5 && ["next", "all"].includes(COLUMN_PROFILE) ? `<span><b>Next 5</b> <i class="fdrk b1"></i> hard → <i class="fdrk b5"></i> easy, for an
        average side</span>` : ""}
      ${["next", "all"].includes(COLUMN_PROFILE) ? `<span>Next fixture: ${NEXT_KEY}</span>` : ""}
      <span>Sort by heading · click a team for its card</span></div>
    ${linesStrip(u)}
    </details></div>`;
}

// A domestic cup has no table and no seeding, so there is nothing to show but the reach ladder:
// how often each team is still in it at each round, and how often it lifts the thing. That is
// what the simulator counts (see `cup_bracket.py`), and it is counted over the SAME worlds as the
// league tables beside it.
//
// Two identities hold exactly and are asserted in render_check: the win column sums to 1 over the
// field, and the column for a round sums to the number of teams in that round. Both survive the
// trim below, because everything it removes contributes zero to either.
function cup(c) {
  const {rounds, teams, dropped} = trimCup(c);
  const next = Object.values(NEXT[c.competition] || {});
  const regulation = next.length > 0 && next.every((n) => n.score_basis === "90min");
  const head = `<tr><th class="team">Team</th>`
    + rounds.map((r) => `<th>${roundName(r)}</th>`).join("")
    + `<th>Win</th>${moveTh("win chance, in points")}`
    + nextHead("Next tie") + `</tr>`;
  const body = teams.map((t) => `<tr>${teamTd(t.team)}`
    + rounds.map((r) => heat(t["p_" + r.toLowerCase()])).join("")
    + heat(t.p_win) + moveCell(c.competition, t.team, "p_win")
    + nextCells(c.competition, t.team, "not drawn") + `</tr>`).join("");
  const drawn = c.drawn_from
    ? `Drawn to the ${roundName(c.drawn_from)}; later rounds drawn afresh in every world`
    : `Every remaining pairing is known`;
  return `<div class="panel">
    ${panelTitle(`${label(c.competition)} — ${c.worlds.toLocaleString()} simulated cups`)}
    <div class="legend">
      <span>Chance of reaching each round, then <b>Win</b> (${moveKey(", in points")}) · a
        round's column sums to its size</span><span>${drawn}</span>
      <span class="swatch"></span><span>0 → 100%</span><span>· under 0.05%</span></div>
    <div class="legend">
      <span>Next tie ${regulation ? "over 90 minutes" : "— stored match results"}: ${NEXT_KEY}${regulation ? " · <b>D</b> = level after 90 minutes" : ""}
        · later-round columns show who goes through${next.some((n) => Number.isFinite(n.p_occurs) && n.p_occurs < 1) ? " · conditional pairings noted on hover" : ""}${cupStakesAvailable(c.competition) ? " · hover the next tie for both result and fate chances" : " · fate-by-result chances unavailable in this snapshot"}</span></div>
    ${lateLine(c)}
    <div class="scroll"><table class="sortable"><thead>${head}</thead><tbody>${body}</tbody>
      </table></div>
    <p class="note" style="margin-top:12px">Per cup: ${c.mean_extra_times} ties to extra time,
      ${c.mean_shootouts} to penalties.${dropped
        ? ` ${dropped} team${dropped === 1 ? "" : "s"} already knocked out ${dropped === 1
            ? "is" : "are"} not listed.` : ""}</p></div>`;
}

// Whether a level tie in this cup plays extra time is a per-competition rule measured in
// `cup_bracket.CUP_RULES`, and the payload carries the consequence rather than the flag: a cup
// that plays no extra time still reports a shootout for every level tie.
const ET_TEXT = (c) => c.mean_extra_times > 0.5 ? "extra time, then penalties" : "penalties";

// Which column answers "did they get through the tie in front of them". Not simply the first one
// shown: a preliminary round is one a team is already IN, so its column is 1 for the four sides
// playing it and 0 for everyone waiting, and the tie they are about to play decides the round
// AFTER it. The column that is genuinely in the balance is the first with a probability strictly
// between 0 and 1 for somebody, which is that round in either shape -- asked of the sides CERTAIN
// to be in the first round shown. A club that must still win a qualifying tie the data does not
// hold ("Harrogate Town/Bury") has the first round itself in the balance, and pointing the legend
// there sends the reader to the round being played rather than the one it decides.
function decidedBy(rounds, teams) {
  const first = "p_" + (rounds[0] || "").toLowerCase();
  const sure = teams.filter((t) => t[first] >= 0.9999);
  return rounds.find((r) => (sure.length ? sure : teams).some((t) => {
    const v = t["p_" + r.toLowerCase()];
    return v > 0 && v < 1;
  })) || rounds[0];
}

// What to show, and what to leave out.
//
// A team that has already been knocked out is not in the competition, and a round every surviving
// team has already come through is a column of 100%s -- neither tells a reader anything, and
// together they made the League Cup tab open with 32 rows and a dead first column. So a leading
// round the whole remaining field has cleared is dropped, and with it the teams that went out in
// it.
//
// The zero test is exact rather than a threshold: at the point a round is dropped, every team
// still shown came through it, so a 0 in the NEXT column means the team lost a tie that has
// actually been played. A live team about to play one cannot round to 0.0000 -- that would be a
// tie it wins less than once in 20,000 times.
function trimCup(c) {
  let rounds = (c.rounds || []).slice(), teams = c.teams.slice();
  const before = teams.length;
  while (rounds.length > 1
         && teams.every((t) => t["p_" + rounds[0].toLowerCase()] >= 0.9999)) {
    const nxt = "p_" + rounds[1].toLowerCase();
    teams = teams.filter((t) => t[nxt] > 0);
    rounds = rounds.slice(1);
  }
  return {rounds, teams, dropped: before - teams.length};
}

// Round labels come from the calendar, not a fixed list -- a cup can have a preliminary round
// that feeds the round of 16, and that is not a "smaller" round than the one after it.
const ROUND_NAME = {F: "Final"};
// PR alone when a cup has one preliminary round, PR1 PR2 ... when it has several
const roundName = (r) => ROUND_NAME[r] || (/^PR\d*$/.test(r) ? `Prelim ${r.slice(2)}`.trim() : r);

// Who joins after the first round, and where places go through unplayed. A side exempt to a
// later round has empty columns before it, which reads as a bug unless the page says why; and a
// bye standing in for clubs no fixture names yet is an approximation, so it is stated, not hidden.
function lateLine(c) {
  const late = Object.entries(c.late_entrants || {})
    .map(([r, n]) => `<b>${n}</b> join at the ${roundName(r)}`);
  const byes = Object.entries(c.bye_slots || {})
    .map(([r, n]) => n > 1
      ? `<b>${n}</b> byes in ${roundName(r)} hold places for clubs that enter there but no fixture
         names yet`
      : `one bye in ${roundName(r)}, an odd field`);
  return late.length || byes.length
    ? `<div class="legend"><span>${[...late, ...byes].join("; ")}.</span></div>` : "";
}

// ---------------------------------------------------------------- history
// Position and Points share a shape: a per-team distribution table, then the same quantity as a
// time series underneath. Position reads best with 1 at the top, so its chart is inverted.
// 100+, then five-point bands all the way down: 99–95, 94–90, ... 4–0.
const PTS_BANDS = [[100, Infinity, "100+"]].concat(
  Array.from({length: 20}, (_, i) => { const hi = 99 - i * 5; return [hi - 4, hi, `${hi}–${hi - 4}`]; }));

// Disjoint bands, so a row sums to 100% -- unlike a "90+, 80+" ladder, which double counts.
// Normalised by the row's own total: the stored distribution is rounded to four places, and over
// ~100 bins that rounding alone can move a row off 100% by half a point.
function bandProbs(pts) {
  if (!pts || !pts.dist) return null;
  const raw = PTS_BANDS.map(([lo, hi]) => pts.dist.reduce(
    (acc, p, i) => { const v = i + pts.offset; return acc + ((v >= lo && v <= hi) ? p : 0); }, 0));
  const total = raw.reduce((a, b) => a + b, 0);
  return total > 0 ? raw.map((x) => x / total) : raw;
}

// The three history charts differ only in what they read and how it reads back, so each is a
// spec rather than a branch inside drawHistory. Position is inverted (1st at the top) and bounded
// to real places; title chance is a probability, carried in PERCENTAGE POINTS because an axis of
// 0.25 rounds to "0.3" at one decimal and reads as a different number.
const HIST_POS = (size) => ({metric: "mean_pos", title: "Projected finishing position",
                             invert: true, integer: true, bound: [1, size]});
const HIST_PTS = {metric: "mean_pts", title: "Projected final points", integer: true};
const HIST_WIN = (isLeague) => ({metric: "p_win", scale: 100, unit: "%", bound: [0, 100],
                                 title: isLeague ? "Title chance" : "Tournament win chance"});
const HIST_CUP = {metric: "p_win", scale: 100, unit: "%", bound: [0, 100],
                  title: "Cup win chance"};

// The places that decide something in a competition, as [from, to, tone, label]: a league's
// Champions League places and relegation places, a UEFA league phase's top eight, play-off and out.
function zonesOf(block) {
  if (RESULT.uefa.includes(block)) return UEFA_ZONES;
  const n = block.size || block.teams.length;
  if (perWorldQualification(block)) return [[1, 1, "good", "Title"], [n - (block.relegated ?? 3) + 1, n, "bad", "Rel"]];
  const u = block.ucl_spots ?? 4, e = block.uel_spots ?? 0, c = block.uecl_spots ?? 0;
  return [[1, u, "good", "UCL"], ...(e ? [[u + 1, u + e, "warn", "UEL"]] : []),
          ...(c ? [[u + e + 1, u + e + c, "mid", "UECL"]] : []),
          [n - (block.relegated ?? 3) + 1, n, "bad", "Rel"]];
}
const zoneOf = (place, zones) => (zones.find(([a, b]) => place >= a && place <= b) || [])[2];

// A header row over 1..n naming the zones the places fall in, the gaps left blank.
function zoneHead(n, zones, lead) {
  const cells = [];
  for (let p = 1; p <= n;) {
    const z = zones.find(([a, b]) => p >= a && p <= b);
    const end = z ? Math.min(z[1], n) : Math.min(...zones.map(([a]) => a).filter((a) => a > p), n + 1) - 1;
    cells.push(`<th class="zh ${z ? z[2] : ""}" colspan="${end - p + 1}">${z ? z[3] : ""}</th>`);
    p = end + 1;
  }
  return `<tr>${"<th class=\"zh\"></th>".repeat(lead)}${cells.join("")}</tr>`;
}

// The real table so far: each side's place on points, then goal difference, then goals -- the
// order a Gameweek table takes at a round played in full. Null before anyone has played.
function placesNow(block) {
  const rows = block.teams.filter((t) => t.now);
  if (!rows.some((t) => t.now.pl)) return null;
  const gd = (t) => (t.now.gf ?? 0) - (t.now.ga ?? 0);
  const order = rows.slice().sort((a, b) => b.now.pts - a.now.pts || gd(b) - gd(a)
    || (b.now.gf ?? 0) - (a.now.gf ?? 0) || a.team.localeCompare(b.team));
  return Object.fromEntries(order.map((t, i) => [t.team, i + 1]));
}

// A quantile of a distribution over consecutive values, as the projection takes it: the first
// value the cumulative reaches (`np.searchsorted`).
function quantileOf(dist, offset, q) {
  const tot = dist.reduce((a, b) => a + b, 0) || 1;
  let c = 0;
  for (let i = 0; i < dist.length; i++) { c += dist[i] / tot; if (c >= q - 1e-9) return i + offset; }
  return dist.length - 1 + offset;
}

// What the Position and Points cells are, one choice for both views: the chance of exactly that
// place or band, or of AT LEAST it -- that place or higher, that many points or more. At least
// is the running sum along a row, so it climbs to 100%, and at a zone's last place it is the
// zone's own chance: "at least 5th" is the Champions League column.
const DIST_MODES = [["exact", "Exactly"], ["atleast", "At least"]];
const distRow = () => `<div class="seg small opt" style="margin:0">${DIST_MODES.map(([k, t]) =>
  `<button data-dm="${k}" aria-pressed="${DISTMODE === k}">${t}</button>`).join("")}</div>`;

// The columns of a distribution, best first: places 1..n; a league's five-point bands, high to
// low; a league phase's every total, high to low. Each is [exact label, at-least label, tip, and
// a side -> probability]. Points columns no side reaches (under 0.05% for all) are left off the
// ends: they hold no probability, and twenty-one bands put most of the table in empty cells.
function distCols(block, which, rows) {
  const isPos = which === "position";
  if (isPos) {
    const size = block.size || block.teams.length;
    return Array.from({length: size}, (_, i) => [String(i + 1), String(i + 1),
      [`Finish ${ordinal(i + 1)}`, `Finish ${ordinal(i + 1)} or higher`], (t) => (t.dist || [])[i] || 0]);
  }
  let cols;
  if (RESULT.uefa.includes(block)) {
    const lo = Math.min(...rows.map((t) => t.pts.offset));
    const hi = Math.max(...rows.map((t) => t.pts.offset + t.pts.dist.length - 1));
    cols = Array.from({length: hi - lo + 1}, (_, i) => hi - i).map((v) => [String(v), `${v}+`,
      [`Finish on ${v} points`, `Finish on ${v} points or more`],
      (t) => (t.pts.dist[v - t.pts.offset] || 0) / (t.pts.dist.reduce((a, b) => a + b, 0) || 1)]);
  } else {
    const bands = new Map(rows.map((t) => [t.team, bandProbs(t.pts)]));
    cols = PTS_BANDS.map(([lo, hi, txt], k) => [txt, `${lo}+`,
      [hi === Infinity ? `Finish on ${lo} points or more` : `Finish on ${lo}–${hi} points`,
       `Finish on ${lo} points or more`], (t) => (bands.get(t.team) || [])[k] || 0]);
  }
  const live = cols.map(([, , , p]) => rows.some((t) => p(t) >= 0.0005));
  const a = live.indexOf(true), b = live.lastIndexOf(true);
  return a < 0 ? cols : cols.slice(a, b + 1);
}

// Position and Points: the real table so far, the expected finish with its change since the last
// snapshot and its 80% range, then the distribution, exactly or at least -- and the same quantity
// over time beneath. Leagues and league phases alike; a league phase's points are every total.
function drawDist(block, which) {
  const comp = block.competition;
  const isPos = which === "position", phase = RESULT.uefa.includes(block);
  const size = block.size || block.teams.length;
  const rows = block.teams.filter((t) => isPos || t.pts).slice().sort((a, b) => (isPos
    ? (a.mean_pos ?? a.mean_seed) - (b.mean_pos ?? b.mean_seed) : (b.mean_pts ?? 0) - (a.mean_pts ?? 0))
    || a.team.localeCompare(b.team));
  if (!isPos && !rows.some((t) => t.pts && t.pts.dist)) {
    $("cview").innerHTML = `<div class="panel"><h2>${label(comp)} — points</h2>
      <p class="note">This snapshot has no points distribution — it predates the field. Re-run
      <code>scripts/nightly.py --only project</code>.</p></div>`;
    return;
  }
  const zones = zonesOf(block);
  const at = DISTMODE === "atleast";
  const cols = distCols(block, which, rows);
  const now = rows.some((t) => t.now), places = isPos && now ? placesNow(block) : null;
  const lead = 1 + (now ? 2 : 0) + (places ? 1 : 0) + 4;
  const zcls = (k) => zoneOf(k, zones) ? "z" + zoneOf(k, zones) : "";
  const head = (isPos ? zoneHead(size, zones, lead) : "")
    + `<tr><th class="team">Team</th>${now ? NOW_TH : ""}`
    + (places ? POS_TH : "")
    + (isPos ? XPOS_TH + MOVE_POS_TH() : `<th title="Expected final points">XPTS</th>${MOVE_TH()}`)
    + `<th data-first="${isPos ? "asc" : "desc"}" title="10th–90th percentile: ${isPos ? "the places" : "the points"} it finishes on in 80% of worlds">80% range</th>`
    + `<th style="padding-left:14px"></th>`
    + cols.map(([ex, al, tips], k) => `<th class="${isPos ? zcls(k + 1) : ""}" title="${tips[at ? 1 : 0]}">${at ? al : ex}</th>`).join("")
    + `</tr>`;
  const body = rows.map((t) => {
    let run = 0;
    const cells = cols.map(([, , , p]) => { run += p(t); return heat(at ? run : p(t)); }).join("");
    const [lo, mid, hi] = isPos ? [0.1, 0.5, 0.9].map((q) => quantileOf(t.dist || [], 1, q))
      : [t.pts.p10, t.pts.p50, t.pts.p90];
    return `<tr>${teamTd(t.team)}${now ? nowCells(t) : ""}`
      + (places ? posCell(places, t.team, zones) : "")
      + (isPos ? `<td><b>${fx1(t.mean_pos ?? t.mean_seed)}</b></td>${moveCell(comp, t.team, "mean_pos")}`
        : `<td><b>${fx1(t.mean_pts)}</b></td>${moveCell(comp, t.team, "mean_pts")}`)
      + `<td style="color:var(--dim)" data-v="${mid}">${lo}–${hi}</td>`
      + `<td style="padding:0 0 0 14px"></td>${cells}</tr>`;
  }).join("");
  const what = isPos ? (at ? "there or higher" : "exactly there")
    : at ? (phase ? "at least that total" : "at least the band's lowest total")
    : phase ? "exactly that total" : "inside the band";
  const legend = `<span>${now ? `<b>PL/PTS</b> ${phase ? "league phase" : "table"} so far · ` : ""}${places
      ? "<b>POS</b> place now · " : ""}${isPos ? "<b>XPOS</b> expected place" : "<b>XPTS</b> expected final points"}
      (${moveKey(isPos ? ", ▲ up the table" : "")}) · <b>80% range</b></span>
    <span>Each column: the chance of finishing ${what} · ${at ? "a row climbs to 100%" : "a row sums to 100%"}${isPos
      ? ` · ${zones.map(([a, b, , l]) => `<b>${l}</b> ${a === b ? a : `${a}–${b}`}`).join(" · ")}` : ""}</span>`;
  const title = isPos ? (phase ? "league-phase finish" : "finishing position")
    : phase ? "final league-phase points" : "final points";
  $("cview").innerHTML = `<div class="panel">
      ${panelTitle(`${label(comp)} — ${title}`, `<div><label>Cells</label>${distRow()}</div>`)}
      <div class="legend">${legend}</div>
      <div class="legend"><span class="swatch"></span><span>0 → 100%</span><span>· under 0.05%</span>
        <span>Sort by heading · click a team for its card</span></div>
      ${isPos ? "" : linesStrip(block)}
      <div class="scroll"><table class="sortable${cols.length > 24 ? " wide" : ""}"><thead>${head}</thead>
        <tbody>${body}</tbody></table></div></div>
    <div id="hview"></div>`;
  $("cview").querySelectorAll("[data-dm]").forEach((b) => b.onclick = () => {
    DISTMODE = b.dataset.dm; writeHash(false); drawDist(block, which);
  });
  afterRender();
  drawHistory(comp, isPos ? HIST_POS(size) : HIST_PTS);
}

// A UEFA league phase's final points: six or eight matches make 0..18 or 0..24 short enough to
// show every total rather than bands. The same view as a league's otherwise.
const drawPhasePoints = (u) => drawDist(u, "points");

// ---------------------------------------------------------------- gameweek
// "GW x" is the table going INTO gameweek x -- after round x-1 -- beside each side's round-x
// fixture: the Overview, at any point of the season. "Final" is the table after the last round.
//
// The payload holds each side's MEAN wins, draws, losses, goals for and against after every round
// (`gw_payload`). Each gameweek is its own snapshot of those means in whole numbers, built the
// way a table is: W/D/L is the whole record of PL matches nearest the mean one, goals are the
// means rounded, and PTS and GD follow from them. XPTS beside them is the exact expected points.
// The table sorts on PTS like any table, sides level on points in XPTS order. A round played
// everywhere has integer means, so a past gameweek is the real table.
//
// Consecutive gameweeks are not MADE to chain -- an average over 10,000 seasons is not a season --
// but rounding the counts this way nearly always does: on 20 Oct 2026, all but 15 of 2,819 steps
// where a side played one more projected match were a single result (`render_check` counts them
// nightly). What it gives up is points. A match Arsenal are 69.3/20.4/10.3% in is worth 2.283
// points and a record must call it 3, 1 or 0, so PTS can sit up to 5/3 of a point from XPTS,
// which is why XPTS is shown. Both other ways round were tried and lose:
//   * Bending the record to put PTS within half a point of XPTS pushed a count more than one
//     from its mean in a quarter of rows, and broke the chain in half the steps: Man City read
//     W21 D6 L5 into GW33, then W22 D5 L6.
//   * One representative season, every match given a whole result, chains by construction but
//     drifted up to 3.8 points from XPTS.
//
// Every record with W + D + L = PL is tried (at most 780). The nearest to the means wins, and a
// tie goes to the points nearer XPTS.
function intRecord(pl, w, d, l) {
  const xp = 3 * w + d;
  let best = null;
  for (let W = 0; W <= pl; W++) {
    for (let D = 0; D <= pl - W; D++) {
      const L = pl - W - D;
      const spread = (W - w) ** 2 + (D - d) ** 2 + (L - l) ** 2;
      const off = Math.abs(3 * W + D - xp);
      if (!best || spread < best.spread - 1e-9 || (Math.abs(spread - best.spread) <= 1e-9
                                                   && off < best.off)) {
        best = {W, D, L, spread, off};
      }
    }
  }
  return best;
}

// The gameweek a reader most likely wants first: the earliest round still mostly to play. Not
// simply the earliest with anything unplayed -- a postponed match leaves an old round open for
// weeks (La Liga's round 6 in October 2026), and opening on it would show a stale table.
function defaultGw(g) {
  for (let r = 1; r <= g.rounds; r++) {
    const fx = g.fixtures.filter((f) => f.round === r);
    if (fx.length && fx.filter((f) => !f.result).length * 2 >= fx.length) return r;
  }
  return g.rounds + 1;
}

const signed = (v) => v > 0 ? `+${v}` : v < 0 ? `−${-v}` : "0";

// The table going into gameweek `x` and, unless it is the Final, that round's fixtures.
// When it was decided: `g.clinch` / `g.down` are [team index, round, p] -- the chance the
// round's results clinch that side the title, or send it down. {team: {round: p}}.
function decidedAt(g, key) {
  const out = {};
  for (const [i, r, p] of g[key] || []) (out[g.teams[i]] ||= {})[r] = p;
  return out;
}

// Each side's rating and strength at a gameweek, from `gw.json` (`projection._round_ratings`):
// Elo, then ATT and DEF -- the npxG it would make and concede a match against an average side of
// THIS competition at its scoring level (version 7; before it, the five leagues' average side).
// A round already under way carries the REAL ratings as of its start; a round to
// come, the worlds' own: each side's state going into its match there, averaged over the worlds
// that simulated it (ATT and DEF geometrically), italic, its range across worlds on hover.
// ATT and DEF are not columns here: a world's strength moves average zero, so their projected
// means sit flat across gameweeks and said nothing a round could change. The xG columns that
// replace them do move (`gwXgCells`); the ratings chart still draws ATT and DEF with their spread.
const GW_RATINGS = [["elo", "ELO", 0, "Elo: the results-only rating, going into the round"]];
// which average side a block's ATT and DEF are read against
const refOf = (g) => g && g.rating_scale === "competition" ? "this competition" : "the five leagues";
const Z80 = 1.2816;        // a normal's 10th-90th percentile half-width, in SDs
// An Elo read against an average side: only gaps mean anything in Elo, and a gap is an expected
// score on Elo's own curve (400 points is ten to one), the same in every competition. So the
// rating stays one number on every tab, and the hover says what it is worth here.
const eloExp = (d) => 1 / (1 + Math.pow(10, -d / 400));
const eloVs = (elo, avg, who) => `${signedFx(elo - avg, 0)} v ${who} (${Math.round(avg)}): an expected score of ${eloExp(elo - avg).toFixed(2)} on neutral ground`;
// a block's average Elo going into a round, over the sides that have one there
const eloAvgAt = (g, at) => { const v = (g.elo || []).map((r) => r[at]).filter((x) => x != null);
                              return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
function ratingCell(g, key, i, at, dp) {
  const v = ((g[key] || [])[i] || [])[at];
  if (v == null) return `<td>—</td>`;
  const avg = key === "elo" ? eloAvgAt(g, at) : null;
  const vs = avg != null ? " · " + eloVs(v, avg, "the average side here") : "";
  const real = g.rating_real ? g.rating_real[at] : true;
  const sd = ((g[key === "elo" ? "elo_sd" : key + "_lsd"] || [])[i] || [])[at];
  const day = (g.rating_days || [])[at];
  if (real || sd == null) {
    const why = real ? `the real rating as of ${day || "the round's start"}`
      : "today's: no world plays this side's match here, already played";
    return `<td title="${why}${vs}">${Number(v).toFixed(dp)}</td>`;
  }
  const [lo, hi] = key === "elo" ? [v - Z80 * sd, v + Z80 * sd]
    : [v * Math.exp(-Z80 * sd), v * Math.exp(Z80 * sd)];
  return `<td class="proj" title="projected: ${key === "elo" ? "the mean" : "the geometric mean"} over the worlds going into its match; ${lo.toFixed(dp)}–${hi.toFixed(dp)} in 80% of them${vs}">${Number(v).toFixed(dp)}</td>`;
}

function gwXgCells(g, i, at) {
  const f = g.xgf[i][at], a = g.xga[i][at], p = g.xgpts[i][at];
  return `<td>${f.toFixed(1)}–${a.toFixed(1)}</td><td>${signedFx(f - a, 1)}</td><td>${p.toFixed(1)}</td>`;
}

function gwTable(g, x, worlds, opts = {}) {
  const {tag = "GW", zones = [], before = "Before the season"} = opts;
  // the decision columns sit with the round's fixture. Like the table beside them they read GOING
  // INTO the round: the chance a side's title, or its relegation, was settled before it -- so GW 38
  // is agnostic of the final day's results -- and only climb round to round; the round's own share
  // is on hover, and the Final table's are the title and relegation chances themselves
  const decide = g.clinch ? {title: decidedAt(g, "clinch"), down: decidedAt(g, "down")} : null;
  const final = x > g.rounds;
  const settled = (byRound, team) => {
    let by = 0, now = 0;
    for (const [r, p] of Object.entries(byRound[team] || {})) { if (+r < x) by += p; if (+r === x) now = p; }
    return [by, now];
  };
  const decideCells = (team) => [["title", "champions"], ["down", "relegated"]].map(([k, what]) => {
    const [by, now] = settled(decide[k], team);
    return heatTip(by, final ? `${what}: ${pct(by)}`
      : `${what}, settled before ${tag} ${x}: ${pct(by)} · in ${tag} ${x} itself: ${pct(now)}`);
  }).join("");
  const at = x - 1;
  const rows = g.teams.map((team, i) => {
    const r = intRecord(g.pl[i][at], g.w[i][at], g.d[i][at], g.l[i][at]);
    const gf = Math.round(g.gf[i][at]), ga = Math.round(g.ga[i][at]);
    return {team, i, pl: g.pl[i][at], ...r, gf, ga, gd: gf - ga, pts: 3 * r.W + r.D,
            xpts: 3 * g.w[i][at] + g.d[i][at]};
  // on what it shows, like any table; the exact expectation decides between sides level on points
  }).sort((a, b) => b.pts - a.pts || b.xpts - a.xpts || b.gd - a.gd || b.gf - a.gf
                    || a.team.localeCompare(b.team));
  const fx = {};
  if (!final) {
    for (const f of g.fixtures) {
      if (f.round !== x) continue;
      for (const [team, home] of [[f.home, true], [f.away, false]]) {
        const o = {...orient(f, home), team, keys: g.stakes_of || STAKES_OF[tag === "GW" ? "league" : "uefa"]};
        if (!f.result) {
          const st = roundStep(g, g.teams.indexOf(team), x);
          if (st.xg && st.xg.every((v) => v != null)) { o.pxg = st.xg; o.pxpts = st.xpts; }
        }
        fx[team] = o;
      }
    }
  }
  // ratings ride with the table, as of the same point; a snapshot before version 5 has none
  const rated = Array.isArray(g.elo) && g.elo.length === g.teams.length;
  const rcols = rated ? GW_RATINGS : [];
  // xG for, against and xG points through the round (version 9): real for played matches, each
  // world's drawn npxG plus the competition's penalty xG for projected ones
  const xg = Array.isArray(g.xgf) && g.xgf.length === g.teams.length;
  const xcols = xg ? [["x+/x−", "xG for–against: real for played matches, the worlds' mean for those to come"],
                      ["xGD", "xG difference"],
                      ["xG PTS", "Points the chances would earn (Poisson at each side's xG)"]] : [];
  const tableCols = ["PL", "W", "D", "L", "+/−", "GD", "PTS", "XPTS"];
  // the group row is not sticky: two header rows pinned at top:0 would sit on each other
  const group = `<tr><th colspan="${tableCols.length + xcols.length + rcols.length + 1}"
        style="position:static;text-align:left">${final ? "Final table"
          : x === 1 ? before : `Table after ${tag} ${x - 1}`}</th>`
    + (final ? (decide ? `<th colspan="2" style="position:static;text-align:left;padding-left:14px">Settled</th>` : "")
      : `<th colspan="${NEXT_COLS.length + 1 + (decide ? 2 : 0)}"
        style="position:static;text-align:left;padding-left:14px">${tag} ${x} fixture${decide
          ? " · settled going in" : ""}</th>`) + `</tr>`;
  const head = `<tr><th class="team">Team</th>`
    + tableCols.map((t) => `<th>${t}</th>`).join("")
    + xcols.map(([t, tip]) => `<th title="${tip}">${t}</th>`).join("")
    + rcols.map(([, t, , tip]) => `<th title="${tip}">${t}</th>`).join("")
    + (final ? "" : nextHead("Opponent"))
    + (!decide ? "" : final ? `<th title="The chance this side wins the title">Title</th>
                               <th title="The chance this side is relegated">Down</th>`
      : `<th title="The chance this side's title was settled before ${tag} ${x} (hover a cell for ${tag} ${x} itself)">Title</th>
         <th title="The chance this side's relegation was settled before ${tag} ${x} (hover a cell for ${tag} ${x} itself)">Down</th>`)
    + `</tr>`;
  // the position rides in the team cell, the one column pinned on a horizontal scroll
  // a zone ends under its last place, and the place above the next zone's first
  const ends = new Set(zones.flatMap(([a, b]) => [b, a - 1]).filter((p) => p > 0 && p < rows.length));
  const body = rows.map((r, i) => `<tr>${teamTd(r.team, `<span class="${zoneOf(i + 1, zones)
        ? "z" + zoneOf(i + 1, zones) : ""}" style="color:var(--dim);
        display:inline-block;min-width:1.6em">${i + 1}</span>${r.team}`, ends.has(i + 1) ? "zend" : "")}
      <td>${r.pl}</td><td>${r.W}</td><td>${r.D}</td><td>${r.L}</td>
      <td>${r.gf}–${r.ga}</td><td>${signed(r.gd)}</td><td><b>${r.pts}</b></td>
      <td style="color:var(--dim)">${r.xpts.toFixed(1)}</td>
      ${xg ? gwXgCells(g, r.i, at) : ""}
      ${rcols.map(([k, , dp]) => ratingCell(g, k, r.i, at, dp)).join("")}
      ${final ? "" : fixtureCells(fx[r.team])}${decide ? decideCells(r.team) : ""}</tr>`).join("");
  return `<div class="scroll"><table class="gw"><thead>${group}${head}</thead>
      <tbody>${body}</tbody></table></div>`;
}

// When the title and the relegation places are settled, over the worlds: the first round after
// which no result left could change them. Level on points is not settled (goal difference is
// not), so whatever is still open after the last round was decided on the final day.
function decidedLine(g, x, tag) {
  const sum = (key, f) => (g[key] || []).reduce((a, [, r, p]) => a + (f(r) ? p : 0), 0);
  const last = g.rounds, places = Math.round(sum("down", () => true));
  if (x > last) {
    return `<span><b>Final day</b> decides the title in <b>${pct(sum("clinch", (r) => r === last))}</b>
      of worlds and ${sum("down", (r) => r === last).toFixed(1)} of ${places} relegation places ·
      <b>Title</b>/<b>Down</b> each side's chance over the season</span>`;
  }
  return `<span>Going into <b>${tag} ${x}</b> the title is settled in <b>${pct(sum("clinch", (r) => r < x))}</b>
    of worlds, and in ${pct(sum("clinch", (r) => r === x))} more by its results · ${sum("down", (r) => r < x).toFixed(2)} of ${places}
    relegation places settled · <b>Title</b>/<b>Down</b> each side's chance going in, the round itself on hover</span>`;
}

// What the rating columns are, at this gameweek: real, or the worlds'.
function ratingsLine(g, x, tag) {
  const at = Math.min(x - 1, g.rounds), real = g.rating_real ? g.rating_real[at] : true;
  return `<span>${Array.isArray(g.xgf) ? `<b>x+/x−</b> xG for–against · <b>xGD</b> · <b>xG PTS</b> points the
    chances would earn — to come, the worlds' mean · ` : ""}<b>ELO</b>
    going into the round${real ? "" : ": <i>italic</i> is the worlds' mean, range on hover"}</span>`;
}

// The Gameweek view for a league and the Matchday view for a UEFA league phase: the same table,
// built from the same per-round means, beside each side's fixture in that round.
async function drawRounds(block, kind) {
  const comp = block.competition;
  const want = kind === "league" ? "gw" : "phase";
  if (!GW) {
    $("cview").innerHTML = `<div class="panel"><p class="note">loading ${kind === "league"
      ? "gameweeks" : "matchdays"} …</p></div>`;
    try { GW = await jget("/api/gw?date=" + encodeURIComponent(GW_FOR)); }
    catch (e) {
      $("cview").innerHTML = `<div class="panel"><p class="note">This snapshot has no round-by-round
        detail — it predates the view. Re-run <code>scripts/nightly.py --only project</code>.</p>
        </div>`;
      return;
    }
    if (viewOf(TAB) !== want || TAB !== comp) return;      // moved on while it loaded
  }
  const g = ((kind === "league" ? GW.leagues : GW.phases) || {})[comp];
  if (!g) {
    $("cview").innerHTML = `<div class="panel"><p class="note">No ${kind === "league" ? "gameweek"
      : "matchday"} detail for ${label(comp)} in this snapshot${kind === "league" ? ""
      : " — it predates the League phase view. Re-run <code>scripts/nightly.py --only project</code>"}.</p></div>`;
    return;
  }
  const tag = kind === "league" ? "GW" : "MD";
  const word = kind === "league" ? "gameweek" : "matchday";
  const zones = zonesOf(block);
  const x = Math.min(GWSEL[comp] ?? defaultGw(g), g.rounds + 1);
  const opts = Array.from({length: g.rounds + 1}, (_, i) => i + 1).map((r) =>
    `<option value="${r}"${r === x ? " selected" : ""}>${r > g.rounds ? "Final" : `${tag} ${r}`}</option>`)
    .join("");
  $("cview").innerHTML = `<div class="panel">
      <div class="row" style="justify-content:space-between;margin-bottom:10px">
        <h2 style="margin:0">${label(comp)} — ${x > g.rounds ? (kind === "league" ? "final table"
          : "final league-phase table") : `${word} ${x}`}</h2>
        <div><label for="gwsel">${word[0].toUpperCase() + word.slice(1)}</label>
          <select id="gwsel">${opts}</select></div>
      </div>
      <div class="legend"><span>The average table over ${GW.worlds.toLocaleString()} worlds, in whole
        numbers: <b>W/D/L</b> the record nearest the averages · <b>XPTS</b> exact expected points ·
        sorted on PTS, then XPTS · a played ${word} is the real table</span>
        <span>${zones.map(([a, b, tone, l]) => `<span class="z${tone}">${l}</span> ${a === b ? a : `${a}–${b}`}`)
          .join(" · ")}${kind === "uefa" ? " (UEFA's later tiebreakers not applied)" : ""}</span>
        ${x > g.rounds ? "" : `<span>${tag} ${x} fixture: ${NEXT_KEY} · played: score, xG, ✓ · to come:
          <i>projected xG</i> · hover for the likeliest scores and the stakes</span>`}
        ${g.clinch ? decidedLine(g, x, tag) : ""}
        ${Array.isArray(g.elo) || Array.isArray(g.xgf) ? ratingsLine(g, x, tag) : ""}</div>
      ${gwTable(g, x, GW.worlds, {tag, zones, before: kind === "league" ? "Before the season"
        : "Before the league phase"})}</div>`;
  $("gwsel").onchange = (e) => { GWSEL[comp] = +e.target.value; writeHash(false);
                                 drawRounds(block, kind); };
  afterRender();
}

// Retained sample qualification helpers support source-accounting checks; no sampled-season view.
function sampleEuropeKnown(sample){return ["ucl","uel","uecl"].every(key=>Array.isArray(sample?.europe?.[key]));}
function sampleEurope(sample,team){return sampleEuropeKnown(sample)?["ucl","uel","uecl"].filter(key=>sample.europe[key].includes(team)).join("/"):null;}

// ---------------------------------------------------------------- fixtures
// Every match of a round once, home side first. Played: the score and its xG. To come: the
// result's chances, the likeliest score, the xG (the round's steps in the two sides' run totals)
// and what rides on it -- the biggest swing one result makes to either side's season. Or, by a
// pill, the season's biggest matches still to come.

// The biggest thing a projected match moves (version 10): over both sides and every fate, the
// widest gap between its chances across a win, a draw and a loss. Null before version 10.
function matchSwing(f, keys, rankKeys = null) {
  if (!f.stakes) return null;
  let best = null;
  for (const home of [true, false]) {
    const team = home ? f.home : f.away;
    for (const x of stakesOf(orient(f, home).stakes, keys)) {
      if (rankKeys && !rankKeys.includes(x.key)) continue;
      if (!best || x.swing > best.swing + 1e-12) best = {...x, team};
    }
  }
  return best;
}
const fixDay = (k,competition) => {
  if(WORKSPACE)return WORKSPACE.kickoffLabel(k,competition)+'';
  const text=String(k),d=new Date(/(?:Z|[+-]\d{2}:\d{2})$/i.test(text)?text:text+"Z");
  return Number.isNaN(+d) ? String(k).slice(0, 16)
    : d.toLocaleDateString("en-GB", {weekday: "short", day: "numeric", month: "short",timeZone:"UTC"})
      + " " + String(k).slice(11, 16);
};
// One match as a row: kickoff, home, the score (or the likeliest one), away, H / D / A, xG, and
// the biggest stake with its swing. `lead` cells go first (a round, a competition).
// A list of matches still to play (`score` false) has no Score column: it would be "v" throughout.
function fixtureRow(g, f, keys, lead = "", withScore = true, withWhatif = false, rankKeys = null) {
  const hi = g.teams.indexOf(f.home), ai = g.teams.indexOf(f.away);
  let score, hda, xg, stake = `<td class="tie" style="color:var(--dim)">—</td><td class="mv">—</td>`;
  if (f.result) {
    const [h, a] = f.result;
    const ending = f.outcome === "afterextratime" ? "AET" : f.outcome === "penalties" ? "pens" : "";
    score = `<b>${h}–${a}</b>${ending ? ` <small title="${ending === "AET" ? "Final score after extra time" : "Score before the penalty shootout"}">${ending}</small>` : ""}`;
    hda = [h > a, h === a, h < a].map((x) => `<td>${x ? "✓" : ""}</td>`).join("");
    xg = f.xg ? `<td title="xG ${f.xg[0].toFixed(2)}–${f.xg[1].toFixed(2)}${f.xpts ? ` · xG PTS ${f.xpts[0].toFixed(2)}–${f.xpts[1].toFixed(2)}` : ""}">${f.xg[0].toFixed(1)}–${f.xg[1].toFixed(1)}</td>` : `<td>—</td>`;
  } else {
    // the likeliest score only on hover: nine matches in ten it is 1–1 at around 12%, which says
    // little a row could compare -- the projected xG beside it is the match's predicted score
    score = (f.top || []).length ? `<span style="color:var(--dim)" title="likeliest: ${(f.top || []).map(([sc, p]) => `${sc.replace("-", "–")} ${pct(p)}`).join(", ")}">v</span>` : "v";
    hda = [f.ladder.h1, f.ladder.d, f.ladder.a1].map((p) => `<td>${pct(p)}</td>`).join("");
    const sh = hi >= 0 ? roundStep(g, hi, f.round) : null;
    xg = sh && sh.xg && sh.xg.every((v) => v != null)
      ? `<td class="proj" title="projected xG ${sh.xg[0].toFixed(2)}–${sh.xg[1].toFixed(2)}">${sh.xg[0].toFixed(1)}–${sh.xg[1].toFixed(1)}</td>`
      : `<td>—</td>`;
    const sw = matchSwing(f, keys, rankKeys);
    // A trophy swing in an early cup round can be below half a point; show it when it is
    // visible at this column's 0.1pp precision. Other compact stakes keep their usual cutoff.
    if (sw && sw.swing >= (rankKeys ? 0.0005 : 0.005)) {
      const [w, d, l] = sw.wdl.map((x) => x == null ? "—" : (100 * x).toFixed(rankKeys ? 1 : 0) + "%");
      const tip = [stakesText(orient(f, true).stakes, keys, f.home, rankKeys || []), stakesText(orient(f, false).stakes, keys, f.away, rankKeys || [])]
        .filter(Boolean).join("\n");
      stake = `<td class="tie" style="max-width:none" title="${esc(tip)}"><b>${esc(shortName(sw.team))}</b> ${stakeName(sw.key)}
          <span style="color:var(--dim)">${w} win · ${l} loss</span></td>
        <td data-v="${(100 * sw.swing).toFixed(3)}">${(100 * sw.swing).toFixed(1)}</td>`;
    }
  }
  const whatif = withWhatif ? whatifFixtureButton(g, f, keys) : "";
  const occurrence = Number.isFinite(f.p_occurs) && f.p_occurs < 1
    ? ` title="Pairing occurs in ${pct(f.p_occurs)} of worlds · odds conditional on this pairing"` : "";
  return `<tr data-match="${esc(matchKey(f))}" style="cursor:pointer"${occurrence}>${lead}<td class="tie" style="color:var(--dim);font-size:12px" data-v="${esc(f.kickoff)}">${fixDay(f.kickoff,g.competition)}${whatif}</td>
    ${teamTd(f.home)}${withScore ? `<td style="text-align:center">${score}</td>` : ""}
    <td class="tie" data-team="${esc(f.away)}" style="cursor:pointer">${esc(f.away)}</td>${hda}${xg}${stake}</tr>`;
}
const FIX_HEAD = (lead = "", withScore = true) => `<tr>${lead}<th class="tie">Kickoff</th><th class="team">Home</th>
    ${withScore ? `<th style="text-align:center" title="The score; to come, hover for the likeliest">Score</th>` : ""}
    <th class="tie">Away</th><th title="Home win">H</th><th title="Draw">D</th><th title="Away win">A</th>
    <th title="xG home–away; to come, projected (italic)">xG</th>
    <th class="tie" title="The side and the fate one result moves most: its chance with a win and with a loss">At stake</th>
    <th title="How far that chance moves between the best and worst result, in points">SWING</th></tr>`;
const FIX_KEY = `<span><b>H/D/A</b> result chances (sums to 100%) · <b>xG</b> to come, <i>projected</i> (hover
    <b>v</b> for the likeliest scores) · <b>At stake</b> the side and the fate a result moves most · <b>SWING</b>
    its range from win to loss, in points · hover for both sides' stakes</span>`;

async function drawFixtures(block, kind) {
  const comp = block.competition;
  if (!GW) {
    $("cview").innerHTML = `<div class="panel"><p class="note">loading fixtures …</p></div>`;
    try { GW = await jget("/api/gw?date=" + encodeURIComponent(GW_FOR)); }
    catch (e) {
      $("cview").innerHTML = `<div class="panel"><p class="note">This snapshot has no round-by-round
        detail — it predates the view.</p></div>`;
      return;
    }
    if (viewOf(TAB) !== "fx" || TAB !== comp) return;
  }
  const g = ((kind === "league" ? GW.leagues : GW.phases) || {})[comp];
  if (!g) { $("cview").innerHTML = `<div class="panel"><p class="note">No fixtures for ${label(comp)} in this snapshot.</p></div>`; return; }
  const tag = kind === "league" ? "GW" : "MD", word = kind === "league" ? "gameweek" : "matchday";
  const keys = g.stakes_of || STAKES_OF[kind];
  const staked = g.fixtures.some((f) => f.stakes);
  const big = FXMODE === "big" && staked;
  const x = Math.min(GWSEL[comp] ?? defaultGw(g), g.rounds);
  let rows, lead = "", title;
  if (big) {
    const ranked = g.fixtures.filter((f) => !f.result && f.stakes).map((f) => [f, matchSwing(f, keys)])
      .filter(([, sw]) => sw).sort((a, b) => b[1].swing - a[1].swing || a[0].kickoff.localeCompare(b[0].kickoff)).slice(0, 20);
    lead = `<th title="The round it belongs to">${tag}</th>`;
    rows = ranked.map(([f]) => fixtureRow(g, f, keys, `<td style="color:var(--dim)">${f.round}</td>`, false, true)).join("");
    title = "the biggest matches to come";
  } else {
    rows = g.fixtures.filter((f) => f.round === x).sort((a, b) => a.kickoff.localeCompare(b.kickoff)
      || a.home.localeCompare(b.home)).map((f) => fixtureRow(g, f, keys, "", true, true)).join("");
    title = `${word} ${x}`;
  }
  const opts = Array.from({length: g.rounds}, (_, i) => i + 1).map((r) =>
    `<option value="${r}"${r === x ? " selected" : ""}>${tag} ${r}</option>`).join("");
  const pills = staked ? `<div><label>Show</label><div class="seg small opt" style="margin:0">${[["round", "One " + word],
    ["big", "Biggest to come"]].map(([k, t]) => `<button data-fx="${k}" aria-pressed="${(big ? "big" : "round") === k}">${t}</button>`).join("")}</div></div>` : "";
  const picker = big ? "" : `<div><label for="fxsel">${word[0].toUpperCase() + word.slice(1)}</label><select id="fxsel">${opts}</select></div>`;
  $("cview").innerHTML = `<div class="panel">
      ${panelTitle(`${label(comp)} — ${title}`, pills + picker, false)}
      <div class="legend">${FIX_KEY}<span>${big ? `The 20 matches still to play with the widest swing, of ${g.fixtures.filter((f) => !f.result).length}`
        : "Played: the score, its xG, ✓ the result"} · click a team for its card</span></div>
      <div class="scroll"><table class="sortable"><thead>${FIX_HEAD(lead, !big)}</thead><tbody>${rows}</tbody></table></div>
      ${whatifFixturesHtml(comp)}</div>`;
  wireWhatif($("cview"));
  if (typeof $("cview").querySelectorAll === "function") $("cview").querySelectorAll("[data-whatif-open]").forEach((b) => b.onclick = (ev) => {
    ev.stopPropagation(); WHATIF_FIXTURE = WHATIF_FIXTURE === b.dataset.whatifOpen ? null : b.dataset.whatifOpen;
    drawFixtures(block, kind);
    const panel = $("whatif-fixtures");
    if (panel && typeof panel.scrollIntoView === "function") panel.scrollIntoView({behavior: "smooth", block: "nearest"});
    const choice = panel && typeof panel.querySelector === "function" ? panel.querySelector("[data-whatif-result]") : null;
    if (choice && typeof choice.focus === "function") choice.focus({preventScroll: true});
  });
  if ($("fxsel")) $("fxsel").onchange = (e) => { GWSEL[comp] = +e.target.value; WHATIF_FIXTURE = null; writeHash(false); drawFixtures(block, kind); };
  if (typeof $("cview").querySelectorAll === "function") {
    $("cview").querySelectorAll("[data-fx]").forEach((b) => b.onclick = () => {
      FXMODE = b.dataset.fx; WHATIF_FIXTURE = null; writeHash(false); drawFixtures(block, kind);
    });
  }
  afterRender();
}

// All competitions -> Big matches: each competition's matches with the most riding on them, in
// tab order -- the next seven days after the data cutoff, or the rest of the season. Swings are
// ranked WITHIN a competition, not across: a league phase is eight matches, so each moves a side's
// top-24 chance by ~45 points against ~20 for a league match, and one list across them was all
// Europa and Conference League.
const BIG_PER = {week: 3, season: 5};
const BIG = "Big matches";
function bigMatchRows(group = "seasonal", week = BIGMODE !== "season") {
  const until = new Date(RESULT.as_of + "T00:00:00");
  until.setDate(until.getDate() + 8);
  const stop = until.toISOString().slice(0, 10), all = [];
  const add = (comp, g, f, keys) => {
    if (f.result || !f.stakes || (week && f.kickoff.slice(0, 10) >= stop)) return;
    const sw = matchSwing(f, keys, group === "cup" ? ["win"] : null);
    if (sw) all.push({comp, g, f, keys, sw});
  };
  if (group === "cup") {
    for (const f of MATCHES?.fixtures || []) {
      if (f.kind !== "cup" || !Array.isArray(f.stakes_of) || !f.stakes_of.length
        || String(f.kickoff).slice(0, 10) <= RESULT.as_of) continue;
      add(f.competition, {teams: [f.home, f.away], stakes_of: f.stakes_of}, f, f.stakes_of);
    }
  } else {
    for (const [kind, blocks] of [["league", GW?.leagues || {}], ["uefa", GW?.phases || {}]]) {
      for (const [comp, g] of Object.entries(blocks)) {
        for (const f of g.fixtures || []) add(comp, g, f, g.stakes_of || STAKES_OF[kind]);
      }
    }
  }
  const per = BIG_PER[week ? "week" : "season"];
  const top = COMP_ORDER.flatMap((comp) => all.filter((x) => x.comp === comp)
    .sort((a, b) => b.sw.swing - a.sw.swing || a.f.kickoff.localeCompare(b.f.kickoff)
      || a.f.home.localeCompare(b.f.home) || a.f.away.localeCompare(b.f.away)).slice(0, per));
  return {all, top, stop, per, week};
}
function bigMatchTableRows(top, cups = false) {
  return top.map(({comp, g, f, keys}, k) => {
    const row = fixtureRow(g, f, keys,
      `<td class="tie${top[k + 1] && top[k + 1].comp !== comp ? " zend" : ""}" data-v="${esc(label(comp))}">${label(comp)}</td>`, false, false, cups ? ["win"] : null);
    return cups ? row.replace(/^<tr\b/, `<tr data-big-cup="${esc([comp, matchKey(f)].join("|"))}"`) : row;
  }).join("");
}
function cupBigMatchesHtml(data = bigMatchRows("cup")) {
  const {all, top, stop, per, week} = data, available = cupStakesAvailable();
  const regulation = top.length > 0 && top.every(({f}) => f.score_basis === "90min");
  return `<div class="panel" data-big-cups="${top.length}" data-big-candidates="${all.length}" data-big-cup-fate="win"><h2>Cups</h2>
    <div class="legend">${FIX_KEY}<span>Each cup’s ${per} widest swings, ranked inside it · ${top.length} of ${all.length} drawn ties${week ? ` before ${stop}` : ""}
      · <b>Cup swings show trophy chance</b> · ${regulation ? "90-minute results" : "stored match results"} · hover for every later round · projected cup xG unavailable</span></div>
    ${top.length ? `<div class="scroll"><table class="sortable"><thead>${FIX_HEAD('<th class="tie">Competition</th>', false)}</thead>
      <tbody>${bigMatchTableRows(top, true)}</tbody></table></div>`
      : `<p class="note" data-big-cups-empty="1">${available ? "No cup tie with stakes in this window." : "Cup fate-by-result chances are unavailable in this snapshot."}</p>`}</div>`;
}
async function drawBigMatches() {
  if (!GW) {
    const result = RESULT;
    $("view").innerHTML = `<div class="panel"><p class="note">loading fixtures …</p></div>`;
    try { const data = await jget("/api/gw?date=" + encodeURIComponent(GW_FOR)); if (RESULT === result) GW = data; }
    catch (e) { /* Cups can still be read from matches.json when round detail is unavailable. */ }
    if (RESULT !== result || TAB !== BIG) return;
  }
  const data = bigMatchRows(), {all, top, stop, per, week} = data;
  $("view").innerHTML = (WORKSPACE&&WORKSPACE_SECTION==='home'?workspaceMatchesPickerHtml():'')+`<div class="panel">
      <div class="row" style="justify-content:space-between;margin-bottom:10px">
        <h2 style="margin:0">Big matches — ${week ? "the next seven days" : "the rest of the season"}</h2>
        <div><label>Show</label><div class="seg small opt" style="margin:0">${[["week", "Next 7 days"], ["season", "Rest of the season"]]
          .map(([k, t]) => `<button data-big="${k}" aria-pressed="${(week ? "week" : "season") === k}">${t}</button>`).join("")}</div></div>
      </div>
      <div class="legend">${FIX_KEY}<span>Each league and league phase's ${per} widest swings, ranked inside it ·
        ${top.length} of ${all.length} matches${week ? ` before ${stop}` : ""} · click a team for its card</span></div>
      ${top.length ? `<div class="scroll"><table class="sortable"><thead>${FIX_HEAD('<th class="tie">Competition</th>', false)}</thead><tbody>${bigMatchTableRows(top)}</tbody></table></div>`
        : `<p class="note">${GW ? "No match with stakes in this window — this snapshot predates them." : "League and league-phase fixtures unavailable in this snapshot."}</p>`}</div>${cupBigMatchesHtml(bigMatchRows("cup", week))}`;
  if (typeof $("view").querySelectorAll === "function") {
    $("view").querySelectorAll("[data-big]").forEach((b) => b.onclick = () => {
      BIGMODE = b.dataset.big; writeHash(false); drawBigMatches();
    });
  }
  if(WORKSPACE)wireWorkspaceMatchesPicker();
  afterRender();
}

// ---------------------------------------------------------------- knockout paths
// One side's road through a knockout -- UEFA's after the league phase, or a domestic cup's: how
// far it gets, and in each round, who it is likeliest to meet IF it gets there and how often it
// goes through against each. Meeting odds are shown conditional on playing the round, because
// "if Arsenal reach the quarter-finals, who then?" is the question. The pooled row is every other
// opponent the draw produced. A round's chance of being PLAYED is its rows' meet column summed,
// and of being WON their meet x through, so a cup's byes and late entrants cannot skew either.
const PATH_STAGES = [["PO", "Knockout play-off"], ["R16", "Round of 16"], ["QF", "Quarter-final"],
                     ["SF", "Semi-final"], ["F", "Final"]];
function stageOdds(t) {
  const mid = t.p_mid ?? (t.p_top8 == null ? 0 : 1 - t.p_top8 - t.p_out);
  return {PO: [mid, t.p_r16 - (t.p_top8 ?? 0)], R16: [t.p_r16, t.p_qf], QF: [t.p_qf, t.p_sf],
          SF: [t.p_sf, t.p_f], F: [t.p_f, t.p_win]};
}
// An opponent is an index into the competition's `names` (snapshots before version 4 spelled it)
const oppName = (P, o) => typeof o === "number" ? P.names[o] : o;
function roundOdds(blk) {
  const rows = blk.top.concat(blk.other ? [[null, blk.other[0], blk.other[1]]] : []);
  return [rows.reduce((a, [, m]) => a + m, 0), rows.reduce((a, [, m, q]) => a + m * q, 0)];
}

// `stages` is [[key, name]] in calendar order, `funnel` [[label, probability]].
function pathsHtml(P, pick, stages, funnel, note = "") {
  const path = (P.teams || {})[pick] || {};
  const bars = funnel.map(([l, p]) => `<div class="fbar"><span>${l}</span><div class="track"><i
        style="width:${(100 * (p || 0)).toFixed(1)}%"></i></div><span>${pct(p || 0)}</span></div>`)
    .join("");
  const cards = stages.filter(([k]) => path[k]).map(([k, name]) => {
    const blk = path[k];
    const [reach, through] = roundOdds(blk);
    if (!(reach > 0)) return "";
    const rows = blk.top.map(([o, meet, thr]) => `<tr>${teamTd(oppName(P, o))}
        <td>${pct(meet / reach)}</td>${heat(thr)}</tr>`).join("")
      + (blk.other ? `<tr><td class="team" style="color:var(--dim)">${blk.other[2]} others</td>
          <td style="color:var(--dim)">${pct(blk.other[0] / reach)}</td>${heat(blk.other[1])}</tr>`
        : "");
    return `<div><h3>${name}</h3>
      <p class="note" style="margin:0 0 6px">Plays it in <b>${pct(reach)}</b> of worlds and goes
        through in <b>${pct(through / reach)}</b> of those.</p>
      <table class="narrow"><thead><tr><th class="team">If here, meets</th><th>Chance</th>
        <th title="Goes through against this opponent">Through</th></tr></thead>
        <tbody>${rows}</tbody></table></div>`;
  });
  return `<div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
      <div><h3>How far</h3>${bars}${note ? `<p class="note" style="margin-top:8px">${note}</p>` : ""}
      </div>
      ${cards.join("") || `<p class="note">No knockout round left that it plays in at least
        ${pct(P.min_reach ?? 0.01)} of worlds.</p>`}</div>`;
}

// What a block's Paths view needs: its rounds, how far each side gets, and a line of context.
function pathSpec(block, kind, t) {
  if (kind === "uefa") {
    const o = stageOdds(t);
    return {stages: PATH_STAGES,
            funnel: [["Top 8", t.p_top8], ["Play-off", o.PO[0]], ["Round of 16", t.p_r16],
                     ["Quarter-final", t.p_qf], ["Semi-final", t.p_sf], ["Final", t.p_f],
                     ["Winner", t.p_win]],
            note: `${t.now ? `League phase so far: ${t.now.pts} points from ${t.now.pl}. ` : ""}${
              t.mean_pts != null ? `Expected to finish on ${t.mean_pts.toFixed(1)}, ` : ""}mean seed
              ${t.mean_seed}.`};
  }
  // from the round the side is in or enters, as its card does: a top club skips the preliminaries
  const all = trimCup(block).rounds;
  const rounds = all.slice(Math.max(0, all.findIndex((r) => t["p_" + r.toLowerCase()] > 0)));
  return {stages: rounds.map((r) => [r, roundName(r)]),
          funnel: rounds.map((r) => [roundName(r), t["p_" + r.toLowerCase()]])
            .concat([["Winner", t.p_win]]),
          note: ""};
}

async function drawPaths(block, kind) {
  const comp = block.competition;
  if (!PATHS) {
    $("cview").innerHTML = `<div class="panel"><p class="note">loading knockout paths …</p></div>`;
    try {
      if (PATHS_FOR === "live") throw new Error("this live run carries no paths");
      PATHS = await jget("/api/paths?date=" + encodeURIComponent(PATHS_FOR));
    } catch (e) {
      $("cview").innerHTML = `<div class="panel"><p class="note">This snapshot has no knockout
        paths — it predates the view. Re-run <code>scripts/nightly.py --only project</code>.</p>
        </div>`;
      return;
    }
    if (viewOf(TAB) !== "paths" || TAB !== comp) return;
  }
  const P = ((kind === "uefa" ? PATHS.competitions : PATHS.cups) || {})[comp];
  if (!P) {
    $("cview").innerHTML = `<div class="panel"><p class="note">No knockout paths for
      ${label(comp)} in this snapshot.</p></div>`;
    return;
  }
  const teams = (kind === "cup" ? trimCup(block).teams : block.teams).slice()
    .filter((t) => P.teams[t.team])
    .sort((a, b) => b.p_win - a.p_win || a.team.localeCompare(b.team));
  if (!teams.length) {
    $("cview").innerHTML = `<div class="panel"><p class="note">No side has a knockout round left
      in ${label(comp)}.</p></div>`;
    return;
  }
  const has = (x) => x && teams.some((t) => t.team === x);
  const pick = has(PATHSEL[comp]) ? PATHSEL[comp] : has(FOCUS) ? FOCUS : teams[0].team;
  const t = block.teams.find((x) => x.team === pick);
  const spec = pathSpec(block, kind, t);
  $("cview").innerHTML = `<div class="panel">
      <div class="row" style="justify-content:space-between;margin-bottom:10px">
        <h2 style="margin:0">${label(comp)} — ${pick}'s knockout path</h2>
        <div><label for="pathsel">Team</label><select id="pathsel">${teams.map((x) =>
          `<option value="${esc(x.team)}"${x.team === pick ? " selected" : ""}>${x.team} · win
            ${pct(x.p_win)}</option>`).join("")}</select></div>
      </div>
      <div class="legend"><span>How far ${pick} gets · each round's likeliest opponents <b>if it gets
        there</b>, and how often it goes through · undrawn rounds drawn afresh in every world ·
        rounds under ${pct(P.min_reach ?? 0.01)} left out</span></div>
      ${pathsHtml(P, pick, spec.stages, spec.funnel, spec.note)}</div>`;
  $("pathsel").onchange = (e) => { PATHSEL[comp] = e.target.value; writeHash(false);
                                   drawPaths(block, kind); };
  afterRender();
}

// ---------------------------------------------------------------- trophies
// Every world crowns a champion in every competition, so each team's haul in it is a count -- 0,
// 1, 2 ... -- and a set: which ones. Over the worlds that is a distribution per team, and the
// expected hauls of every team add up to the number of competitions decided, exactly.
// A haul lists its competitions in the page's own order -- league, that country's cups, then
// UEFA -- not alphabetically by their data names, which put the Copa del Rey before La Liga.
const hauls = (comps) => comps.slice().sort((a, b) => COMP_ORDER.indexOf(a) - COMP_ORDER.indexOf(b))
  .map(label).join(" + ");

function drawTrophies(target='view') {
  const T = RESULT.trophies;
  const teams = T.teams.filter((t) => t.mean >= 0.005);
  // most to none, best first like every distribution on the page; the top column pools the rest
  const cols = Math.min(5, Math.max(...teams.map((t) => t.p.length)));
  const ks = Array.from({length: cols}, (_, i) => cols - 1 - i);
  const top = cols - 1;
  const head = `<tr><th class="team">Team</th><th title="Expected trophies">XTROPHIES</th>`
    + ks.map((k) => `<th>${k === top && k >= 3 ? `${k}+` : k}</th>`).join("")
    + `<th class="tie" style="padding-left:14px">Likeliest haul, if any</th><th>Chance</th></tr>`;
  const body = teams.map((t) => {
    const p = ks.map((k) => k === top && k >= 3
      ? t.p.slice(k).reduce((a, b) => a + b, 0) : (t.p[k] || 0));
    const best = t.combos[0];
    return `<tr>${teamTd(t.team)}<td><b>${t.mean.toFixed(2)}</b></td>${p.map(heat).join("")}
      <td class="haul" style="padding-left:14px">${best ? hauls(best[0]) : "—"}</td>
      <td>${best ? pct(best[1]) : ""}</td></tr>`;
  }).join("");
  // the likeliest multi-trophy hauls anywhere: events for different teams are disjoint, since a
  // competition has one champion, so these are plain probabilities of each team doing it
  const multi = T.teams.flatMap((t) => t.combos.filter(([c]) => c.length >= 2)
    .map(([c, p]) => ({team: t.team, comps: c, p}))).sort((a, b) => b.p - a.p).slice(0, 15);
  const mhead = `<tr><th class="team">Team</th><th class="tie">Haul</th><th>Chance</th></tr>`;
  const mbody = multi.map((m) => `<tr>${teamTd(m.team)}<td class="haul">${hauls(m.comps)}</td>
      <td>${pct(m.p)}</td></tr>`).join("");
  $(target).innerHTML = `<div class="panel">
      <h2>Trophies — ${RESULT.worlds.toLocaleString()} simulated seasons, every competition</h2>
      <div class="legend"><span>Every world crowns all ${Math.round(T.per_world)} champions · trophies
        won, most → none (a row sums to 100%) · <b>XTROPHIES</b> sums to ${T.per_world.toFixed(1)}${T.others
          && T.others.teams ? ` (${T.others.teams} rare sides pooled out)` : ""} · a haul is the set won in one world</span>
        <span>Click a team for its card</span></div>
      <div>
        <div class="scroll"><table class="sortable"><thead>${head}</thead><tbody>${body}</tbody>
          </table></div>
        <details><summary>Doubles, trebles and more</summary>
          <div class="scroll"><table class="narrow"><thead>${mhead}</thead><tbody>${mbody}</tbody></table></div>
          <p class="note" style="margin-top:8px">Each the chance of winning exactly that set.</p></details>
      </div></div>`;
  afterRender();
}

// What it takes. A place is won by beating the side below it, so each line is the points of the
// FIRST SIDE OUTSIDE a zone, over the worlds: the runner-up for the title, 6th for a top-five
// place, the top relegated side for survival. Not the champion's total -- that measures the
// champion, not the bar.
const ordinal = (k) => k + ((k % 100 >= 11 && k % 100 <= 13) ? "th"
  : ({1: "st", 2: "nd", 3: "rd"}[k % 10] || "th"));
// The page names each line from its place and the competition's zones, so the wording follows the
// page's own conventions whatever a snapshot's labels said when it was written.
function lineName(block, place) {
  if (RESULT.uefa.includes(block)) {
    return {9: "Top 8 (straight to the R16)", 25: "Top 24 (the play-off)"}[place];
  }
  const n = block.size || block.teams.length;
  const u = block.ucl_spots ?? 4, eu = u + (block.uel_spots ?? 0) + (block.uecl_spots ?? 0);
  if (place === 2) return "Title";
  if (perWorldQualification(block)) return place === n - (block.relegated ?? 3) + 1

      <td title="${eloVs(r.elo, eloAvg, eloWho)}"><b>${Math.round(r.elo)}</b></td>${has0 ? moveTd(p ? r.elo - p[0] : null, 0) : ""}
      <td title="80% range: ${alo.toFixed(2)}–${ahi.toFixed(2)}">${r.att.toFixed(2)}</td>
      <td title="80% range: ${dlo.toFixed(2)}–${dhi.toFixed(2)}">${r.def.toFixed(2)}</td>
      <td data-v="${n.toFixed(4)}"><b>${signedFx(n, 2)}</b></td>${has0 ? moveTd(n0 != null ? n - n0 : null, 2)
        .replace("<td ", `<td title="ATT ${signedFx(r.att - p[1], 2)}, DEF ${signedFx(r.def - p[2], 2)} over ${w.label}" `) : ""}
      <td style="color:var(--dim)" data-v="${(qElo(r, sc) - r.elo).toFixed(1)}">${signedFx(qElo(r, sc) - r.elo, 0)}</td></tr>`;
  }).join("");
  $(target).innerHTML = `<div class="panel">
      <div class="row" style="justify-content:space-between;margin-bottom:10px">
        <h2 style="margin:0">Ratings — ${RATSEL === "all" ? "every side" : label(RATSEL)}, as of ${Rt.as_of}</h2>
        <div class="row" style="gap:12px 18px">
          ${windowsOf().length ? `<div><label>Change over</label>${winRow()}</div>` : ""}
          <div><label for="ratsel">Show</label><select id="ratsel">${opts.map(([k, t]) =>
            `<option value="${esc(k)}"${k === RATSEL ? " selected" : ""}>${t}</option>`).join("")}</select></div>
        </div>
      </div>
      <div class="legend"><span>Against ${ref} (${avgSide.toFixed(2)} npxG both ways) · <b>ELO</b>
        results rating · <b>ATT</b> / <b>DEF</b> npxG made / conceded a match · <b>NET</b> ATT − DEF</span>
        <span>${has0 ? `<b>${dTh}</b> change since ${w.date} · ` : ""}<b>Q−ELO</b> npxG strength in Elo
        points less Elo (above 0: chances beat results) · hover ATT/DEF for an 80% range, ELO for what it
        is worth against ${eloWho} (${Math.round(eloAvg)})</span>
        <span>Sorted on Elo · ${own ? "“Every side” compares across leagues" : "pick a competition for its own scale"}
        · click a team for its card</span></div>
      <div class="scroll"><table class="sortable"><thead>${head}</thead><tbody>${body}</tbody>
        </table></div></div>`;
  if ($("ratsel")) $("ratsel").onchange = (e) => { RATSEL = e.target.value; writeHash(false); drawRatings(target);$("ratsel")?.focus({preventScroll:true}); };
  $(target).querySelectorAll("[data-dw]").forEach((b) => b.onclick = () => {
    DWIN = b.dataset.dw; writeHash(false); drawRatings(target);
  });
  afterRender();
}

// ---------------------------------------------------------------- visualisations
// One chart at a time, picked from a row above it. "To date" charts read the real season so far,
// "projected" ones the worlds; each says which in its legend.
// Every chart, by key. A view offers them in groups -- a row of groups, then the picked group's
// charts -- so the picker stays two short rows however many charts there are. A new chart goes
// into one group here and `vizHtml` below, and nowhere else.
const VIZ_NAMES = {ad: "Attack v defence", rt: "Ratings through the season", ev: "Elo v chance-based strength",
  tmbridge:"Time Machine · Points",tmfates:"Time Machine · Qualification",tmstrength:"Time Machine · Strength",trajectory:"Club trajectory",expectation:"Club points v expectation",quality:"Club chance quality",atlas:"Shot locations",density:"Chance quality grid",xp: "Points v xG points", gx: "Goals v xG", sq: "Shot quality", fm: "Form", pr: "Points race",
  fp: "Final points", ri: "Run-in", ko: "Road to the final", nt: "Next ties", kf: "Likeliest finals",
  entryroutes: "Race Room · Routes", timing: "Race Room · Timing", rivals: "Race Room · Rivals", os: "Outsiders", sw: "Strength v trophy chance"};
const VIZ_SEASON = [["Strength", ["ad", "rt", "ev"]], ["This season", ["xp", "gx", "sq", "fm"]],
                    ["Projection", ["pr", "fp", "ri"]], ["Team performance", ["trajectory", "expectation", "quality"]], ["History", ["tmbridge", "tmfates", "tmstrength"]], ["Race Room", ["rivals", "entryroutes", "timing"]]];
const VIZ_KO = [["Knockouts", ["ko", "nt", "kf", "os", "sw"]]];
const VIZ = VIZ_SEASON.flatMap(([, ks]) => ks.map((k) => [k, VIZ_NAMES[k]]));     // a league's charts
const VIZLAST = {};        // the chart last picked in each group, so a group click returns to it
const VIZOPT = {src: "model", move: true, metric: "elo", marks: "badges", gside: "for", gmeas: "xg",
                sqside: "for", fm: "nd", prgap: false, lsm: "net", rivalTeam: "", rivalOpponent: "", timingRound: "", routeTeam: "", pointTarget:"", ratingReference:"off"};
const HL = {};             // per competition: the sides lit on the ratings chart, in the order picked
const HLCOL = {};          // per competition: team -> PALETTE slot, kept while it stays lit, so a
                           // side keeps its colour when another is added or dropped
const HL_MAX = 4;
const meanOf = (v) => v.reduce((a, b) => a + b, 0) / Math.max(v.length, 1);
// the zone a side's expected place falls in, for its dot's colour
const toneOf = (block, t) => zoneOf(Math.round(t.mean_pos ?? t.mean_seed ?? 0), zonesOf(block)) || null;
const toneFill = (tone) => tone ? `var(--${tone})` : "var(--dim)";
const shortName = team=>ROUTES.shortTeamName(team);
const useBadges = () => VIZOPT.marks === "badges" && Object.keys(BADGES).length > 0;

let VIZ_SETTINGS_OPEN = false;
let VIZ_HIGHLIGHTS_OPEN = false;
let POINTS_VALUES_OPEN = false;
function chartPickerHtml(groups, pick, id = "chart-select") {

    `<optgroup label="${esc(group)}">${charts.map(([key, name]) => `<option value="${key}"${key === pick ? " selected" : ""}>${esc(name)}</option>`).join("")}</optgroup>`).join("")}</select></div>`;
}
const CHART_OPTION_LABELS = {src:"Data",metric:"Rating",marks:"Team marks",gside:"Side",gmeas:"Compare with",sqside:"Side",fm:"Measure",prgap:"Points",lsm:"Strength",rim:"Shade by",pointTarget:"Points target",ratingReference:"Reference"};
function chartOpt(key, choices, selected = VIZOPT[key]) {

    `<option value="${value}"${String(value) === String(selected) ? " selected" : ""}>${esc(name)}</option>`).join("")}</select></div>`;
}
function chartWindowHtml() {
  return `<div class="chart-setting"><label for="chart-window">Tails over</label><select id="chart-window" data-chart-window="1"><option value="none"${!VIZOPT.move ? " selected" : ""}>No tails</option>${windowsOf().map(w=>
    `<option value="${w.key}"${VIZOPT.move && dwin()?.key === w.key ? " selected" : ""}>${winName(w)}</option>`).join("")}</select></div>`;

function chartSettingsHtml(controls) {

function chartHighlightsHtml(chips, count) {

}
function wireChartSettings(body, redraw) {
  if (!body || typeof body.querySelectorAll !== "function") return;
  body.querySelectorAll("select[data-chart-opt]").forEach(el=>el.onchange=()=>{
    POINTS_VALUES_OPEN=body.querySelector("details[data-points-values]")?.open??POINTS_VALUES_OPEN;
    VIZ_SETTINGS_OPEN=el.closest?.("details")?.open ?? VIZ_SETTINGS_OPEN;
    VIZOPT[el.dataset.chartOpt] = el.value === "true" ? true : el.value === "false" ? false : el.value;
    if(el.dataset.chartOpt.startsWith("rival")||["timingRound","routeTeam","pointTarget","ratingReference"].includes(el.dataset.chartOpt))writeHash(false);
    const focusId=el.id; redraw(); if(focusId)$(focusId)?.focus?.({preventScroll:true});
  });

    VIZOPT.move = el.value !== "none";

  });

  const details = body.querySelector("details[data-chart-options]");
  if (details) details.ontoggle=()=>{if(details.isConnected) VIZ_SETTINGS_OPEN=details.open;};
  const slot = $("chart-settings-slot");

}

async function drawViz(block, kind) {
  const comp = block.competition;
  const groups = vizGroups(kind), all = groups.flatMap(([, v]) => v);
  const pick = all.some(([k]) => k === VIZSEL) ? VIZSEL : all[0][0];
  const grp = groups.find(([, v]) => v.some(([k]) => k === pick));
  VIZLAST[grp[0]] = pick;
  $("cview").innerHTML = `<div class="panel chart-panel"><h2>${label(comp)} — visualisations</h2>
    <div class="chart-toolbar">${chartPickerHtml(groups, pick)}<div id="chart-settings-slot"></div></div><div id="vizbody"></div></div>`;
  $("chart-select").onchange = async (ev) => { VIZSEL = ev.target.value; writeHash(false); await drawViz(block, kind); $("chart-select")?.focus({preventScroll:true}); };
  let g = null;
  if (["rt", "pr", "ri", "timing"].includes(pick)) {
    if (!GW) {
      $("vizbody").innerHTML = `<p class="note">loading the season round by round …</p>`;
      try { GW = await jget("/api/gw?date=" + encodeURIComponent(GW_FOR)); }
      catch (e) {
        $("vizbody").innerHTML = `<p class="note">This snapshot has no round-by-round detail.</p>`;
        return;
      }
      if (viewOf(TAB) !== "viz" || TAB !== comp || VIZSEL !== pick) return;   // moved on
    }
    g = ((kind === "league" ? GW.leagues : GW.phases) || {})[comp] || null;
  }
  let P = null;
  if (pick === "kf") {
    if (!PATHS && PATHS_FOR !== "live") {
      $("vizbody").innerHTML = `<p class="note">loading knockout paths …</p>`;
      try { PATHS = await jget("/api/paths?date=" + encodeURIComponent(PATHS_FOR)); }
      catch (e) { PATHS = null; }
      if (viewOf(TAB) !== "viz" || TAB !== comp || VIZSEL !== "kf") return;
    }
    P = PATHS ? ((kind === "uefa" ? PATHS.competitions : PATHS.cups) || {})[comp] || null : null;
  }
  $("vizbody").innerHTML = vizHtml(block, kind, pick, g, P);
  wireViz(block, kind, pick, g, P);
  afterRender();
}

function vizHtml(block, kind, pick, g, P) {
  if (["tmbridge","tmfates","tmstrength"].includes(pick)) return timeMachineRootHtml(block.competition,pick.slice(2));
  if (["trajectory","expectation","quality"].includes(pick)) return performanceRootHtml(block.competition,pick);
  if (pick === "rivals") return vizRivals(block);
  if (pick === "timing") return vizTiming(block,g);
  if (pick === "entryroutes") return vizEntryRoutes(block);
  if (pick === "atlas" || pick === "density") return atlasRootHtml(block.competition,pick,true);
  if (pick === "ko") return vizKO(block);
  if (pick === "nt") return vizNT(block, kind);
  if (pick === "kf") return vizKF(block, kind, P);
  if (pick === "os") return vizOS(block, kind);
  if (pick === "sw") return vizSW(block, kind);
  if (pick === "rt") return vizRT(block, kind, g);
  if (pick === "pr") return vizPR(block, kind, g);
  if (pick === "fm") return vizFM(block, kind, g);
  if (pick === "sq") return vizSQ(block);
  if (pick === "xp") return vizXP(block);
  if (pick === "gx") return vizGX(block);
  if (pick === "fp") return vizFP(block);
  if (pick === "ri") return vizRI(block, kind, g);
  if (pick === "ev") return vizEV(block);
  return vizAD(block);
}

// A row of small toggles, each setting one VIZOPT key.
